// Metrics of one diag tile instance, one row per sweep
message MetricsDiag {
  // Identifier shared by every row of one sweep
  uint64 sample_id = 1;
  // Why a metrics sweep was taken
  MetricsSampleReason sample_reason = 2;
  // Slot that triggered the sweep, 0 for periodic sweeps
  uint64 sample_slot = 3;
  // Snapshot load state
  MetricsSnapctLoadState sample_snapct_state = 4;
  // Whether replay had caught up to the cluster tip when the sweep was taken (replay IsCaughtUp); set once per run, never cleared
  bool sample_caught_up = 5;
  // Tile instances in the sweep, to detect partial sweeps
  uint64 sample_tile_cnt = 6;
  // Index of this tile instance among tiles of its kind
  uint64 kind_id = 7;
  // Process ID of the tile
  uint64 pid = 8;
  // Thread ID of the tile. Same as Pid in production, but might differ in development
  uint64 tid = 9;
  // CPU the tile last ran on
  uint64 last_cpu_index = 10;
  // counter: cumulative since tile start, query deltas. Involuntary context switches
  uint64 context_switch_involuntary = 11;
  // counter: cumulative since tile start, query deltas. Voluntary context switches
  uint64 context_switch_voluntary = 12;
  // counter: cumulative since tile start, query deltas. Major page faults
  uint64 page_fault_major = 13;
  // counter: cumulative since tile start, query deltas. Minor page faults
  uint64 page_fault_minor = 14;
  // Tile lifecycle state: 0=booting, 1=running, 2=shutdown
  MetricsDiagState state = 15;
  // Last wall-clock time the tile heartbeated
  uint64 heartbeat_time = 16;
  // Whether the tile is currently backpressured
  bool is_backpressured = 17;
  // counter: cumulative since tile start, query deltas. Times the tile waited for one or more consumers to catch up to resume publishing
  uint64 backpressure = 18;
  // Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
  MetricsDiagRegimeDurationNanos regime_duration_nanos = 19;
  // Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
  MetricsDiagThreadDurationNanos thread_duration_nanos = 20;
  // Times the tile tried to park while idle (efficient mode), by result
  MetricsDiagParkAttempted park_attempted = 21;
  // counter: cumulative since tile start, query deltas. Device IRQs on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 device_irq = 22;
  // counter: cumulative since tile start, query deltas. TLB shootdowns on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 tlb_shootdown = 23;
  // counter: cumulative since tile start, query deltas. Local timer interrupts (LOC) on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 timer_irq = 24;
  // Bundle subsystem state: 0=disconnected (All bundle tiles disconnected), 1=connecting (At least one bundle tile connecting, none connected or sleeping), 2=connected (At least one bundle tile connected), 3=sleeping (At least one bundle tile sleeping, none connected), 4=disabled (No bundle tiles configured)
  MetricsDiagBundleState bundle_state = 25;
  // Vote subsystem state: 0=disabled (Non-voting or no tower tile), 1=not_started (Tower tile not running or no votes cast yet), 2=delinquent (Vote distance exceeds threshold or vote stalled), 3=voting (Voting normally), 4=inadmissible (Voting, but the vote account fails the validator admission ticket filter)
  MetricsDiagVoteState vote_state = 26;
  // Replay subsystem state: 0=disabled (No replay tile), 1=not_started (Replay tile not running or slots are zero), 2=behind (Replay lagging behind turbine or reset slot stalled), 3=running (Replay keeping up)
  MetricsDiagReplayState replay_state = 27;
  // Turbine subsystem state: 0=disabled (No shred or replay tiles), 1=not_started (Tiles not all running or turbine slot is zero), 2=stalled (Turbine slot not advancing), 3=repair_outpacing (Repair byte throughput exceeds turbine), 4=running (Turbine receiving normally)
  MetricsDiagTurbineState turbine_state = 28;
  // External block builder subsystem state: 0=disabled (No block builder configured), 1=disconnected (Block builder disconnected), 2=connecting (Block builder connection in progress), 3=unhealthy (Connected, but the block builder is not in a usable state), 4=connected (Block builder connected and healthy)
  MetricsDiagBuilderState builder_state = 29;
  // counter: cumulative since tile start, query deltas. Device IRQs across all CPUs
  uint64 system_device_irq = 30;
  // counter: cumulative since tile start, query deltas. Device IRQs on CPUs dedicated to pinned tiles; subset of SystemDeviceIrq
  uint64 device_irq_on_tile_cpu = 31;
  // counter: cumulative since tile start, query deltas. Soft-IRQs across all CPUs, by softirq type
  MetricsDiagSystemSoftirq system_softirq = 32;
  // counter: cumulative since tile start, query deltas. Soft-IRQs on CPUs dedicated to pinned tiles, by softirq type; subset of SystemSoftirq
  MetricsDiagSoftirqOnTileCpu softirq_on_tile_cpu = 33;
  // Hottest CPU package temperature (k10temp Tctl or coretemp Package), 0 if no sensor
  uint64 cpu_package_millicelsius = 34;
  // Hottest NIC ASIC temperature (mlx5 or ice), 0 if no sensor
  uint64 nic_millicelsius = 35;
  // Hottest NVMe composite temperature, 0 if no sensor or the kernel lacks CONFIG_NVME_HWMON
  uint64 nvme_millicelsius = 36;
  // CPU package power from the powercap (RAPL) energy counters, averaged over 5 s, 0 if unavailable
  uint64 cpu_power_microwatts = 37;
  // Whole-system power draw from the ACPI power meter, averaged over its interval, 0 if no meter
  uint64 system_power_microwatts = 38;
  // counter: cumulative since tile start, query deltas. Corrected memory ECC errors across all memory controllers since boot (EDAC), 0 if firmware handles errors instead
  uint64 memory_ecc_corrected = 39;
  // counter: cumulative since tile start, query deltas. Uncorrected memory ECC errors across all memory controllers since boot (EDAC), 0 if firmware handles errors instead
  uint64 memory_ecc_uncorrected = 40;
  // Load average over each window, times 100 (/proc/loadavg has two decimals)
  MetricsDiagSystemLoadCenti system_load_centi = 41;
  // Runnable threads on the host (/proc/loadavg)
  uint64 thread_runnable_count = 42;
  // CPU time summed over all CPUs since the diag tile started, by state (/proc/stat), 10 ms resolution
  MetricsDiagSystemCpuDurationNanos system_cpu_duration_nanos = 43;
  // Host memory available without swapping (/proc/meminfo available)
  uint64 memory_available_bytes = 44;
  // Host memory not in use at all (/proc/meminfo free)
  uint64 memory_free_bytes = 45;
  // counter: cumulative since tile start, query deltas. Bytes swapped in from disk since boot (pswpin)
  uint64 swap_in_bytes = 46;
  // counter: cumulative since tile start, query deltas. Bytes swapped out to disk since boot (pswpout)
  uint64 swap_out_bytes = 47;
  // counter: cumulative since tile start, query deltas. Major page faults across the host since boot (pgmajfault)
  uint64 system_page_fault_major = 48;
  // Processes killed by the kernel OOM killer since boot (oom_kill)
  uint64 oom_killed = 49;
  // Time at least one task stalled waiting for CPU since boot (PSI some), 0 if the kernel lacks PSI
  uint64 cpu_pressure_duration_nanos = 50;
  // Time at least one task stalled on memory reclaim or swap since boot (PSI some), 0 if the kernel lacks PSI
  uint64 memory_pressure_duration_nanos = 51;
  // Time all non-idle tasks stalled on memory together since boot (PSI full), a subset of MemoryPressureDurationNanos
  uint64 memory_pressure_full_duration_nanos = 52;
  // Time at least one task stalled on IO since boot (PSI some), 0 if the kernel lacks PSI
  uint64 io_pressure_duration_nanos = 53;
  // Time all non-idle tasks stalled on IO together since boot (PSI full), a subset of IoPressureDurationNanos
  uint64 io_pressure_full_duration_nanos = 54;
  // Bytes read from the accounts disk since boot (/sys/block stat sectors read), 0 if not on a block device
  uint64 accounts_disk_read_bytes = 55;
  // Bytes written to the accounts disk since boot (/sys/block stat sectors written), 0 if not on a block device
  uint64 accounts_disk_written_bytes = 56;
  // Write requests the accounts disk completed since boot (/sys/block stat writes completed), 0 if not on a block device
  uint64 accounts_disk_written = 57;
  // Time write requests to the accounts disk spent from submission to completion since the diag tile started, summed over requests (/sys/block stat write ticks), 0 if not on a block device
  uint64 accounts_disk_write_duration_nanos = 58;
  // Time the accounts disk had at least one request in flight since the diag tile started (/sys/block stat io_ticks), 0 if not on a block device
  uint64 accounts_disk_busy_duration_nanos = 59;
  // Integral of requests in flight at the accounts disk over time since the diag tile started (request-nanoseconds, /sys/block stat time_in_queue); divide by elapsed time for the average queue depth, 0 if not on a block device
  uint64 accounts_disk_request_in_flight_integral_nanos = 60;
  // Requests the accounts disk had in flight at the last sample (/sys/block stat in_flight), 0 if not on a block device
  uint64 accounts_disk_request_in_flight = 61;
}

