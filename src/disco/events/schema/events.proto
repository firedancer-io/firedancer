// Received packets processed for acknowledgement, by result
message MetricsQuicPktAckProcessed {
  // Packet had no packet number to acknowledge
  uint64 no_pkt_number = 1;
  // New ACK range
  uint64 new_range = 2;
  // Merged into existing ACK range
  uint64 merged = 3;
  // Out of buffers
  uint64 queue_full = 4;
  // ACK suppressed by handler
  uint64 cancelled = 5;
}

// QUIC frames received, by frame type
message MetricsQuicFrameRx {
  // Unknown frame type
  uint64 unknown = 1;
  // ACK frame
  uint64 ack = 2;
  // RESET_STREAM frame
  uint64 reset_stream = 3;
  // STOP_SENDING frame
  uint64 stop_sending = 4;
  // CRYPTO frame
  uint64 crypto = 5;
  // NEW_TOKEN frame
  uint64 new_token = 6;
  // STREAM frame
  uint64 stream = 7;
  // MAX_DATA frame
  uint64 max_data = 8;
  // MAX_STREAM_DATA frame
  uint64 max_stream_data = 9;
  // MAX_STREAMS frame
  uint64 max_streams = 10;
  // DATA_BLOCKED frame
  uint64 data_blocked = 11;
  // STREAM_DATA_BLOCKED frame
  uint64 stream_data_blocked = 12;
  // STREAMS_BLOCKED(bidi) frame
  uint64 streams_blocked = 13;
  // NEW_CONN_ID frame
  uint64 new_conn_id = 14;
  // RETIRE_CONN_ID frame
  uint64 retire_conn_id = 15;
  // PATH_CHALLENGE frame
  uint64 path_challenge = 16;
  // PATH_RESPONSE frame
  uint64 path_response = 17;
  // CONN_CLOSE(transport) frame
  uint64 conn_close_quic = 18;
  // CONN_CLOSE(app) frame
  uint64 conn_close_app = 19;
  // HANDSHAKE_DONE frame
  uint64 handshake_done = 20;
  // PING frame
  uint64 ping = 21;
  // PADDING frame
  uint64 padding = 22;
  // DATAGRAM frame
  uint64 datagram = 23;
}

// Initial packets received, by token type
message MetricsQuicInitialPktRx {
  // No token
  uint64 none = 1;
  // fd_quic retry token
  uint64 retry_token = 2;
  // Token of another length
  uint64 other = 3;
}

// Attempts to acquire packet metadata for transmission, by result
message MetricsQuicPktMetaAcquireAttempted {
  // Success
  uint64 success = 1;
  // Packet metadata pool empty
  uint64 pool_empty = 2;
  // Connection reached its in-flight frame limit
  uint64 conn_limit = 3;
}

// Packets with an unknown connection ID, by packet type
message MetricsQuicPktNoConnDropped {
  // Initial
  uint64 initial = 1;
  // Retry
  uint64 retry = 2;
  // Handshake
  uint64 handshake = 3;
  // 1-RTT
  uint64 one_rtt = 4;
}

// Received packets dropped, by reason
message MetricsQuicPktDropped {
  // QUIC packet too small
  uint64 undersize = 1;
  // QUIC packet too large
  uint64 oversize = 2;
  // Wrong source IP
  uint64 src_ip_mismatch = 3;
  // Invalid QUIC header
  uint64 header_invalid = 4;
  // Invalid IPv4 or UDP header
  uint64 net_header_invalid = 5;
  // Version negotiation or unsupported version
  uint64 version_unsupported = 6;
  // Packet number already received or too old
  uint64 duplicate = 7;
}

// Connection slots in use, by state; sum + ConnFree = ConnCapacity
message MetricsQuicConnUsed {
  // Handshaking peer
  uint64 handshake = 1;
  // Handshake complete, confirming with peer
  uint64 handshake_complete = 2;
  // Active connection
  uint64 active = 3;
  // Peer requested close
  uint64 peer_close = 4;
  // Connection terminating due to error
  uint64 abort = 5;
  // Connection is closing
  uint64 close_pending = 6;
  // Connection about to be freed
  uint64 dead = 7;
}

// Transactions published to verify, by TPU ingress path; excludes all *Dropped
message MetricsQuicTxnRx {
  // TPU/UDP
  uint64 udp = 1;
  // TPU/QUIC unfragmented
  uint64 quic_fast = 2;
  // TPU/QUIC fragmented
  uint64 quic_frag = 3;
}

// Times the tile tried to park while idle (efficient mode), by result
message MetricsQuicParkAttempted {
  // Woken by a doorbell ring
  uint64 ring = 1;
  // Deadline or park cap lapsed
  uint64 deadline = 2;
  // Pre-park recheck found work, did not park
  uint64 pending = 3;
}

// Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
message MetricsQuicThreadDurationNanos {
  // Wait (task was runnable but not scheduled)
  uint64 wait = 1;
  // Idle (task was not runnable)
  uint64 idle = 2;
  // User (task was scheduled and executing in user mode)
  uint64 user = 3;
  // System (task was scheduled and executing in kernel mode)
  uint64 system = 4;
  // Interrupt (CPU time stolen by hardirq/softirq handlers or a hypervisor; fixed tiles only)
  uint64 interrupt = 5;
}

// Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
message MetricsQuicRegimeDurationNanos {
  // Caught up + Housekeeping
  uint64 caught_up_housekeeping = 1;
  // Processing + Housekeeping
  uint64 processing_housekeeping = 2;
  // Backpressure + Housekeeping
  uint64 backpressure_housekeeping = 3;
  // Caught up + Prefrag
  uint64 caught_up_prefrag = 4;
  // Processing + Prefrag
  uint64 processing_prefrag = 5;
  // Backpressure + Prefrag
  uint64 backpressure_prefrag = 6;
  // Caught up + Postfrag
  uint64 caught_up_postfrag = 7;
  // Processing + Postfrag
  uint64 processing_postfrag = 8;
  // Caught up + Sleeping
  uint64 caught_up_sleeping = 9;
  // Backpressure + Sleeping
  uint64 backpressure_sleeping = 10;
}

