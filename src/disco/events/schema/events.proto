syntax = "proto3";

package events.v1;

// The protocol used to submit the transaction (e.g., QUIC, UDP, ...)
enum TxnProtocol {
  TXN_PROTOCOL_UNSPECIFIED = 0;
  TXN_PROTOCOL_QUIC = 1;  // QUIC
  TXN_PROTOCOL_UDP = 2;  // UDP
  TXN_PROTOCOL_GOSSIP = 3;  // Gossip
  TXN_PROTOCOL_BUNDLE = 4;  // Bundle
  TXN_PROTOCOL_TXSEND = 5;  // Internal vote sender
}

// The protocol used to send the shred
enum ShredProtocol {
  SHRED_PROTOCOL_UNSPECIFIED = 0;
  SHRED_PROTOCOL_TURBINE = 1;  // Turbine
  SHRED_PROTOCOL_REPAIR = 2;  // Repair
  SHRED_PROTOCOL_LEADER = 3;  // Leader
}

// Commitment level reached, weakest to strongest: processed, propagated, duplicate, optimistic, super, rooted. ignored is a terminal outcome, not a level. A block never named directly by any vote emits no propagated/duplicate/optimistic/super rows even when confirmed transitively through a descendant, and the transitive walk stops at it, so voted ancestors above it can miss those rows too; all still emit processed and rooted rows.
enum SlotConfirmedLevel {
  SLOT_CONFIRMED_LEVEL_UNSPECIFIED = 0;
  SLOT_CONFIRMED_LEVEL_IGNORED = 1;  // Replay finished a block consensus had already pruned, so no processed row is emitted. Forward vote-level rows for the block may precede this.
  SLOT_CONFIRMED_LEVEL_PROCESSED = 2;  // Replayed locally, on any fork; no cluster stake required. Solana's 'processed' commitment.
  SLOT_CONFIRMED_LEVEL_PROPAGATED = 3;  // More than a third of stake observed the block or a descendant.
  SLOT_CONFIRMED_LEVEL_DUPLICATE = 4;  // More than 52% of stake voted for this exact block or a descendant; the cluster converges on it even if the slot equivocates.
  SLOT_CONFIRMED_LEVEL_OPTIMISTIC = 5;  // More than two thirds of stake voted for the block or a descendant. Solana's 'confirmed' commitment.
  SLOT_CONFIRMED_LEVEL_SUPER = 6;  // More than four fifths of stake voted for the block or a descendant. Used when waiting for a supermajority at boot.
  SLOT_CONFIRMED_LEVEL_ROOTED = 7;  // The block or a descendant reached maximum lockout and cannot be rolled back. The strongest level; Solana's 'finalized' commitment.
}

// How the equivocation was detected.
enum BlockEquivocatedDetection {
  BLOCK_EQUIVOCATED_DETECTION_UNSPECIFIED = 0;
  BLOCK_EQUIVOCATED_DETECTION_DUPLICATE_REPLAY = 1;  // A second, different block for the slot finished replaying locally.
  BLOCK_EQUIVOCATED_DETECTION_CONFIRM_MISMATCH = 2;  // Votes confirmed a block id for the slot that differs from the one this validator replayed.
  BLOCK_EQUIVOCATED_DETECTION_SHRED_PROOF = 3;  // A duplicate-shred proof showed the slot equivocates; the conflicting block id is not known, so sibling_block_id is zero.
}

// Transaction execution error
enum RuntimeTxnTxnErr {
  RUNTIME_TXN_TXN_ERR_UNSPECIFIED = 0;
  RUNTIME_TXN_TXN_ERR_SUCCESS = 1;  // Transaction succeeded
  RUNTIME_TXN_TXN_ERR_ACCOUNT_LOADED_TWICE = 2;  // A Pubkey appears twice in the transaction's account_keys
  RUNTIME_TXN_TXN_ERR_ACCOUNT_NOT_FOUND = 3;  // Attempt to debit an account but found no record of a prior credit
  RUNTIME_TXN_TXN_ERR_PROGRAM_ACCOUNT_NOT_FOUND = 4;  // Attempt to load a program that does not exist
  RUNTIME_TXN_TXN_ERR_INSUFFICIENT_FUNDS_FOR_FEE = 5;  // Fee payer has insufficient lamports to cover the transaction fee
  RUNTIME_TXN_TXN_ERR_INVALID_ACCOUNT_FOR_FEE = 6;  // This account may not be used to pay transaction fees
  RUNTIME_TXN_TXN_ERR_ALREADY_PROCESSED = 7;  // The bank has seen this transaction before
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_NOT_FOUND = 8;  // The bank has not seen the given recent_blockhash or the transaction is too old and the recent_blockhash has been discarded.
  RUNTIME_TXN_TXN_ERR_INSTRUCTION_ERROR = 9;  // An error occurred while processing an instruction, look at exec_err for more details
  RUNTIME_TXN_TXN_ERR_SIGNATURE_FAILURE = 10;  // Transaction did not pass signature verification
  RUNTIME_TXN_TXN_ERR_INVALID_PROGRAM_FOR_EXECUTION = 11;  // This program may not be used for executing instructions
  RUNTIME_TXN_TXN_ERR_SANITIZE_FAILURE = 12;  // Transaction failed to sanitize accounts offsets correctly
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_BLOCK_COST_LIMIT = 13;  // Transaction would exceed max Block Cost Limit
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_ACCOUNT_COST_LIMIT = 14;  // Transaction would exceed max account limit within the block
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_ACCOUNT_DATA_BLOCK_LIMIT = 15;  // Transaction would exceed account data limit within the block
  RUNTIME_TXN_TXN_ERR_TOO_MANY_ACCOUNT_LOCKS = 16;  // Transaction locked too many accounts
  RUNTIME_TXN_TXN_ERR_ADDRESS_LOOKUP_TABLE_NOT_FOUND = 17;  // Transaction loads an address table account that doesn't exist
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_OWNER = 18;  // Transaction loads an address table account with an invalid owner
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_DATA = 19;  // Transaction loads an address table account with invalid data
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_INDEX = 20;  // Transaction address table lookup uses an invalid index
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_VOTE_COST_LIMIT = 21;  // Transaction would exceed max Vote Cost Limit
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_ACCOUNT_DATA_TOTAL_LIMIT = 22;  // Transaction would exceed total account data limit
  RUNTIME_TXN_TXN_ERR_DUPLICATE_INSTRUCTION = 23;  // Transaction contains a duplicate instruction that is not allowed
  RUNTIME_TXN_TXN_ERR_INSUFFICIENT_FUNDS_FOR_RENT = 24;  // Transaction results in an account with insufficient funds for rent
  RUNTIME_TXN_TXN_ERR_MAX_LOADED_ACCOUNTS_DATA_SIZE_EXCEEDED = 25;  // Transaction exceeded max loaded accounts data size cap
  RUNTIME_TXN_TXN_ERR_INVALID_LOADED_ACCOUNTS_DATA_SIZE_LIMIT = 26;  // Transaction requested a zero loaded-accounts-data-size limit
  RUNTIME_TXN_TXN_ERR_UNBALANCED_TRANSACTION = 27;  // Sum of account balances before and after transaction do not match
  RUNTIME_TXN_TXN_ERR_BUNDLE_PEER = 28;  // Transaction was part of a bundle in which another transaction failed
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_NONCE_ALREADY_ADVANCED = 29;  // Durable-nonce txn was rejected because its nonce account has already been advanced
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_FAIL_ADVANCE_NONCE_INSTR = 30;  // Durable-nonce txn failed to advance its nonce account
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_FAIL_WRONG_NONCE = 31;  // Durable-nonce txn's recent_blockhash did not match the stored nonce
  RUNTIME_TXN_TXN_ERR_UNSUPPORTED_VERSION = 32;  // Transaction uses a message version that is not supported
}

// Instruction execution error; success unless txn_err = instruction_error
enum RuntimeTxnExecErr {
  RUNTIME_TXN_EXEC_ERR_UNSPECIFIED = 0;
  RUNTIME_TXN_EXEC_ERR_SUCCESS = 1;  // instruction succeeded
  RUNTIME_TXN_EXEC_ERR_GENERIC_ERR = 2;  // The program instruction returned an error
  RUNTIME_TXN_EXEC_ERR_INVALID_ARG = 3;  // The arguments provided to a program were invalid
  RUNTIME_TXN_EXEC_ERR_INVALID_INSTR_DATA = 4;  // An instruction's data contents were invalid
  RUNTIME_TXN_EXEC_ERR_INVALID_ACC_DATA = 5;  // An account's data contents was invalid
  RUNTIME_TXN_EXEC_ERR_ACC_DATA_TOO_SMALL = 6;  // An account's data was too small
  RUNTIME_TXN_EXEC_ERR_INSUFFICIENT_FUNDS = 7;  // An account's balance was too small to complete the instruction
  RUNTIME_TXN_EXEC_ERR_INCORRECT_PROGRAM_ID = 8;  // The account did not have the expected program id
  RUNTIME_TXN_EXEC_ERR_MISSING_REQUIRED_SIGNATURE = 9;  // A signature was required but not found
  RUNTIME_TXN_EXEC_ERR_ACC_ALREADY_INITIALIZED = 10;  // An initialize instruction was sent to an account that has already been initialized.
  RUNTIME_TXN_EXEC_ERR_UNINITIALIZED_ACCOUNT = 11;  // An attempt to operate on an account that hasn't been initialized.
  RUNTIME_TXN_EXEC_ERR_UNBALANCED_INSTR = 12;  // Program's instruction lamport balance does not equal the balance after the instruction
  RUNTIME_TXN_EXEC_ERR_MODIFIED_PROGRAM_ID = 13;  // Program illegally modified an account's program id
  RUNTIME_TXN_EXEC_ERR_EXTERNAL_ACCOUNT_LAMPORT_SPEND = 14;  // Program spent the lamports of an account that doesn't belong to it
  RUNTIME_TXN_EXEC_ERR_EXTERNAL_DATA_MODIFIED = 15;  // Program modified the data of an account that doesn't belong to it
  RUNTIME_TXN_EXEC_ERR_READONLY_LAMPORT_CHANGE = 16;  // Read-only account's lamports modified
  RUNTIME_TXN_EXEC_ERR_READONLY_DATA_MODIFIED = 17;  // Read-only account's data was modified
  RUNTIME_TXN_EXEC_ERR_EXECUTABLE_MODIFIED = 18;  // Executable bit on account changed, but shouldn't have
  RUNTIME_TXN_EXEC_ERR_NOT_ENOUGH_ACC_KEYS = 19;  // The instruction expected additional account keys
  RUNTIME_TXN_EXEC_ERR_ACC_DATA_SIZE_CHANGED = 20;  // Program other than the account's owner changed the size of the account data
  RUNTIME_TXN_EXEC_ERR_ACC_BORROW_FAILED = 21;  // Failed to borrow a reference to account data, already borrowed
  RUNTIME_TXN_EXEC_ERR_ACC_BORROW_OUTSTANDING = 22;  // Account data has an outstanding reference after a program's execution
  RUNTIME_TXN_EXEC_ERR_CUSTOM_ERR = 23;  // Allows on-chain programs to implement program-specific error types and see them returned by the runtime.
  RUNTIME_TXN_EXEC_ERR_INVALID_ERR = 24;  // The return value from the program was invalid.
  RUNTIME_TXN_EXEC_ERR_EXECUTABLE_ACCOUNT_NOT_RENT_EXEMPT = 25;  // Executable accounts must be rent exempt
  RUNTIME_TXN_EXEC_ERR_UNSUPPORTED_PROGRAM_ID = 26;  // Unsupported program id
  RUNTIME_TXN_EXEC_ERR_CALL_DEPTH = 27;  // Cross-program invocation call depth too deep
  RUNTIME_TXN_EXEC_ERR_MISSING_ACC = 28;  // An account required by the instruction is missing
  RUNTIME_TXN_EXEC_ERR_REENTRANCY_NOT_ALLOWED = 29;  // Cross-program invocation reentrancy not allowed for this instruction
  RUNTIME_TXN_EXEC_ERR_MAX_SEED_LENGTH_EXCEEDED = 30;  // Length of the seed is too long for address generation
  RUNTIME_TXN_EXEC_ERR_INVALID_SEEDS = 31;  // Provided seeds do not result in a valid address
  RUNTIME_TXN_EXEC_ERR_INVALID_REALLOC = 32;  // Failed to reallocate account data of this length
  RUNTIME_TXN_EXEC_ERR_COMPUTE_BUDGET_EXCEEDED = 33;  // Computational budget exceeded
  RUNTIME_TXN_EXEC_ERR_PRIVILEGE_ESCALATION = 34;  // Cross-program invocation with unauthorized signer or writable account
  RUNTIME_TXN_EXEC_ERR_PROGRAM_ENVIRONMENT_SETUP_FAILURE = 35;  // Failed to create program execution environment
  RUNTIME_TXN_EXEC_ERR_PROGRAM_FAILED_TO_COMPLETE = 36;  // Program failed to complete
  RUNTIME_TXN_EXEC_ERR_ACC_IMMUTABLE = 37;  // Account is immutable
  RUNTIME_TXN_EXEC_ERR_INCORRECT_AUTHORITY = 38;  // Incorrect authority provided
  RUNTIME_TXN_EXEC_ERR_BORSH_IO_ERROR = 39;  // Failed to serialize or deserialize account data
  RUNTIME_TXN_EXEC_ERR_ACC_NOT_RENT_EXEMPT = 40;  // An account does not have enough lamports to be rent-exempt
  RUNTIME_TXN_EXEC_ERR_INVALID_ACC_OWNER = 41;  // Invalid account owner
  RUNTIME_TXN_EXEC_ERR_ARITHMETIC_OVERFLOW = 42;  // Program arithmetic overflowed
  RUNTIME_TXN_EXEC_ERR_UNSUPPORTED_SYSVAR = 43;  // Unsupported sysvar
  RUNTIME_TXN_EXEC_ERR_ILLEGAL_OWNER = 44;  // Provided owner is not allowed
  RUNTIME_TXN_EXEC_ERR_MAX_ACCS_DATA_ALLOCS_EXCEEDED = 45;  // Account data allocation exceeded the maximum accounts data size limit
  RUNTIME_TXN_EXEC_ERR_MAX_ACCS_EXCEEDED = 46;  // Max accounts exceeded
  RUNTIME_TXN_EXEC_ERR_MAX_INSN_TRACE_LENS_EXCEEDED = 47;  // Max instruction trace length exceeded
  RUNTIME_TXN_EXEC_ERR_BUILTINS_MUST_CONSUME_CUS = 48;  // Builtin programs must consume compute units
}

// Source kind of exec_err; none unless txn_err = instruction_error
enum RuntimeTxnExecErrKind {
  RUNTIME_TXN_EXEC_ERR_KIND_UNSPECIFIED = 0;
  RUNTIME_TXN_EXEC_ERR_KIND_NONE = 1;  // no instruction error
  RUNTIME_TXN_EXEC_ERR_KIND_EBPF = 2;  // eBPF VM error
  RUNTIME_TXN_EXEC_ERR_KIND_SYSCALL = 3;  // Syscall error
  RUNTIME_TXN_EXEC_ERR_KIND_INSTR = 4;  // Instruction error
}

// Why the block was ruled invalid; not_dead otherwise. Blocks this validator produced are never dead: they do not go through replay's block checks. A block invalid for several independent reasons records the first one detected locally, which can differ across validators for the same block.
enum BlockCompletedDeadReason {
  BLOCK_COMPLETED_DEAD_REASON_UNSPECIFIED = 0;
  BLOCK_COMPLETED_DEAD_REASON_NOT_DEAD = 1;  // Not ruled invalid.
  BLOCK_COMPLETED_DEAD_REASON_PARENT_DEAD = 2;  // The block went down with its lineage: an ancestor was ruled invalid, so this block cannot be replayed.
  BLOCK_COMPLETED_DEAD_REASON_UNPARSEABLE_CONTENT = 3;  // Bytes at the head of the stream failed to parse as any structure (transaction, microblock header, or count) within the largest size a valid block allows: malformed content.
  BLOCK_COMPLETED_DEAD_REASON_SHORT_BLOCK = 4;  // Block bytes ended short of the microblocks and transactions declared.
  BLOCK_COMPLETED_DEAD_REASON_TRAILING_ENTRY = 5;  // Block did not end on a tick; a transaction entry trailed the final tick. Checked before tick-count verification, so a block Agave rules TooFewTicks can report trailing_entry here.
  BLOCK_COMPLETED_DEAD_REASON_TOO_MANY_MICROBLOCKS = 6;  // More microblocks than a valid block can hold.
  BLOCK_COMPLETED_DEAD_REASON_TICK_HASHES_OVERFLOW = 7;  // More hashes since the last tick than hashes per tick allows, detected at tick verification.
  BLOCK_COMPLETED_DEAD_REASON_TICK_HASHES_OVERFLOW_INGEST = 8;  // A microblock header declared more hashes than fit before the next tick, detected at FEC ingest.
  BLOCK_COMPLETED_DEAD_REASON_INCONSISTENT_TICK_HASHES = 9;  // A tick's hash count differs from the block's preceding ticks, detected at FEC ingest.
  BLOCK_COMPLETED_DEAD_REASON_ZERO_HASH_TICK = 10;  // A tick advanced zero hashes, detected at tick verification because proof-of-history parameters were unknown when the tick parsed.
  BLOCK_COMPLETED_DEAD_REASON_ZERO_HASH_TICK_INGEST = 11;  // A tick advanced zero hashes, detected at FEC ingest.
  BLOCK_COMPLETED_DEAD_REASON_ZERO_MICROBLOCKS = 12;  // A batch header declared zero microblocks.
  BLOCK_COMPLETED_DEAD_REASON_TOO_MANY_TXNS = 13;  // More transactions than a valid block can hold.
  BLOCK_COMPLETED_DEAD_REASON_TOO_MANY_TICKS = 14;  // More ticks than allowed.
  BLOCK_COMPLETED_DEAD_REASON_WRONG_HASHES_PER_TICK = 15;  // Tick hash count did not advance the expected hashes per tick.
  BLOCK_COMPLETED_DEAD_REASON_TOO_FEW_TICKS = 16;  // Fewer ticks than required.
  BLOCK_COMPLETED_DEAD_REASON_TICK_HASH_MISMATCH = 17;  // Proof-of-history hash of a tick did not verify.
  BLOCK_COMPLETED_DEAD_REASON_ENTRY_HASH_MISMATCH = 18;  // Proof-of-history hash of a transaction entry did not verify, detected when the entry's hashing task completed.
  BLOCK_COMPLETED_DEAD_REASON_ENTRY_HASH_MISMATCH_INGEST = 19;  // Proof-of-history hash of a transaction entry did not verify, detected at FEC ingest when a later FEC set completed the entry's transactions.
  BLOCK_COMPLETED_DEAD_REASON_SIGVERIFY_FAILED = 20;  // A transaction failed signature verification.
  BLOCK_COMPLETED_DEAD_REASON_TXN_FAILED_TO_LOAD = 21;  // A transaction failed a pre-execution check: already processed, expired or unknown recent blockhash, address lookup table resolution failure, account lock limit, compute budget error, unsupported transaction version or sanitization failure, or fee-payer validation failure.
  BLOCK_COMPLETED_DEAD_REASON_BLOCK_COST_LIMIT = 22;  // A transaction pushed the block over its compute limit.
  BLOCK_COMPLETED_DEAD_REASON_ACCOUNT_COST_LIMIT = 23;  // A transaction pushed one account over its per-block compute limit.
  BLOCK_COMPLETED_DEAD_REASON_VOTE_COST_LIMIT = 24;  // A vote transaction pushed the block over its vote compute limit.
  BLOCK_COMPLETED_DEAD_REASON_ACCOUNT_DATA_LIMIT = 25;  // A transaction pushed the block over its account data size limit.
  BLOCK_COMPLETED_DEAD_REASON_DUPLICATE_ACCOUNT = 26;  // A transaction referenced the same account more than once.
  BLOCK_COMPLETED_DEAD_REASON_BAD_FOOTER = 27;  // An Alpenglow block's footer could not be applied or declared a bank hash that did not match execution.
  BLOCK_COMPLETED_DEAD_REASON_ALPENGLOW_HASH_CNT = 28;  // An Alpenglow block had an entry whose hash count was not exactly one.
  BLOCK_COMPLETED_DEAD_REASON_MISSING_PARENT_MARKER = 29;  // An Alpenglow block carried an entry batch or footer before any block header.
  BLOCK_COMPLETED_DEAD_REASON_MULTIPLE_BLOCK_HEADERS = 30;  // An Alpenglow block carried more than one block header.
  BLOCK_COMPLETED_DEAD_REASON_GENESIS_CERT_OUT_OF_ORDER = 31;  // An Alpenglow genesis certificate marker did not immediately follow the block header.
  BLOCK_COMPLETED_DEAD_REASON_MULTIPLE_BLOCK_FOOTERS = 32;  // An Alpenglow block carried more than one block footer.
  BLOCK_COMPLETED_DEAD_REASON_ENTRY_AFTER_BLOCK_FOOTER = 33;  // An Alpenglow block carried an entry batch other than the alpentick after its footer.
  BLOCK_COMPLETED_DEAD_REASON_INVALID_ALPENTICK_POSITION = 34;  // An Alpenglow block ended without the alpentick directly after its footer.
  BLOCK_COMPLETED_DEAD_REASON_MISSING_BLOCK_FOOTER = 35;  // An Alpenglow block ended without a block footer.
  BLOCK_COMPLETED_DEAD_REASON_SPURIOUS_UPDATE_PARENT = 36;  // An Alpenglow block carried an UpdateParent marker where none is valid: before the header or after the footer.
  BLOCK_COMPLETED_DEAD_REASON_BAD_BLOCK_MARKER = 37;  // An Alpenglow block marker (header, footer, genesis certificate or update parent) failed to parse or had an unknown kind.
  BLOCK_COMPLETED_DEAD_REASON_TOO_MANY_WRITABLE_ACCOUNTS = 38;  // The block's transactions declare more writable accounts than a valid block can afford.
}

// Why this validator gave up on the block before it completed; not_abandoned otherwise. Independent of dead.
enum BlockCompletedAbandonedReason {
  BLOCK_COMPLETED_ABANDONED_REASON_UNSPECIFIED = 0;
  BLOCK_COMPLETED_ABANDONED_REASON_NOT_ABANDONED = 1;  // Not abandoned; the block completed or was ruled invalid.
  BLOCK_COMPLETED_ABANDONED_REASON_PRUNED = 2;  // A block on another fork was rooted, discarding this fork before replay finished.
  BLOCK_COMPLETED_ABANDONED_REASON_EVICTED = 3;  // Dropped for lack of room to track in-progress blocks. The row is emitted once the block's in-flight verification has drained without ruling it invalid; a block ruled invalid while draining emits a dead row instead. May be replayed later, producing a second row for the same slot and block id under a new bank_seq; the retry usually completes but can itself end dead, evicted, or pruned. Blocks evicted after freezing already emitted a completed row and emit nothing further. Dedup on slot and block_id, keeping the highest bank_seq.
  BLOCK_COMPLETED_ABANDONED_REASON_RESET = 4;  // Production of this leader block was abandoned mid-slot: consensus reset block production onto another fork before the slot completed. Only on blocks this validator produced; pack_end_reason is abandoned on the same row. The partial block never finished shredding, so block_id holds the merkle root of the last piece that had returned through reassembly when production was abandoned (may trail the last piece actually shredded), or 0 if none had.
}

// Why block production stopped; not_leader for blocks this validator did not produce.
enum BlockCompletedPackEndReason {
  BLOCK_COMPLETED_PACK_END_REASON_UNSPECIFIED = 0;
  BLOCK_COMPLETED_PACK_END_REASON_NOT_LEADER = 1;  // Not produced by this validator.
  BLOCK_COMPLETED_PACK_END_REASON_TIME = 2;  // The leader slot's time window ended, the normal case. Blocks that filled a consensus limit also end here; measure saturation via pack_block_cost and pack_data_bytes against the protocol caps.
  BLOCK_COMPLETED_PACK_END_REASON_MICROBLOCK_LIMIT = 3;  // Microblock count limit reached.
  BLOCK_COMPLETED_PACK_END_REASON_ABANDONED = 4;  // Production was abandoned mid-slot by a reset onto another fork; only on abandoned leader blocks (abandoned_reason reset). Pack ends the block early and its summary rides on the terminating message, so microblock_count, pack costs, pack timings, and bundle_txn_count reflect what was produced before the abandonment.
}

// Which system C library the validator is running against.
enum BootLibcKind {
  BOOT_LIBC_KIND_UNSPECIFIED = 0;
  BOOT_LIBC_KIND_GLIBC = 1;  // glibc
  BOOT_LIBC_KIND_MUSL = 2;  // musl
  BOOT_LIBC_KIND_UNKNOWN = 3;  // unknown
}

// The named hardware target the binary was compiled for, which fixes the minimum processor it can run on. Distinct from the live processor it is currently running on.
enum BootBuildMachineTarget {
  BOOT_BUILD_MACHINE_TARGET_UNSPECIFIED = 0;
  BOOT_BUILD_MACHINE_TARGET_NATIVE = 1;  // native
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_X86_64 = 2;  // linux_gcc_x86_64
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_ZEN2 = 3;  // linux_gcc_zen2
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_ZEN3 = 4;  // linux_gcc_zen3
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_ZEN4 = 5;  // linux_gcc_zen4
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_ZEN5 = 6;  // linux_gcc_zen5
  BOOT_BUILD_MACHINE_TARGET_LINUX_GCC_ICELAKE = 7;  // linux_gcc_icelake
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_X86_64 = 8;  // linux_clang_x86_64
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_HASWELL = 9;  // linux_clang_haswell
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_ICELAKE = 10;  // linux_clang_icelake
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_ZEN2 = 11;  // linux_clang_zen2
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_ZEN3 = 12;  // linux_clang_zen3
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_ZEN4 = 13;  // linux_clang_zen4
  BOOT_BUILD_MACHINE_TARGET_LINUX_CLANG_ZEN5 = 14;  // linux_clang_zen5
  BOOT_BUILD_MACHINE_TARGET_OTHER = 15;  // other
}

// Which compiler family produced the binary.
enum BootCompiler {
  BOOT_COMPILER_UNSPECIFIED = 0;
  BOOT_COMPILER_GCC = 1;  // Built with gcc.
  BOOT_COMPILER_CLANG = 2;  // Built with clang.
}

// Processor architecture of the host.
enum BootCpuArch {
  BOOT_CPU_ARCH_UNSPECIFIED = 0;
  BOOT_CPU_ARCH_X86_64 = 1;  // x86-64
  BOOT_CPU_ARCH_ARM = 2;  // ARM
  BOOT_CPU_ARCH_UNKNOWN = 3;  // Unlisted or undeterminable.
}

// The maker of the processor.
enum BootCpuVendor {
  BOOT_CPU_VENDOR_UNSPECIFIED = 0;
  BOOT_CPU_VENDOR_INTEL = 1;  // Intel
  BOOT_CPU_VENDOR_AMD = 2;  // AMD
  BOOT_CPU_VENDOR_UNKNOWN = 3;  // Unlisted or undeterminable.
}

// The active frequency-scaling policy, which determines how aggressively the chip clocks up.
enum BootCpufreqGovernor {
  BOOT_CPUFREQ_GOVERNOR_UNSPECIFIED = 0;
  BOOT_CPUFREQ_GOVERNOR_PERFORMANCE = 1;  // performance
  BOOT_CPUFREQ_GOVERNOR_POWERSAVE = 2;  // powersave
  BOOT_CPUFREQ_GOVERNOR_ONDEMAND = 3;  // ondemand
  BOOT_CPUFREQ_GOVERNOR_CONSERVATIVE = 4;  // conservative
  BOOT_CPUFREQ_GOVERNOR_SCHEDUTIL = 5;  // schedutil
  BOOT_CPUFREQ_GOVERNOR_USERSPACE = 6;  // userspace
  BOOT_CPUFREQ_GOVERNOR_UNKNOWN = 7;  // unknown
}

// The kernel driver controlling processor frequency scaling.
enum BootCpufreqDriver {
  BOOT_CPUFREQ_DRIVER_UNSPECIFIED = 0;
  BOOT_CPUFREQ_DRIVER_INTEL_PSTATE = 1;  // intel_pstate
  BOOT_CPUFREQ_DRIVER_INTEL_CPUFREQ = 2;  // intel_cpufreq
  BOOT_CPUFREQ_DRIVER_ACPI_CPUFREQ = 3;  // acpi-cpufreq
  BOOT_CPUFREQ_DRIVER_AMD_PSTATE = 4;  // amd-pstate
  BOOT_CPUFREQ_DRIVER_AMD_PSTATE_EPP = 5;  // amd-pstate-epp
  BOOT_CPUFREQ_DRIVER_CPPC_CPUFREQ = 6;  // cppc_cpufreq
  BOOT_CPUFREQ_DRIVER_UNKNOWN = 7;  // unknown
}

// Energy-performance preference in force on the frequency driver; a balance profile under governor performance silently caps sustained clocks.
