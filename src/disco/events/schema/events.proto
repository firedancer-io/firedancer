// Metrics of one rotor tile instance, one row per sweep
message MetricsRotor {
  // Identifier shared by every row of one sweep
  uint64 sample_id = 1;
  // Why a metrics sweep was taken
  MetricsSampleReason sample_reason = 2;
  // Slot that triggered the sweep, 0 for periodic sweeps
  uint64 sample_slot = 3;
  // Snapshot load state
  MetricsSnapctLoadState sample_snapct_state = 4;
  // Whether replay had caught up to the cluster tip when the sweep was taken (replay IsCaughtUp); set once per run, never cleared
  bool sample_caught_up = 5;
  // Tile instances in the sweep, to detect partial sweeps
  uint64 sample_tile_cnt = 6;
  // Index of this tile instance among tiles of its kind
  uint64 kind_id = 7;
  // Process ID of the tile
  uint64 pid = 8;
  // Thread ID of the tile. Same as Pid in production, but might differ in development
  uint64 tid = 9;
  // CPU the tile last ran on
  uint64 last_cpu_index = 10;
  // counter: cumulative since tile start, query deltas. Involuntary context switches
  uint64 context_switch_involuntary = 11;
  // counter: cumulative since tile start, query deltas. Voluntary context switches
  uint64 context_switch_voluntary = 12;
  // counter: cumulative since tile start, query deltas. Major page faults
  uint64 page_fault_major = 13;
  // counter: cumulative since tile start, query deltas. Minor page faults
  uint64 page_fault_minor = 14;
  // Tile lifecycle state: 0=booting, 1=running, 2=shutdown
  MetricsRotorState state = 15;
  // Last wall-clock time the tile heartbeated
  uint64 heartbeat_time = 16;
  // Whether the tile is currently backpressured
  bool is_backpressured = 17;
  // counter: cumulative since tile start, query deltas. Times the tile waited for one or more consumers to catch up to resume publishing
  uint64 backpressure = 18;
  // Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
  MetricsRotorRegimeDurationNanos regime_duration_nanos = 19;
  // Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
  MetricsRotorThreadDurationNanos thread_duration_nanos = 20;
  // Times the tile tried to park while idle (efficient mode), by result
  MetricsRotorParkAttempted park_attempted = 21;
  // counter: cumulative since tile start, query deltas. Device IRQs on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 device_irq = 22;
  // counter: cumulative since tile start, query deltas. TLB shootdowns on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 tlb_shootdown = 23;
  // counter: cumulative since tile start, query deltas. Local timer interrupts (LOC) on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 timer_irq = 24;
  // Network packets sent, including requests, pings and pongs
  uint64 pkt_tx = 25;
  // Signed repair messages queued, by type; window types send one per missing shred (up to 32), others one per attempt
  MetricsRotorRequestTx request_tx = 26;
  // Highest slot fully delivered to replay, 0 if none
  uint64 highest_delivered_slot = 27;
  // Highest slot a shred was received for, 0 if none
  uint64 highest_received_slot = 28;
  // First turbine slot seen, the catchup target, 0 if none
  uint64 first_turbine_slot = 29;
  // Blocks in the eager, notar and final block treaps, waiting for discovery
  uint64 block_pending = 30;
  // Pending request attempts awaiting a response; a hedge is another attempt
  uint64 request_in_flight = 31;
  // FEC sets published to replay
  uint64 fec_delivered = 32;
  // Shreds received at or below the root, ignored
  uint64 shred_old_ignored = 33;
  // Data shreds received as repair responses, by the pending request they matched
  MetricsRotorShredRx shred_rx = 34;
  // Alpenglow repair metadata responses received
  uint64 meta_rx = 35;
  // Metadata responses that failed to decode
  uint64 meta_malformed_rejected = 36;
  // Metadata responses matching no outstanding request
  uint64 meta_unsolicited_rejected = 37;
  // ParentFecSetCount responses accepted
  uint64 parent_fec_set_count_accepted = 38;
  // ParentFecSetCount responses that failed verification
  uint64 parent_fec_set_count_failed = 39;
  // FecSetRoot responses accepted
  uint64 fec_set_root_accepted = 40;
  // FecSetRoot responses that failed verification
  uint64 fec_set_root_failed = 41;
  // Root advanced messages received from replay
  uint64 replay_root_advanced_rx = 42;
  // Missing FEC messages received from replay, each a from-root reconsume
  uint64 replay_missing_fec_rx = 43;
  // Pings rejected, by reason
  MetricsRotorPingRejected ping_rejected = 44;
  // Time from sending a repair request to receiving its response
  MetricsRotorResponseLatencyNanos response_latency_nanos = 45;
  // Delay scheduled before a request's next attempt: its peer's hedge time, 16.8 ms to 100 ms, 16.8 ms after an escape
  MetricsRotorRetryDelayNanos retry_delay_nanos = 46;
  // Timeouts in the eager, notar and final timeout queues
  uint64 timeout_pending = 47;
  // Timeouts dropped because their block is gone or their work is done
  uint64 timeout_cancelled = 48;
  // Timeouts deferred because no peer could be picked
  uint64 timeout_no_peer_deferred = 49;
  // Request attempts after the first for the same timer
  uint64 request_hedged = 50;
  // Pending requests with no response after about 1 s (PENDING_TTL); a peer is banned for 10 s after 32 in a row, pending-pool evictions not counted
  uint64 request_expired = 51;
  // Requests sent to elicit a ping from a peer with a new address
  uint64 ping_probe_tx = 52;
  // Cluster-wide wait for turbine before a missing FEC set is repaired (srtt+4*rttvar, clamped to 20-250 ms; 250 ms until sampled)
  uint64 eager_delay_nanos = 53;
  // Messages in the sign pool waiting for a signature from the sign tiles
  uint64 sign_request_pending = 54;
  // Highest slot past the window with a verified cert, the staked catchup target, 0 if none
  uint64 catchup_slot = 55;
  // WindowIndexForBlockId requests that expired unanswered, at or above the root
  uint64 request_by_id_expired = 56;
  // Retries sent to a random staked peer because 3 attempts in a row brought no new shred of the FEC set
  uint64 request_stuck_escaped = 57;
  // Peers banned for 10 s after 4 WindowIndexForBlockId requests in a row expired, whatever their other replies
  uint64 peer_by_id_banned = 58;
  // Request attempts sent after 3 or more earlier attempts for the same timer
  uint64 request_late_retried = 59;
  // Uncapped hedge time (srtt+4*rttvar, 100 ms if unmeasured) of each staked peer an escaped retry was sent to
  MetricsRotorEscapePeerHedgeDelayNanos escape_peer_hedge_delay_nanos = 60;
  // Of TimeoutNoPeerDeferred, retries of a block not known only from turbine, which pick only staked peers: every staked peer was banned, without an address or at its in-flight limit
  uint64 timeout_no_staked_peer_deferred = 61;
  // Timeouts put back without sending a request, by reason, one per deferral
  MetricsRotorTimeoutDeferred timeout_deferred = 62;
  // Timeouts dropped because their role's timeout queue was full; the block goes back to its treap and the work is discovered again
  uint64 timeout_queue_full_dropped = 63;
  // Identity switches that halted signing; no request, ping or pong is signed until the switch completes and unhalts
  uint64 signing_halted = 64;
  // Time the earliest due timeout has waited past its due time when metrics were written, 0 if none is due; grows while signing is halted or fewer than 40 sign slots are free
  uint64 timeout_overdue_nanos = 65;
  // First certified slot in the window seen by a staked node, which starts its catchup, 0 if none yet
  uint64 first_cert_slot = 66;
  // Blocks whose discovery stopped because their role's timeout queue filled; the block goes back to its treap and its remaining FEC sets are queued later
  uint64 timeout_queue_full_paused = 67;
}

