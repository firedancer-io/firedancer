  // Addition pseudo transactions the dispatcher handed out as ready
  uint64 sched_lthash_add_surfaced = 137;
  // Addition pseudo transactions surfaced after a later write made them stale, completed without hashing
  uint64 sched_lthash_add_stale_surfaced = 138;
  // Additions handed to an exec tile
