// What kind of vote is this.
enum AlpenglowVoteKind {
  ALPENGLOW_VOTE_KIND_UNSPECIFIED = 0;
  ALPENGLOW_VOTE_KIND_NOTAR = 1;  // Cast on the slot's first block once its parent is ready at a window start, or once we notarized its parent in the previous slot (Algorithm 2, Definition 15).
  ALPENGLOW_VOTE_KIND_FINAL = 2;  // Cast once the block we notarized has a notarization cert and we cast no skip or fallback vote in the slot (Algorithm 2, Definition 18). Names only the slot.
  ALPENGLOW_VOTE_KIND_SKIP = 3;  // Cast for every unvoted slot of the leader window on timeout (Definition 17), or on SafeToNotar or SafeToSkip (Algorithm 1). Names only the slot.
  ALPENGLOW_VOTE_KIND_NOTAR_FALLBACK = 4;  // Cast on SafeToNotar. At most three per slot (Definition 12).
  ALPENGLOW_VOTE_KIND_SKIP_FALLBACK = 5;  // Cast on SafeToSkip. Names only the slot.
}

// Why we cast the vote, based on the Alpenglow voting algorithm (not_our_vote if it is not ours). References: Algorithms 1 and 2, Definitions 15, 16 and 17.
enum AlpenglowVoteReason {
  ALPENGLOW_VOTE_REASON_UNSPECIFIED = 0;
  ALPENGLOW_VOTE_REASON_NOT_OUR_VOTE = 1;  // Not our vote; see our_vote.
  ALPENGLOW_VOTE_REASON_BLOCK_REPLAYED = 2;  // Replay completed the block normally, so we vote notar for it.
  ALPENGLOW_VOTE_REASON_PARENT_READY = 3;  // We hold the certs that make a block a valid parent for the leader window starting at this slot (a notar, notar-fallback or fast-final cert for it, or it is finalized, and skip certs for every slot in between), so we vote notar for the window's first block we held pending.
  ALPENGLOW_VOTE_REASON_BLOCK_NOTARIZED = 4;  // We hold a notar cert for the block we voted notar for and cast no skip or fallback vote in the slot, so we vote final for it.
  ALPENGLOW_VOTE_REASON_TIMEOUT = 5;  // The slot's timeout fired with no vote cast in it, so we vote skip on the entire rest of the window containing this slot.
  ALPENGLOW_VOTE_REASON_SAFE_TO_NOTAR = 6;  // No block but this one can be fast-finalized in the slot: notar votes for it reach 40% of stake, or 20% with skip votes bringing the total to 60%, and its parent is notar-fallback certified (Definition 16). Having voted skip or notar for another block in the slot, we vote notar-fallback for it and skip every unvoted slot of the window.
  ALPENGLOW_VOTE_REASON_SAFE_TO_SKIP = 7;  // No block can be fast-finalized in the slot: skip votes plus notar votes for every block but the most-voted one reach 40% of stake (Definition 16). Having voted notar in the slot, we vote skip-fallback for it and skip every unvoted slot of the window.
  ALPENGLOW_VOTE_REASON_REWARD = 8;  // Our notar or skip vote sent to the leader of slot+8, who packs the slot's reward cert, apart from the broadcast, and resent every probe timeout until that leader acknowledges it or we replay slot+8.
  ALPENGLOW_VOTE_REASON_REWARD_ACKED = 9;  // The leader of slot+8 acknowledged a packet carrying our notar or skip vote, which ends its reward resends. The row timestamp is when the acknowledgement arrived; broadcast_to is empty.
  ALPENGLOW_VOTE_REASON_REWARD_NO_CONNECTION = 10;  // We are trying to cast a notar or skip vote whose reward (slot+8) leader we have no active connection to. The problematic gossip ip and port is in broadcast_to.
}

// What we did with the vote. unknown_peer and banned_peer are decided on the connection before the vote is decoded, shred_version_mismatch and unranked_peer after decoding, in that order; the rest are Alpenglow-specific validation.
enum AlpenglowVoteProcessingResult {
  ALPENGLOW_VOTE_PROCESSING_RESULT_UNSPECIFIED = 0;
  ALPENGLOW_VOTE_PROCESSING_RESULT_UNKNOWN_PEER = 1;  // The connection had no known peer: we cleared its identity while closing it, or accepted it before we knew the epoch's validators.
  ALPENGLOW_VOTE_PROCESSING_RESULT_BANNED_PEER = 2;  // The peer is banned for an earlier invalid signature or cert; connection closed.
  ALPENGLOW_VOTE_PROCESSING_RESULT_SHRED_VERSION_MISMATCH = 3;  // Signed under a different shred version than ours.
  ALPENGLOW_VOTE_PROCESSING_RESULT_UNRANKED_PEER = 4;  // The peer has no rank in the slot's epoch.
  ALPENGLOW_VOTE_PROCESSING_RESULT_SLOT_TOO_OLD = 5;  // The slot is more than eight slots behind our finality frontier, or in an earlier epoch we have no stake information for.
  ALPENGLOW_VOTE_PROCESSING_RESULT_SLOT_TOO_NEW = 6;  // The slot is beyond our look-ahead window, or in an epoch we have no stake information for.
  ALPENGLOW_VOTE_PROCESSING_RESULT_SLASHABLE = 7;  // Conflicts with a vote the peer already cast for the slot (Lemma 22, Definition 12).
  ALPENGLOW_VOTE_PROCESSING_RESULT_DUPLICATE = 8;  // We already stored this vote or one that covers it: notar and notar-fallback for one block, skip and skip-fallback (Definition 12); ignored.
  ALPENGLOW_VOTE_PROCESSING_RESULT_IGNORED_REDUNDANT = 9;  // We already hold a valid cert for the slot, or block, this vote would count toward; ignored.
  ALPENGLOW_VOTE_PROCESSING_RESULT_ACCEPTED = 10;  // Vote is accepted and next step is to aggregate (and broadcast, if our_vote).
}

// What kind of cert is this.
enum AlpenglowCertKind {
  ALPENGLOW_CERT_KIND_UNSPECIFIED = 0;
  ALPENGLOW_CERT_KIND_FINAL = 1;  // FinalVote aggregate that sums >= 60% of stake, for slot. There is guaranteed to be one unique notarized block_id Final corresponds to.
  ALPENGLOW_CERT_KIND_FAST_FINAL = 2;  // NotarVote aggregate that sums >= 80% of stake, for block_id; finalizes it in one round.
  ALPENGLOW_CERT_KIND_NOTAR = 3;  // NotarVote aggregate that sums >= 60% of stake, for block_id (BlockNotarized; Definition 15).
  ALPENGLOW_CERT_KIND_NOTAR_FALLBACK = 4;  // NotarVote or NotarFallbackVote aggregate that sums >= 60% of stake, for block_id. At most four blocks per slot (Lemma 48).
  ALPENGLOW_CERT_KIND_SKIP = 5;  // SkipVote or SkipFallbackVote aggregate that sums >= 60% of stake, for slot.
}

// What we did with the cert. unknown_peer and banned_peer are decided on the connection before the cert is decoded, shred_version_mismatch and unranked_peer after decoding, in that order; the rest are Alpenglow-specific.
enum AlpenglowCertProcessingResult {
  ALPENGLOW_CERT_PROCESSING_RESULT_UNSPECIFIED = 0;
  ALPENGLOW_CERT_PROCESSING_RESULT_UNKNOWN_PEER = 1;  // The connection had no known peer: we cleared its identity while closing it, or accepted it before we knew the epoch's validators.
  ALPENGLOW_CERT_PROCESSING_RESULT_BANNED_PEER = 2;  // The peer is banned for an earlier invalid signature or cert; connection closed.
  ALPENGLOW_CERT_PROCESSING_RESULT_SHRED_VERSION_MISMATCH = 3;  // Signed under a different shred version than ours.
  ALPENGLOW_CERT_PROCESSING_RESULT_UNRANKED_PEER = 4;  // The peer has no rank in the slot's epoch.
  ALPENGLOW_CERT_PROCESSING_RESULT_SLOT_TOO_OLD = 5;  // The slot is behind our finality frontier, or in an earlier epoch we have no stake information for.
  ALPENGLOW_CERT_PROCESSING_RESULT_SLOT_TOO_NEW = 6;  // The slot is beyond our look-ahead window, or in an epoch we have no stake information for.
  ALPENGLOW_CERT_PROCESSING_RESULT_DUPLICATE = 7;  // We already held a cert of this kind for the slot, or for this block if notar_fallback; we keep one per kind (Definition 13), so we dropped the copy without verifying it. The common case: every node broadcasts each cert it accepts. Recorded for notar certs only.
  ALPENGLOW_CERT_PROCESSING_RESULT_IGNORED_REDUNDANT = 8;  // We already hold a valid cert that supersedes this one, e.g. a fast-finalization cert for the block a notarization cert arrives for; ignored.
  ALPENGLOW_CERT_PROCESSING_RESULT_FAILED_BLS_VERIFY = 9;  // The signers' stake is below the threshold (Table 6), a signer rank is outside the epoch, or the aggregate BLS signature is invalid; peer banned.
  ALPENGLOW_CERT_PROCESSING_RESULT_ACCEPTED = 10;  // BLS verified (stake threshold of Table 6 and aggregate BLS signature) and stored as the first cert of its kind for the slot, then broadcast to our peers (Definition 13); see broadcast_start_time and broadcast_to.
}

