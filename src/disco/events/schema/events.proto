enum RepairRequestOutcome {
  REPAIR_REQUEST_OUTCOME_UNSPECIFIED = 0;
  REPAIR_REQUEST_OUTCOME_ANSWERED = 1;  // Its shred arrived, or its metadata reply passed its proof. A highest_window_index or orphan reply that does not complete the slot carries a nonce the shred tile cannot verify, and is dropped unmatched if its shred or FEC set is already held.
  REPAIR_REQUEST_OUTCOME_EXPIRED = 2;  // The deadline (about 1 s after req_time) passed with no answer. Counts toward banning the peer only if no message of the same pick was answered, see ban.
  REPAIR_REQUEST_OUTCOME_UNANSWERABLE = 3;  // The deadline passed with no answer to a highest_window_index or orphan message, or to a message for a slot at or below the root, including one rooted while in flight; never bans.
  REPAIR_REQUEST_OUTCOME_BAD = 4;  // A metadata reply from the peer's address failed its proof; the peer is banned for 10 s.
  REPAIR_REQUEST_OUTCOME_EVICTED = 5;  // Dropped unsettled because the pending request table was full; ours, not the peer's; never bans.
  REPAIR_REQUEST_OUTCOME_SUPERSEDED = 6;  // A highest_window_index or orphan message with no answer whose answer arrived another way before the deadline: the block's length, or its parent's ancestry, became known; a reply may have been a shred already held, dropped unmatched; never bans.
}

// Whether and why settling this message's pick banned the peer for 10 s. A pick settles once at the deadline, so every message of a pick left unanswered then carries the same ban.
enum RepairRequestBan {
  REPAIR_REQUEST_BAN_UNSPECIFIED = 0;
  REPAIR_REQUEST_BAN_NONE = 1;  // Not banned.
  REPAIR_REQUEST_BAN_BY_ID = 2;  // Its 4th window_index_for_block_id pick in a row expired with no by-id answer.
  REPAIR_REQUEST_BAN_STREAK = 3;  // Its 32nd pick in a row expired with no answer of any kind.
  REPAIR_REQUEST_BAN_BAD_PROOF = 4;  // Its metadata reply failed its proof.
}

// How the peer was picked.
enum RepairRequestPick {
  REPAIR_REQUEST_PICK_UNSPECIFIED = 0;
  REPAIR_REQUEST_PICK_FIRST = 1;  // First attempt: the fastest available peer, an unmeasured one every 16th pick.
  REPAIR_REQUEST_PICK_HEDGE = 2;  // A later attempt, after the last peer's hedge time, preferring any peer but the last one asked.
  REPAIR_REQUEST_PICK_STAKED_HEDGE = 3;  // A later attempt for a block not known only from turbine, from staked peers only.
  REPAIR_REQUEST_PICK_ESCAPE = 4;  // A later attempt after 3 in a row brought no new shred of the FEC set: a random peer among the top 100 stake ranks, higher ranks likelier.
}

// Role of the block asked about in its slot when sent.
enum RepairRequestRole {
  REPAIR_REQUEST_ROLE_UNSPECIFIED = 0;
  REPAIR_REQUEST_ROLE_EAGER = 1;  // Neither the slot's notarized nor finalized block: turbine's block, or another block of the slot known by id.
  REPAIR_REQUEST_ROLE_NOTAR = 2;  // The slot's first notarized, or stronger, block.
  REPAIR_REQUEST_ROLE_FINAL = 3;  // The slot's finalized block.
}

