message MetricsPackBundleCrankAttempted {
  // On-chain state was already up to date
  uint64 up_to_date = 1;
  // Inserted an initializer bundle to update the on-chain state
  uint64 inserted = 2;
  // Tried to insert an initializer bundle to update the on-chain state, but creation failed
  uint64 creation_failed = 3;
  // Tried to insert an initializer bundle to update the on-chain state, but insertion failed
  uint64 insertion_failed = 4;
}

// Times a pending transaction was considered for a microblock, by outcome; one transaction may be considered many times
message MetricsPackTxnScheduleAttempted {
  // Pack included the transaction in the microblock
  uint64 taken = 1;
  // Pack skipped the transaction because it would have exceeded the block CU limit
  uint64 cu_limit = 2;
  // Pack skipped the transaction because of an account conflict found by the fast bitvector check
  uint64 conflict_fast = 3;
  // Pack skipped the transaction because it would have exceeded the block data size limit
  uint64 byte_limit = 4;
  // Pack skipped the transaction because it would have exceeded the data allocation limit
  uint64 alloc_limit = 5;
  // Pack skipped the transaction because it would have caused a writable account to exceed the per-account block write cost limit
  uint64 write_cost = 6;
  // Pack skipped the transaction because of an account conflict found by the full check
  uint64 conflict_slow = 7;
  // Pack skipped the transaction because it exceeded the per-account block write cost limit too many times before
  uint64 write_cost_deferred = 8;
}

// Pending transactions in pack's pool, by type
message MetricsPackTxnPendingUsed {
  // Transactions in the main treap
  uint64 regular = 1;
  // Deprecated, always 0 since Firedancer v26.11.
  uint64 vote = 2;
  // Transactions that write to a hotly-contended account
  uint64 conflicting = 3;
  // Transactions that are part of a bundle
  uint64 bundle = 4;
}

// Transactions dropped from pack after insertion, by reason
message MetricsPackTxnDropped {
