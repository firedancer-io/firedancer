  REPAIR_REQUEST_TYPE_WINDOW_INDEX = 1;  // Shreds of one FEC set, by slot and index.
  REPAIR_REQUEST_TYPE_HIGHEST_WINDOW_INDEX = 2;  // The highest shred a peer holds of a slot, to learn the block's length.
  REPAIR_REQUEST_TYPE_ORPHAN = 3;  // The ancestry of a slot whose parent block is not held.
