// One repair request message this validator sent to a peer, reported once when it settles: its answer arrived, its metadata reply was checked, the deadline passed (PENDING_TTL, about 1 s after req_time), or it was evicted. Each message asks for one thing: a window_index or window_index_for_block_id pick sends one message per missing shred of the FEC set, so one row each, sharing peer, req_time, attempt and pick; the other kinds are one message per pick. A hedge or retry to another peer is another pick. Messages never sent have no row; see the rotor tile's Timeout* and SigningHalted metrics, and TimeoutOverdueNanos for sign slot starvation. Emitted by the rotor tile.
message RepairRequest {
  // Validator identity of the peer asked.
  bytes peer_identity = 1;
  // IPv4 address the request was sent to, stored as an IPv4-mapped IPv6 address.
  bytes peer_ip = 2;
  // UDP port the request was sent to: the peer's serve-repair port in gossip when sent.
  uint32 peer_port = 3;
  // The peer's stake rank in the current epoch when the message settled, 0 for the most staked, as ranked by the repair strategy (65535 if unstaked or no longer known).
  uint32 peer_rank = 4;
  // Kind of request.
  RepairRequestType type = 5;
  // Slot of the block asked about.
  uint64 slot = 6;
  // Block id of the block asked about; all zeros for turbine's block until it completes.
  bytes block_id = 7;
  // For window_index and window_index_for_block_id, the index of the shred the message asked for. For fec_set_root, index of the first shred of the FEC set asked about. For highest_window_index, the shred index sent: the first index past the highest FEC set received; the peer answers only if it holds a shred at or past it, or the slot is complete. 0 for orphan and parent_and_fec_set_count.
  uint32 shred_idx = 8;
  // When the message was queued for signing; it leaves once its signature returns, so res_time - req_time includes sign latency.
  uint64 req_time = 9;
  // When this message's answer was received off the network (by the shred tile for shreds, the net tile for metadata replies); for bad, when the reply that failed its proof arrived; 0 if none.
  uint64 res_time = 10;
  // How the message settled.
  RepairRequestOutcome outcome = 11;
  // Whether and why settling this message's pick banned the peer for 10 s. A pick settles once at the deadline, so every message of a pick left unanswered then carries the same ban.
  RepairRequestBan ban = 12;
  // Earlier picks for the same request before this one, 0 for the first; at most 255.
  uint32 attempt = 13;
  // How the peer was picked.
  RepairRequestPick pick = 14;
  // Role of the block asked about in its slot when sent.
  RepairRequestRole role = 15;
}

