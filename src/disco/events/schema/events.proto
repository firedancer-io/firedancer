// Reception detail for one FEC set. A zero timestamp means the stage was never reached or its stamp was unavailable.
message BlockReceivedFecSets {
  // Merkle root of the FEC set: its identity. The final FEC set's merkle root is the block id.
  bytes merkle_root = 1;
  // Index of the FEC set's first data shred within the block; FEC sets are listed in block order, so for a fully received block the indices ascend from 0 without gaps.
  uint32 index = 2;
  // Bitmap of data shreds of the FEC set received (vs recovered). Bit j set if the data shred with data index j was received.
  uint32 data_shreds_received_mask = 3;
  // Bitmap of parity shreds of the FEC set received (vs recovered). Bit j set if the parity shred with parity index j was received.
  uint32 parity_shreds_received_mask = 4;
  // Bitmap of data shreds of the FEC set received via repair. Bit j set if the data shred with data index j arrived via repair.
  uint32 repair_shreds_received_mask = 5;
  // Number of duplicate shreds received for this FEC set; best-effort given upstream deduplication.
  uint32 duplicate_shred_count = 6;
  // Timestamp when the first shred of this FEC set arrived at the shred tile.
  uint64 first_shred_received_time = 7;
  // Timestamp when the FEC set was complete (assembled).
  uint64 completed_time = 8;
  // The source of the final shred that completed the FEC set.
  BlockReceivedFecSetsFinalShredSource final_shred_source = 9;
}

