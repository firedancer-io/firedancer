  uint64 instr_too_many_accounts = 1;
  // Bundle with two conflicting durable nonce transactions
  uint64 nonce_conflict = 2;
  // Transaction uses an account on the account blocklist
  uint64 account_blocklisted = 3;
  // Transaction uses an account on the bundle blocklist
  uint64 bundle_blocklisted = 4;
  // Transaction is an invalid durable nonce transaction
  uint64 invalid_nonce = 5;
  // Transaction tries to write to a sysvar
  uint64 write_sysvar = 6;
  // Estimating compute cost or fee failed
  uint64 estimation_failed = 7;
  // Transaction included an account address twice
  uint64 duplicate_account = 8;
  // Transaction tried to load too many accounts
  uint64 too_many_accounts = 9;
  // Transaction requests too many CUs
  uint64 too_many_cu = 10;
  // Transaction already expired
  uint64 expired = 11;
  // Transaction loads accounts from a lookup table, which is not supported here
  uint64 lut_unsupported = 12;
  // Fee payer's balance below transaction fee
  uint64 unaffordable = 13;
  // Pack aware of transaction with same signature
  uint64 duplicate = 14;
  // Transaction's fee was too low given its compute unit requirement and another competing transactions that uses the same durable nonce
  uint64 nonce_priority_too_low = 15;
  // Transaction's fee was too low given its compute unit requirement and other competing transactions
  uint64 priority_too_low = 16;
  // Transaction added to pending transactions
  uint64 nonvote_add = 17;
  // Simple vote transaction was added to pending transactions
