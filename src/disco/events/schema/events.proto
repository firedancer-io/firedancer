  // Applied additions subtracted back out after a later write
  uint64 sched_lthash_add_undone = 142;
  // Speculative additions created
  uint64 sched_lthash_spec_created = 143;
  // Speculative additions applied; a subset of SchedLthashAddApplied
  uint64 sched_lthash_spec_applied = 144;
  // Speculative additions invalidated before they applied
  uint64 sched_lthash_spec_invalidated = 145;
  // Lane map entries inserted, each owing one out-of-band lthash subtraction
  uint64 sched_lthash_sub_owed = 146;
  // Subtractions handed to an exec tile
  uint64 sched_lthash_sub_dispatched = 147;
  // Subtraction results subtracted from a block's delta
  uint64 sched_lthash_sub_applied = 148;
  // Accounts whose out-of-band lthash subtraction and addition are in the delta of a block whose end task completed
  uint64 sched_lthash_account_frozen = 149;
  // Out-of-band lthash work thrown away when a block was abandoned or demoted, or picked in-band hashing, by type
  MetricsReplaySchedLthashWorkDropped sched_lthash_work_dropped = 150;
  // Deactivations of a block that still owed additions because the speculation pool had no free entry; a subset of the no-work reason of SchedBlockDeactivated
