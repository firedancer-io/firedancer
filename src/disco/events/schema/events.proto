  uint64 txn_leader = 6;
  // No microblock: leader, no transactions, execle available
  uint64 execle_leader = 7;
  // No microblock: leader, transactions available, execle available (all conflicting)
  uint64 txn_execle_leader = 8;
  // Scheduled a microblock: not leader, no transactions, no available execle
  uint64 microblock = 9;
  // Scheduled a microblock: not leader, transactions available, no available execle
