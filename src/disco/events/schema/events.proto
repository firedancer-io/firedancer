syntax = "proto3";

package events.v1;

// The protocol used to submit the transaction (e.g., QUIC, UDP, ...)
enum TxnProtocol {
  TXN_PROTOCOL_UNSPECIFIED = 0;
  TXN_PROTOCOL_QUIC = 1;  // QUIC
  TXN_PROTOCOL_UDP = 2;  // UDP
  TXN_PROTOCOL_GOSSIP = 3;  // Gossip
  TXN_PROTOCOL_BUNDLE = 4;  // Bundle
  TXN_PROTOCOL_TXSEND = 5;  // Internal vote sender
}

// The protocol used to send the shred
enum ShredProtocol {
  SHRED_PROTOCOL_UNSPECIFIED = 0;
  SHRED_PROTOCOL_TURBINE = 1;  // Turbine
  SHRED_PROTOCOL_REPAIR = 2;  // Repair
  SHRED_PROTOCOL_LEADER = 3;  // Leader
}

// The commitment level reached, from weakest to strongest: processed, propagated, duplicate, optimistic, super, rooted. ignored is a separate terminal outcome rather than a strengthening level.
enum SlotConfirmedLevel {
  SLOT_CONFIRMED_LEVEL_UNSPECIFIED = 0;
  SLOT_CONFIRMED_LEVEL_IGNORED = 1;  // Replay finished a block that consensus had already pruned, so it never reached any commitment level.
  SLOT_CONFIRMED_LEVEL_PROCESSED = 2;  // Replayed locally on the majority fork, with no cluster stake required. Equivalent to Solana's 'processed' commitment.
  SLOT_CONFIRMED_LEVEL_PROPAGATED = 3;  // More than a third of stake has observed the block, confirming it has propagated.
  SLOT_CONFIRMED_LEVEL_DUPLICATE = 4;  // At least 52% of stake voted for this exact block, guaranteeing the cluster converges on it even when a slot equivocates.
  SLOT_CONFIRMED_LEVEL_OPTIMISTIC = 5;  // More than two thirds of stake voted for the block. Equivalent to Solana's 'confirmed' commitment.
  SLOT_CONFIRMED_LEVEL_SUPER = 6;  // More than four fifths of stake voted for the block. Used when waiting for a supermajority at boot.
  SLOT_CONFIRMED_LEVEL_ROOTED = 7;  // The block or a descendant reached maximum lockout and can never be rolled back. The strongest level, equivalent to Solana's 'finalized' commitment.
}

// How the equivocation was detected.
enum BlockEquivocatedDetection {
  BLOCK_EQUIVOCATED_DETECTION_UNSPECIFIED = 0;
  BLOCK_EQUIVOCATED_DETECTION_DUPLICATE_REPLAY = 1;  // A second, different block for the slot finished replaying locally.
  BLOCK_EQUIVOCATED_DETECTION_CONFIRM_MISMATCH = 2;  // Votes confirmed a block id for the slot that differs from the one this validator replayed.
  BLOCK_EQUIVOCATED_DETECTION_SHRED_PROOF = 3;  // A duplicate-shred proof showed the slot equivocates; the conflicting block id is not known, so sibling_block_id is zero.
}

// Transaction execution error
enum RuntimeTxnTxnErr {
  RUNTIME_TXN_TXN_ERR_UNSPECIFIED = 0;
  RUNTIME_TXN_TXN_ERR_SUCCESS = 1;  // Transaction succeeded
  RUNTIME_TXN_TXN_ERR_ACCOUNT_LOADED_TWICE = 2;  // A Pubkey appears twice in the transaction's account_keys
  RUNTIME_TXN_TXN_ERR_ACCOUNT_NOT_FOUND = 3;  // Attempt to debit an account but found no record of a prior credit
  RUNTIME_TXN_TXN_ERR_PROGRAM_ACCOUNT_NOT_FOUND = 4;  // Attempt to load a program that does not exist
  RUNTIME_TXN_TXN_ERR_INSUFFICIENT_FUNDS_FOR_FEE = 5;  // Fee payer has insufficient lamports to cover the transaction fee
  RUNTIME_TXN_TXN_ERR_INVALID_ACCOUNT_FOR_FEE = 6;  // This account may not be used to pay transaction fees
  RUNTIME_TXN_TXN_ERR_ALREADY_PROCESSED = 7;  // The bank has seen this transaction before
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_NOT_FOUND = 8;  // The bank has not seen the given recent_blockhash or the transaction is too old and the recent_blockhash has been discarded.
  RUNTIME_TXN_TXN_ERR_INSTRUCTION_ERROR = 9;  // An error occurred while processing an instruction, look at exec_err for more details
  RUNTIME_TXN_TXN_ERR_SIGNATURE_FAILURE = 10;  // Transaction did not pass signature verification
  RUNTIME_TXN_TXN_ERR_INVALID_PROGRAM_FOR_EXECUTION = 11;  // This program may not be used for executing instructions
  RUNTIME_TXN_TXN_ERR_SANITIZE_FAILURE = 12;  // Transaction failed to sanitize accounts offsets correctly
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_BLOCK_COST_LIMIT = 13;  // Transaction would exceed max Block Cost Limit
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_ACCOUNT_COST_LIMIT = 14;  // Transaction would exceed max account limit within the block
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_ACCOUNT_DATA_BLOCK_LIMIT = 15;  // Transaction would exceed account data limit within the block
  RUNTIME_TXN_TXN_ERR_TOO_MANY_ACCOUNT_LOCKS = 16;  // Transaction locked too many accounts
  RUNTIME_TXN_TXN_ERR_ADDRESS_LOOKUP_TABLE_NOT_FOUND = 17;  // Transaction loads an address table account that doesn't exist
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_OWNER = 18;  // Transaction loads an address table account with an invalid owner
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_DATA = 19;  // Transaction loads an address table account with invalid data
  RUNTIME_TXN_TXN_ERR_INVALID_ADDRESS_LOOKUP_TABLE_INDEX = 20;  // Transaction address table lookup uses an invalid index
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_MAX_VOTE_COST_LIMIT = 21;  // Transaction would exceed max Vote Cost Limit
  RUNTIME_TXN_TXN_ERR_WOULD_EXCEED_ACCOUNT_DATA_TOTAL_LIMIT = 22;  // Transaction would exceed total account data limit
  RUNTIME_TXN_TXN_ERR_DUPLICATE_INSTRUCTION = 23;  // Transaction contains a duplicate instruction that is not allowed
  RUNTIME_TXN_TXN_ERR_INSUFFICIENT_FUNDS_FOR_RENT = 24;  // Transaction results in an account with insufficient funds for rent
  RUNTIME_TXN_TXN_ERR_MAX_LOADED_ACCOUNTS_DATA_SIZE_EXCEEDED = 25;  // Transaction exceeded max loaded accounts data size cap
  RUNTIME_TXN_TXN_ERR_INVALID_LOADED_ACCOUNTS_DATA_SIZE_LIMIT = 26;  // Transaction requested a zero loaded-accounts-data-size limit
  RUNTIME_TXN_TXN_ERR_UNBALANCED_TRANSACTION = 27;  // Sum of account balances before and after transaction do not match
  RUNTIME_TXN_TXN_ERR_BUNDLE_PEER = 28;  // Transaction was part of a bundle in which another transaction failed
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_NONCE_ALREADY_ADVANCED = 29;  // Durable-nonce txn was rejected because its nonce account has already been advanced
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_FAIL_ADVANCE_NONCE_INSTR = 30;  // Durable-nonce txn failed to advance its nonce account
  RUNTIME_TXN_TXN_ERR_BLOCKHASH_FAIL_WRONG_NONCE = 31;  // Durable-nonce txn's recent_blockhash did not match the stored nonce
}

// Instruction execution error; success unless txn_err = instruction_error
enum RuntimeTxnExecErr {
  RUNTIME_TXN_EXEC_ERR_UNSPECIFIED = 0;
  RUNTIME_TXN_EXEC_ERR_SUCCESS = 1;  // instruction succeeded
  RUNTIME_TXN_EXEC_ERR_GENERIC_ERR = 2;  // The program instruction returned an error
  RUNTIME_TXN_EXEC_ERR_INVALID_ARG = 3;  // The arguments provided to a program were invalid
  RUNTIME_TXN_EXEC_ERR_INVALID_INSTR_DATA = 4;  // An instruction's data contents were invalid
  RUNTIME_TXN_EXEC_ERR_INVALID_ACC_DATA = 5;  // An account's data contents was invalid
  RUNTIME_TXN_EXEC_ERR_ACC_DATA_TOO_SMALL = 6;  // An account's data was too small
  RUNTIME_TXN_EXEC_ERR_INSUFFICIENT_FUNDS = 7;  // An account's balance was too small to complete the instruction
  RUNTIME_TXN_EXEC_ERR_INCORRECT_PROGRAM_ID = 8;  // The account did not have the expected program id
  RUNTIME_TXN_EXEC_ERR_MISSING_REQUIRED_SIGNATURE = 9;  // A signature was required but not found
  RUNTIME_TXN_EXEC_ERR_ACC_ALREADY_INITIALIZED = 10;  // An initialize instruction was sent to an account that has already been initialized.
  RUNTIME_TXN_EXEC_ERR_UNINITIALIZED_ACCOUNT = 11;  // An attempt to operate on an account that hasn't been initialized.
  RUNTIME_TXN_EXEC_ERR_UNBALANCED_INSTR = 12;  // Program's instruction lamport balance does not equal the balance after the instruction
  RUNTIME_TXN_EXEC_ERR_MODIFIED_PROGRAM_ID = 13;  // Program illegally modified an account's program id
  RUNTIME_TXN_EXEC_ERR_EXTERNAL_ACCOUNT_LAMPORT_SPEND = 14;  // Program spent the lamports of an account that doesn't belong to it
  RUNTIME_TXN_EXEC_ERR_EXTERNAL_DATA_MODIFIED = 15;  // Program modified the data of an account that doesn't belong to it
  RUNTIME_TXN_EXEC_ERR_READONLY_LAMPORT_CHANGE = 16;  // Read-only account's lamports modified
  RUNTIME_TXN_EXEC_ERR_READONLY_DATA_MODIFIED = 17;  // Read-only account's data was modified
  RUNTIME_TXN_EXEC_ERR_EXECUTABLE_MODIFIED = 18;  // Executable bit on account changed, but shouldn't have
  RUNTIME_TXN_EXEC_ERR_NOT_ENOUGH_ACC_KEYS = 19;  // The instruction expected additional account keys
  RUNTIME_TXN_EXEC_ERR_ACC_DATA_SIZE_CHANGED = 20;  // Program other than the account's owner changed the size of the account data
  RUNTIME_TXN_EXEC_ERR_ACC_BORROW_FAILED = 21;  // Failed to borrow a reference to account data, already borrowed
  RUNTIME_TXN_EXEC_ERR_ACC_BORROW_OUTSTANDING = 22;  // Account data has an outstanding reference after a program's execution
  RUNTIME_TXN_EXEC_ERR_CUSTOM_ERR = 23;  // Allows on-chain programs to implement program-specific error types and see them returned by the runtime.
  RUNTIME_TXN_EXEC_ERR_INVALID_ERR = 24;  // The return value from the program was invalid.
  RUNTIME_TXN_EXEC_ERR_EXECUTABLE_ACCOUNT_NOT_RENT_EXEMPT = 25;  // Executable accounts must be rent exempt
  RUNTIME_TXN_EXEC_ERR_UNSUPPORTED_PROGRAM_ID = 26;  // Unsupported program id
  RUNTIME_TXN_EXEC_ERR_CALL_DEPTH = 27;  // Cross-program invocation call depth too deep
  RUNTIME_TXN_EXEC_ERR_MISSING_ACC = 28;  // An account required by the instruction is missing
  RUNTIME_TXN_EXEC_ERR_REENTRANCY_NOT_ALLOWED = 29;  // Cross-program invocation reentrancy not allowed for this instruction
  RUNTIME_TXN_EXEC_ERR_MAX_SEED_LENGTH_EXCEEDED = 30;  // Length of the seed is too long for address generation
  RUNTIME_TXN_EXEC_ERR_INVALID_SEEDS = 31;  // Provided seeds do not result in a valid address
  RUNTIME_TXN_EXEC_ERR_INVALID_REALLOC = 32;  // Failed to reallocate account data of this length
  RUNTIME_TXN_EXEC_ERR_COMPUTE_BUDGET_EXCEEDED = 33;  // Computational budget exceeded
  RUNTIME_TXN_EXEC_ERR_PRIVILEGE_ESCALATION = 34;  // Cross-program invocation with unauthorized signer or writable account
  RUNTIME_TXN_EXEC_ERR_PROGRAM_ENVIRONMENT_SETUP_FAILURE = 35;  // Failed to create program execution environment
  RUNTIME_TXN_EXEC_ERR_PROGRAM_FAILED_TO_COMPLETE = 36;  // Program failed to complete
  RUNTIME_TXN_EXEC_ERR_ACC_IMMUTABLE = 37;  // Account is immutable
  RUNTIME_TXN_EXEC_ERR_INCORRECT_AUTHORITY = 38;  // Incorrect authority provided
  RUNTIME_TXN_EXEC_ERR_BORSH_IO_ERROR = 39;  // Failed to serialize or deserialize account data
  RUNTIME_TXN_EXEC_ERR_ACC_NOT_RENT_EXEMPT = 40;  // An account does not have enough lamports to be rent-exempt
  RUNTIME_TXN_EXEC_ERR_INVALID_ACC_OWNER = 41;  // Invalid account owner
  RUNTIME_TXN_EXEC_ERR_ARITHMETIC_OVERFLOW = 42;  // Program arithmetic overflowed
  RUNTIME_TXN_EXEC_ERR_UNSUPPORTED_SYSVAR = 43;  // Unsupported sysvar
  RUNTIME_TXN_EXEC_ERR_ILLEGAL_OWNER = 44;  // Provided owner is not allowed
  RUNTIME_TXN_EXEC_ERR_MAX_ACCS_DATA_ALLOCS_EXCEEDED = 45;  // Account data allocation exceeded the maximum accounts data size limit
  RUNTIME_TXN_EXEC_ERR_MAX_ACCS_EXCEEDED = 46;  // Max accounts exceeded
  RUNTIME_TXN_EXEC_ERR_MAX_INSN_TRACE_LENS_EXCEEDED = 47;  // Max instruction trace length exceeded
  RUNTIME_TXN_EXEC_ERR_BUILTINS_MUST_CONSUME_CUS = 48;  // Builtin programs must consume compute units
}

// Source kind of exec_err; none unless txn_err = instruction_error
enum RuntimeTxnExecErrKind {
  RUNTIME_TXN_EXEC_ERR_KIND_UNSPECIFIED = 0;
  RUNTIME_TXN_EXEC_ERR_KIND_NONE = 1;  // no instruction error
  RUNTIME_TXN_EXEC_ERR_KIND_EBPF = 2;  // eBPF VM error
  RUNTIME_TXN_EXEC_ERR_KIND_SYSCALL = 3;  // Syscall error
  RUNTIME_TXN_EXEC_ERR_KIND_INSTR = 4;  // Instruction error
}

// Type of reward credit
enum RuntimeRewardKind {
  RUNTIME_REWARD_KIND_UNSPECIFIED = 0;
  RUNTIME_REWARD_KIND_VOTE = 1;  // Vote-account commission credit at slot 0 of the new epoch
  RUNTIME_REWARD_KIND_STAKE = 2;  // Stake-account credit during the partitioned-epoch-rewards window
}

// Type of the cache entry mutation
enum RuntimeStakeDelegationKind {
  RUNTIME_STAKE_DELEGATION_KIND_UNSPECIFIED = 0;
  RUNTIME_STAKE_DELEGATION_KIND_UPSERT = 1;  // Entry fully rewritten from the post-txn account state
  RUNTIME_STAKE_DELEGATION_KIND_REMOVE = 2;  // Entry removed
  RUNTIME_STAKE_DELEGATION_KIND_SNAPSHOT = 3;  // Baseline entry loaded into the cache at boot from the snapshot manifest (or genesis)
  RUNTIME_STAKE_DELEGATION_KIND_REWARD = 4;  // Entry fully rewritten by an epoch-reward payout during the partitioned-rewards window
}

// Slot that was voted on
message SignedVoteTower {
  // Slot being voted on / locked out for
  uint64 slot = 1;
  // Confirmation count (higher = closer to root)
  uint32 confirmation_count = 2;
}

// Per-account diff entry
message RuntimeTxnAccountDiffs {
  // Account pubkey
  bytes pubkey = 1;
  // Post-state owner pubkey
  bytes owner = 2;
  // Pre-state owner pubkey
  bytes prev_owner = 3;
  // Post-state lamports
  uint64 lamports = 4;
  // Pre-state lamports
  uint64 prev_lamports = 5;
  // Post-state data size in bytes
  uint64 data_sz = 6;
  // Pre-state data size in bytes
  uint64 prev_data_sz = 7;
  // True if the post-state account is executable
  bool is_executable = 8;
  // True if this write touched the stake cache
  bool is_stake_update = 9;
  // True if this write touched the vote cache
  bool is_vote_update = 10;
  // True if this write created a new vote account
  bool is_new_vote = 11;
  // True if this write removed a vote account
  bool is_rm_vote = 12;
}

// Post-state of an updated account
message RuntimeBlockOtherDiffs {
  // Account pubkey
  bytes pubkey = 1;
  // Post-state owner pubkey
  bytes owner = 2;
  // Pre-state owner pubkey
  bytes prev_owner = 3;
  // Post-state lamports
  uint64 lamports = 4;
  // Pre-state lamports
  uint64 prev_lamports = 5;
  // Post-state data size in bytes
  uint64 data_sz = 6;
  // Pre-state data size in bytes
  uint64 prev_data_sz = 7;
  // True if the post-state account is executable
  bool is_executable = 8;
}

// Post-state of an updated sysvar account
message RuntimeBlockSysvarDiffs {
  // Sysvar account pubkey
  bytes pubkey = 1;
  // Post-state owner pubkey
  bytes owner = 2;
  // Pre-state owner pubkey
  bytes prev_owner = 3;
  // Post-state lamports
  uint64 lamports = 4;
  // Pre-state lamports
  uint64 prev_lamports = 5;
  // Post-state data size in bytes
  uint64 data_sz = 6;
  // Pre-state data size in bytes
  uint64 prev_data_sz = 7;
  // True if the post-state account is executable
  bool is_executable = 8;
}

// Decoded Clock sysvar for this slot
message RuntimeBlockClockSysvar {
  // Clock sysvar slot (same as this row's slot)
  uint64 slot = 1;
  // Unix timestamp of the first slot of this epoch
  sint64 epoch_start_timestamp = 2;
  // Clock sysvar epoch
  uint64 epoch = 3;
  // Epoch whose leader schedule is currently being computed
  uint64 leader_schedule_epoch = 4;
  // Stake-weighted cluster unix timestamp estimate for this slot
  sint64 unix_timestamp = 5;
}

// Decoded EpochRewards sysvar as initialized at this boundary
message RuntimeEpochEpochRewardsSysvar {
  // Total lamports minted for this epoch's rewards (vote + stake)
  uint64 total_rewards = 1;
  // Lamports already distributed when the sysvar was initialized
  uint64 distributed = 2;
  // Block height at which the stake rewards distribution starts
  uint64 distribution_starting_block_height = 3;
  // Number of stake reward partitions
  uint64 num_partitions = 4;
  // Total reward points (sum of credits earned times stake across all delegations)
  bytes total_points = 5;
  // Parent blockhash seeding the partition hasher
  bytes parent_blockhash = 6;
}

// Decoded EpochSchedule sysvar
message RuntimeEpochEpochScheduleSysvar {
  // Slots per epoch
  uint64 slots_per_epoch = 1;
  // Slots before an epoch's start at which its leader schedule is computed
  uint64 leader_schedule_slot_offset = 2;
  // True if epochs ramp up from a shorter initial length, false otherwise
  bool warmup = 3;
  // First epoch of full slots per epoch length
  uint64 first_normal_epoch = 4;
  // First slot of first normal epoch
  uint64 first_normal_slot = 5;
}

// Decoded StakeHistory sysvar entry appended at this boundary
message RuntimeEpochStakeHistorySysvar {
  // Epoch that just completed
  uint64 epoch = 1;
  // Effective stake recorded for the completed epoch
  uint64 effective = 2;
  // Activating stake recorded for the completed epoch
  uint64 activating = 3;
  // Deactivating stake recorded for the completed epoch
  uint64 deactivating = 4;
}

// The validator received a verified, deduplicated transaction
message Txn {
  // The source IP address of the transaction sender
  bytes source_ip = 1;
  // The source port of the transaction sender
  uint32 source_port = 2;
  // The protocol used to submit the transaction (e.g., QUIC, UDP, ...)
  TxnProtocol protocol = 3;
  // The ID of the bundle this transaction belongs to, if any.  Zero indicates not a bundle transaction
  uint64 bundle_id = 4;
  // The total number of transactions in the bundle this transaction belongs to, if any
  uint32 bundle_txn_count = 5;
  // The commission percentage for the bundle this transaction belongs to, if any
  uint32 bundle_commission = 6;
  // The public key of the commission recipient for the bundle this transaction belongs to, if any
  bytes bundle_commission_pubkey = 7;
  // The raw transaction payload bytes
  bytes payload = 8;
}

// The validator received a valid shred
message Shred {
  // The source IP address of the shred
  bytes source_ip = 1;
  // The source port of the shred
  uint32 source_port = 2;
  // The protocol used to send the shred
  ShredProtocol protocol = 3;
  // The raw shred payload bytes
  bytes payload = 4;
}

// The validator generated a vote transaction
message SignedVote {
  // Serialized signed vote transaction
  bytes signed_txn = 1;
  // The public key of the vote account
  bytes vote_account = 2;
  // The public key that authorized the vote
  bytes vote_authority = 3;
  // The public key that pays for transaction fees
  bytes fee_payer = 4;
  // Signature identifying the transaction
  bytes signature = 5;
  // Slot being voted on (top of tower)
  uint64 vote_slot = 6;
  // Bank hash of the slot being voted on
  bytes vote_bank_hash = 7;
  // Block ID of the slot being voted on
  bytes vote_block_id = 8;
  // Recent blockhash parameter of the vote transaction
  bytes txn_blockhash = 9;
  // Tower of slots being voted on (oldest to newest)
  repeated SignedVoteTower tower = 10;
}

// A slot reached a commitment level. Emitted once per slot per level reached. Join to block_completed on bank_seq, or on slot and block_id.
message SlotConfirmed {
  // Monotonic sequence number identifying this block within the current run; the join key to block_completed. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable, which happens for forward confirmations where the block has not been replayed.
  uint64 bank_seq = 1;
  // The slot being confirmed.
  uint64 slot = 2;
  // Unique identifier of the block being confirmed; the join key to block_completed.
  bytes block_id = 3;
  // Stake in lamports supporting this confirmation. Divide by total_stake for the ratio that crossed the level's threshold. 0 means unavailable.
  uint64 stake = 4;
  // Total cluster stake in lamports at confirmation time; the denominator for the confirmation ratio. 0 means unavailable.
  uint64 total_stake = 5;
  // Whether this block is eligible for fork choice. An equivocating block becomes eligible again only once duplicate confirmed.
  bool valid = 6;
  // The commitment level reached, from weakest to strongest: processed, propagated, duplicate, optimistic, super, rooted. ignored is a separate terminal outcome rather than a strengthening level.
  SlotConfirmedLevel level = 7;
  // True when the block was confirmed by votes seen over gossip before it was replayed locally. Always false for processed and rooted, which require a local replay.
  bool forward = 8;
}

// A single accounts-database partition finished compacting. Compaction scans one partition, relocates its still-live account records forward into the next storage tier, and reclaims the partition. Emitted once per partition per compaction pass by the accdb tile. Partitions are large (e.g. 32 GiB) so this is a rare, coarse-grained event rather than a hot-path counter.
message AccdbCompactionCompleted {
  // Index of the partition that was compacted, identifying its slot in the accdb partition pool.
  uint64 partition_idx = 1;
  // Storage tier the partition was compacted from. Layer 0 is the hot tier that takes live execution writes; higher layers are progressively colder. Records are promoted one tier per compaction.
  uint32 src_layer = 2;
  // Storage tier the surviving live records were relocated into, normally src_layer+1, clamped at the coldest tier.
  uint32 dest_layer = 3;
  // Total bytes of account records walked in the partition this pass, live and dead combined. Equals the partition's written extent at the time compaction started.
  uint64 bytes_scanned = 4;
  // Dead bytes in the partition that triggered compaction: space held by account records that had been superseded by newer versions. This is the space compaction reclaims.
  uint64 bytes_freed = 5;
  // Number of still-live account records copied forward into dest_layer this pass.
  uint64 accounts_relocated = 6;
  // Total bytes of live account records copied forward into dest_layer this pass. Compare to bytes_scanned for the live fraction of the partition.
  uint64 bytes_relocated = 7;
  // Number of records skipped because no live index entry referenced them, i.e. records that were already superseded. Together with accounts_relocated this accounts for every record scanned.
  uint64 dead_records = 8;
  // Wall-clock time at which this compaction pass began, in nanoseconds since the Unix epoch.
  uint64 start_time = 9;
  // Wall-clock time at which this compaction pass completed, in nanoseconds since the Unix epoch. Subtract start_time for the pass duration.
  uint64 end_time = 10;
}

// The accounts database grew its backing file by one partition. The accounts DB is a single file divided into fixed-size partitions; when a write head runs off the end of the allocated file, a new partition is fallocated and the file grows. Emitted once per grow by the accdb tile. Partitions are large (e.g. 32 GiB) so grows are infrequent and each one is a meaningful step in the database's on-disk footprint.
message AccdbPartitionAdded {
  // Index of the newly allocated partition. Equals old_partition_max, i.e. it is appended at the end of the previously allocated range.
  uint64 partition_idx = 1;
  // Index of the partition the write head rotated off of to trigger this grow, i.e. the partition that just filled up. UINT64_MAX when there was no prior write head (the very first partition allocated on this layer).
  uint64 prior_partition_idx = 2;
  // Storage tier whose write head triggered the grow. Layer 0 is the hot tier fed by live execution writes; higher layers are colder compaction-destination tiers. A layer-0 grow means live ingest outran reclamation; a higher-layer grow means compaction is staging more cold data.
  uint32 layer = 3;
  // Number of allocated partitions before this grow.
  uint64 old_partition_max = 4;
  // Number of allocated partitions after this grow, always old_partition_max+1.
  uint64 new_partition_max = 5;
  // Size of a single partition in bytes; the increment by which the backing file grows.
  uint64 partition_sz = 6;
  // Total fallocated size of the accounts database file in bytes after this grow, equal to new_partition_max times partition_sz. Tracks the database's on-disk footprint over time.
  uint64 disk_allocated_bytes = 7;
}

// Two different blocks (different block ids) were observed for the same slot. Emitted once when the validator first detects the equivocation, after both blocks are known.
message BlockEquivocated {
  // Sequence number of this validator's replayed block, joining to block_completed; zero if there is no local replayed bank (forward-confirmed or shred-proof detection).
  uint64 bank_seq = 1;
  // The slot that equivocates (has more than one block).
  uint64 slot = 2;
  // The slot number of the parent block.
  uint64 parent_slot = 3;
  // The epoch this slot belongs to.
  uint64 epoch = 4;
  // Identifier of the block this validator replayed for the slot.
  bytes block_id = 5;
  // Identifier of the conflicting block for the same slot; zero if not known (shred-proof detection).
  bytes sibling_block_id = 6;
  // This validator's bank hash for the block it replayed; zero if the block was not replayed locally.
  bytes bank_hash = 7;
  // Last microblock header hash of the block this validator replayed; zero if not replayed locally.
  bytes block_hash = 8;
  // Whether this validator produced the equivocating block it replayed.
  bool is_leader = 9;
  // Whether this validator had voted for its replayed block when the equivocation was detected.
  bool our_block_voted = 10;
  // Whether this validator's replayed block had been duplicate confirmed when the equivocation was detected.
  bool our_block_confirmed = 11;
  // Stake in lamports voted on the block this validator replayed at detection; zero if none/unknown. Typically small, as an equivocating block usually did not win confirmation.
  uint64 block_stake = 12;
  // Stake in lamports on the conflicting (typically confirmed) block at detection; zero if not known.
  uint64 sibling_stake = 13;
  // Total cluster stake in lamports at detection; the denominator for the stake fields. Zero if not known.
  uint64 total_stake = 14;
  // How the equivocation was detected.
  BlockEquivocatedDetection detection = 15;
}

// One row per dispatched transaction (committable or not), with the execution results
message RuntimeTxn {
  // Monotonic sequence number identifying this block within the current run; the join key to block_completed. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Bank slot in which this transaction was executed
  uint64 slot = 2;
  // 0-indexed position of this transaction within its block
  uint64 index_in_slot = 3;
  // 0-indexed commit-completion order within this slot
  uint64 commit_index_in_slot = 4;
  // FEC merkle root that was the current block_id of the bank when this txn was dispatched; NULL on the leader path
  bytes fec_merkle_root = 5;
  // Epoch the transaction was executed in
  uint64 epoch = 6;
  // First signature of the transaction (64 bytes)
  bytes signature = 7;
  // Blockhash referenced by the transaction
  bytes blockhash = 8;
  // Fee-payer pubkey
  bytes fee_payer = 9;
  // True if the transaction was classified as a simple vote, false otherwise
  bool is_simple_vote = 10;
  // True if the transaction is part of a bundle, false otherwise
  bool is_bundle = 11;
  // True if the transaction was committable (landed on-chain)
  bool is_committable = 12;
  // True if the transaction landed but only fees were charged (e.g. account loading failure)
  bool is_fees_only = 13;
  // Transaction execution error
  RuntimeTxnTxnErr txn_err = 14;
  // Instruction execution error; success unless txn_err = instruction_error
  RuntimeTxnExecErr exec_err = 15;
  // Source kind of exec_err; none unless txn_err = instruction_error
  RuntimeTxnExecErrKind exec_err_kind = 16;
  // Instruction index that failed (UINT_MAX if not applicable)
  uint32 exec_err_idx = 17;
  // Custom error code returned by the program (UINT_MAX if not applicable)
  uint32 custom_err = 18;
  // Compute unit limit requested by the transaction
  uint64 compute_unit_limit = 19;
  // Compute unit price (micro-lamports per CU) requested by the transaction
  uint64 compute_unit_price = 20;
  // compute_unit_limit minus the remaining compute meter at commit
  uint64 compute_units_consumed = 21;
  // Requested heap size for the VM
  uint64 heap_size = 22;
  // Number of builtin program instructions in the transaction
  uint64 num_builtin_instrs = 23;
  // Number of BPF (non-builtin) program instructions
  uint64 num_non_builtin_instrs = 24;
  // Total bytes of account data loaded for this transaction
  uint64 loaded_accounts_data_size = 25;
  // Configured loaded-accounts-data-size limit for this transaction
  uint64 loaded_accounts_data_size_limit = 26;
  // Net delta in writable account data sizes during execution (negative when the writable account data net shrunk)
  sint64 accounts_resize_delta = 27;
  // Execution (base) fee charged to the fee payer, pre-burn (50% is burned at settlement)
  uint64 execution_fee = 28;
  // Priority fee charged to the fee payer, pre-burn (priority fees are not burned)
  uint64 priority_fee = 29;
  // Gross tips credited to tip accounts by this transaction, before the block-level tip commission
  uint64 tips = 30;
  // Number of signatures in the transaction
  uint64 signature_count = 31;
  // Cost-tracker signature cost
  uint32 cost_signature = 32;
  // Cost-tracker write-lock cost
  uint32 cost_write_lock = 33;
  // Cost-tracker data-bytes cost
  uint32 cost_data_bytes = 34;
  // Cost-tracker programs-execution cost
  uint32 cost_programs_execution = 35;
  // Cost-tracker loaded-accounts-data-size cost
  uint32 cost_loaded_accounts_data_size = 36;
  // Allocated accounts data size from the cost tracker
  uint64 cost_allocated_accounts_data_size = 37;
  // Per-account diffs for writable accounts that were modified
  repeated RuntimeTxnAccountDiffs account_diffs = 38;
  // Every account the transaction locked as writable
  repeated bytes writable_accounts = 39;
  // Every account the transaction locked as readonly, in account-order
  repeated bytes readonly_accounts = 40;
  // Distinct program pubkeys invoked at the top level of this transaction
  repeated bytes program_ids = 41;
}

// One row per block emitted with all the block-level diffs and results
message RuntimeBlock {
  // Monotonic sequence number identifying this block within the current run; the join key from runtime_txn / slot_confirmed / block_equivocated. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Block slot number
  uint64 slot = 2;
  // Block id of slot (merkle root of the last FEC set)
  bytes block_id = 3;
  // Slot of the parent block
  uint64 parent_slot = 4;
  // Parent slot's block id
  bytes parent_block_id = 5;
  // Epoch this block belongs to
  uint64 epoch = 6;
  // Block height (count of ancestor blocks) of this block in the chain
  uint64 block_height = 7;
  // Scheduled leader identity pubkey for this block
  bytes leader = 8;
  // Bank hash of this slot
  bytes bank_hash = 9;
  // Bank hash of the parent slot
  bytes prev_bank_hash = 10;
  // Accounts lattice hash after this slot
  bytes accounts_lt_hash_checksum = 11;
  // Proof-of-history hash at the end of the slot (same as blockhash)
  bytes poh_hash = 12;
  // Decoded Clock sysvar for this slot.
  repeated RuntimeBlockClockSysvar clock_sysvar = 13;
  // Blockhash queue at the end of this slot, newest first
  repeated bytes recent_blockhashes_sysvar = 14;
  // Highest hard fork slot less than or equal to bank slot
  uint64 last_restart_slot_sysvar = 15;
  // Total number of transactions committed in this block
  uint64 num_transactions = 16;
  // Number of transactions that committed with an error
  uint64 num_failed_txns = 17;
  // Number of non-vote transactions committed in this block
  uint64 num_nonvote_txns = 18;
  // Number of non-vote transactions that committed with an error
  uint64 num_nonvote_failed_txns = 19;
  // Total number of signatures processed in the block
  uint64 num_signatures = 20;
  // Number of data shreds making up this block
  uint64 num_shreds = 21;
  // Cumulative tick height at the end of this block
  uint64 tick_height = 22;
  // Total execution (base) fees collected in this block, pre-burn
  uint64 execution_fees = 23;
  // Total priority fees collected in this block (priority fees are not burned)
  uint64 priority_fees = 24;
  // Total gross tips credited to tip accounts in this block, before block-level tip commission
  uint64 tips = 25;
  // Lamports burned at fee settlement (50% of execution fees)
  uint64 fees_burned = 26;
  // Lamports credited to the leader at fee settlement
  uint64 leader_fee_reward = 27;
  // Total lamport supply
  uint64 capitalization = 28;
  // Effective stake from stake delegations
  uint64 total_effective_stake = 29;
  // Stake activating during this slot's epoch
  uint64 total_activating_stake = 30;
  // Stake deactivating during this slot's epoch
  uint64 total_deactivating_stake = 31;
  // Total stake delegated to active vote accounts this epoch
  uint64 total_epoch_stake = 32;
  // Post-state of every sysvar account written this block
  repeated RuntimeBlockSysvarDiffs sysvar_diffs = 33;
  // Non-txn account updates that are not sysvar writes or reward credits
  repeated RuntimeBlockOtherDiffs other_diffs = 34;
  // Number of FEC sets observed while assembling this block
  uint64 fec_count = 35;
  // Merkle chain of FEC sets observed while assembling this block
  repeated bytes fec_merkle_roots = 36;
}

// One row per epoch-reward credit to an account   
message RuntimeReward {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot in which the credit was applied
  uint64 slot = 2;
  // Epoch the slot belongs to
  uint64 epoch = 3;
  // Type of reward credit
  RuntimeRewardKind kind = 4;
  // Account pubkey
  bytes pubkey = 5;
  // Owner program of the credited account
  bytes owner = 6;
  // Lamports before the credit
  uint64 prev_lamports = 7;
  // Lamports after the credit
  uint64 lamports = 8;
  // Partitioned-rewards partition index this credit belongs to (0 for vote rewards)
  uint64 partition_idx = 9;
  // New credits_observed stored on the stake account (0 for vote rewards)
  uint64 credits_observed = 10;
  // Post-payout delegated stake written to the stake-delegations cache (0 for vote rewards)
  uint64 stake = 11;
}

// The complete history of the stake-delegations cache, one row per mutation: the baseline entries loaded at boot (kind = snapshot, one row per delegation in the snapshot manifest or genesis), the entry rewrites applied by epoch-reward payouts (kind = reward), and the transaction-driven mutations emitted as the cache is updated at txn commit (kind = upsert / remove
message RuntimeStakeDelegation {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot in which the mutating transaction was committed (the snapshot slot for baseline entries)
  uint64 slot = 2;
  // Epoch the slot belongs to
  uint64 epoch = 3;
  // 0-indexed position of the mutating transaction within its block. UInt64 max for the non-transaction rows (snapshot or reward kind)
  uint64 index_in_slot = 4;
  // First signature of the mutating transaction (64 bytes; zero for the non-transaction rows, snapshot or reward kind)
  bytes signature = 5;
  // Type of the cache entry mutation
  RuntimeStakeDelegationKind kind = 6;
  // Stake account pubkey
  bytes stake_account = 7;
  // Vote account pubkey
  bytes vote_account = 8;
  // Delegated lamports written to the cache
  uint64 stake = 9;
  // Delegation activation epoch written to the cache
  uint64 activation_epoch = 10;
  // Delegation deactivation epoch written to the cache
  uint64 deactivation_epoch = 11;
  // Vote credits_observed written to the cache
  uint64 credits_observed = 12;
}

// One row per root advance with the post-apply cache invariants
message RuntimeRooted {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot of the newly rooted block
  uint64 slot = 2;
  // Epoch the rooted slot belongs to
  uint64 epoch = 3;
  // Slot of the previous root
  uint64 prev_root_slot = 4;
  // Number of stake-delegations cache entries upserted into the root map by this root advance. Can find the exact entries by joining to runtime_stake_delegation on bank_seq.
  uint64 stake_delegations_upserts = 5;
  // Number of stake-delegations cache entries removed from the root map by this root advance. Can find the exact entries by joining to runtime_stake_delegation on bank_seq.
  uint64 stake_delegations_removes = 6;
  // Total entries in the root stake-delegations cache after this advance
  uint64 stake_delegations_cnt = 7;
  // Root stake-delegations effective-stake total after this advance
  uint64 effective_stake = 8;
  // Root stake-delegations activating-stake total after this advance
  uint64 activating_stake = 9;
  // Root stake-delegations deactivating-stake total after this advance
  uint64 deactivating_stake = 10;
  // Number of new-votes op-log inserts applied into the root by this advance. Can find the exact entries by joining to runtime_vote_account on bank_seq.
  uint64 new_votes_inserts = 11;
  // Number of new-votes op-log removes applied into the root by this advance. Can find the exact entries by joining to runtime_vote_account on bank_seq.
  uint64 new_votes_removes = 12;
}

// One row per epoch boundary with all the epoch-level diffs and results
message RuntimeEpoch {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // First slot of the new epoch
  uint64 slot = 2;
  // Parent slot on this fork (the last replayed slot of the previous epoch)
  uint64 parent_slot = 3;
  // The new epoch being entered; the boundary snapshot captures stakes as of the end of epoch - 1
  uint64 epoch = 4;
  // Effective stake across all delegations, recomputed with warmup/cooldown math at this boundary
  uint64 total_effective_stake = 5;
  // Stake activating during the new epoch, recomputed at this boundary
  uint64 total_activating_stake = 6;
  // Stake deactivating during the new epoch, recomputed at this boundary
  uint64 total_deactivating_stake = 7;
  // Total stake delegated to the valid vote accounts snapshotted at this boundary
  uint64 total_epoch_stake = 8;
  // Vote accounts seen while accumulating delegations at this boundary
  uint64 num_staked_vote_accounts = 9;
  // Vote accounts in the final boundary snapshot
  uint64 num_vote_accounts = 10;
  // Vote accounts that passed the validator-admission-ticket filters and were offered to the top-votes set
  uint64 num_top_votes_eligible = 11;
  // Smallest stake in the final boundary snapshot - the effective admission threshold
  uint64 top_votes_min_stake = 12;
  // Decoded StakeHistory sysvar entry appended at this boundary
  repeated RuntimeEpochStakeHistorySysvar stake_history_sysvar = 13;
  // Decoded EpochSchedule sysvar
  repeated RuntimeEpochEpochScheduleSysvar epoch_schedule_sysvar = 14;
  // Feature ids newly activated at this boundary
  repeated bytes feature_activations = 15;
  // Decoded EpochRewards sysvar as initialized at this boundary
  repeated RuntimeEpochEpochRewardsSysvar epoch_rewards_sysvar = 16;
}

// One row per vote account per epoch boundary: the per-account vote-cache snapshot taken as the boundary is crossed
message RuntimeVoteAccount {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // First replayed slot of the new epoch
  uint64 slot = 2;
  // The new epoch being entered; the snapshot captures this account's stake as of the end of epoch - 1
  uint64 epoch = 3;
  // Vote account
  bytes pubkey = 4;
  // Validator identity pubkey
  bytes node_account = 5;
  // Effective stake delegated to this vote account at this boundary
  uint64 stake = 6;
  // Commission read from the vote account at this boundary (basis points)
  uint32 commission_bps = 7;
  // True if the account existed in the snapshot taken one boundary earlier
  bool has_commission_t_2 = 8;
  // Commission recorded one boundary earlier (0 unless has_commission_t_2)
  uint32 commission_t_2_bps = 9;
  // True if the account existed in the snapshot taken two boundaries earlier
  bool has_commission_t_3 = 10;
  // Commission recorded two boundaries earlier (0 unless has_commission_t_3)
  uint32 commission_t_3_bps = 11;
  // Commission the reward calculation will actually use for this epoch's vote rewards: the oldest available of t-3 / t-2 / current when delay_commission_updates is active, current otherwise
  uint32 reward_commission_bps = 12;
  // Cumulative vote credits at this boundary
  uint64 credits = 13;
  // Cumulative vote credits at the start of the latest epoch-credits ladder entry
  uint64 prev_credits = 14;
  // Entries in the vote account's epoch-credits ladder at this boundary
  uint64 epoch_credits_cnt = 15;
}

// Combined event type
message Event {
  oneof event {
    Txn txn = 1;
    Shred shred = 2;
    SignedVote signed_vote = 3;
    SlotConfirmed slot_confirmed = 4;
    AccdbCompactionCompleted accdb_compaction_completed = 5;
    AccdbPartitionAdded accdb_partition_added = 6;
    BlockEquivocated block_equivocated = 7;
    RuntimeTxn runtime_txn = 8;
    RuntimeBlock runtime_block = 9;
    RuntimeReward runtime_reward = 10;
    RuntimeStakeDelegation runtime_stake_delegation = 11;
    RuntimeRooted runtime_rooted = 12;
    RuntimeEpoch runtime_epoch = 13;
    RuntimeVoteAccount runtime_vote_account = 14;
  }
}
