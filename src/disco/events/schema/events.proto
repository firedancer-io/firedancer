  // Duration of verifying and processing one shred received from the network
  MetricsShredAddShredDurationNanos add_shred_duration_nanos = 31;
  // Duration of synchronously spilling one FEC payload to the store
  MetricsShredStoreFecSyncSpillDurationNanos store_fec_sync_spill_duration_nanos = 32;
  // Shreds assigned to this tile that passed the initial parse and chained check, by processing result, plus received frags that failed the initial parse; InitialRejected and FecFatalRejected are subsets of Rejected
  MetricsShredProcessed processed = 33;
  // Incomplete FEC sets evicted from the resolver to make room for new ones
  uint64 fec_incomplete_evicted = 34;
  // Shreds rejected before any resources were allocated for the FEC set
  uint64 initial_rejected = 35;
  // Shreds rejected because they're not chained merkle shreds
  uint64 unchained_rejected = 36;
  // FEC sets rejected for reasons that cause the whole FEC set to become invalid
  uint64 fec_fatal_rejected = 37;
  // Shreds that looked like repair responses but had an incorrect nonce
  uint64 repair_nonce_failed = 38;
  // Repair shreds received
  uint64 repair_rx = 39;
  // Bytes received from network packets with repair shreds, including network headers
  uint64 repair_rx_bytes = 40;
  // Turbine shreds received
  uint64 turbine_rx = 41;
  // Bytes received from network packets with turbine shreds, including network headers
  uint64 turbine_rx_bytes = 42;
  // FEC sets that completed with at least one repair shred contributing
  uint64 repair_completion_assisted = 43;
  // Estimated time repair advanced FEC set completion: the delay from a repair-assisted completion until turbine had delivered as many shreds for that set as repair contributed. Counts arrivals rather than distinct indices, so turbine duplicates bias this low
  MetricsShredRepairLeadDelayNanos repair_lead_delay_nanos = 44;
  // FEC payloads the shred tile spilled to the store synchronously because the store RAM cache was full
  uint64 store_fec_sync_spilled = 45;
  // FEC payload bytes the shred tile spilled to the store synchronously
  uint64 store_fec_sync_spilled_bytes = 46;
}

