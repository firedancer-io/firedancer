message MetricsVotorClientConnUsed {
  // Handshaking peer
  uint64 handshake = 1;
  // Handshake complete, confirming with peer
  uint64 handshake_complete = 2;
  // Active connection
  uint64 active = 3;
  // Peer requested close
  uint64 peer_close = 4;
  // Connection terminating due to error
  uint64 abort = 5;
  // Connection is closing
  uint64 close_pending = 6;
  // Connection about to be freed
  uint64 dead = 7;
}

// Inbound certificates processed, by result
message MetricsVotorCertRx {
  // Cert was handed to the pool and accepted
  uint64 success = 1;
  // Cert was truncated or had trailing bytes
  uint64 bad_size = 2;
  // Cert had an invalid version, tag, bitmap, or signature encoding
  uint64 bad_encoding = 3;
  // Cert was for a different shred version
  uint64 shred_version_mismatched = 4;
  // Sending connection had no authenticated identity
  uint64 unknown_signer = 5;
  // Sender was not in the peer set
  uint64 not_peer = 6;
  // Sender was not a ranked validator in the cert slot's epoch
  uint64 unranked = 7;
  // Cert slot was either too old or too far in the future
  uint64 slot_out_of_range = 8;
  // Cert was already in the pool
  uint64 duplicate = 9;
  // Cert failed the stake threshold or the aggregate signature check
  uint64 signature_failed = 10;
  // Sender is banned for a failed signature verification
  uint64 banned = 11;
}

// Inbound votes processed, by result
message MetricsVotorVoteRx {
  // Vote was handed to the pool and accepted
  uint64 success = 1;
  // Vote was truncated or had trailing bytes
  uint64 bad_size = 2;
  // Vote had an invalid version, tag, or signature encoding
  uint64 bad_encoding = 3;
  // Sending connection had no authenticated identity
  uint64 unknown_signer = 4;
  // Sender was not in the peer set
  uint64 not_peer = 5;
  // Sender is banned for a failed signature verification
  uint64 banned = 6;
  // Vote slot was either too old or too far in the future
  uint64 slot_out_of_range = 7;
  // Vote block hash was null
  uint64 null_block_hash = 8;
  // Vote signature was the identity point
  uint64 signature_failed = 9;
  // Sender was not a ranked validator in the vote slot's epoch
  uint64 unranked = 10;
  // Vote was for a different shred version
  uint64 shred_version_mismatched = 11;
  // Voter had already cast this vote
  uint64 duplicate = 12;
  // Vote constitutes a slashable offence
  uint64 slashable = 13;
}

// Inbound datagrams dispatched, by result
message MetricsVotorDatagramRx {
  // Datagram carried a vote and was handed to vote rx
  uint64 vote = 1;
  // Datagram carried a cert and was handed to cert rx
  uint64 cert = 2;
  // Datagram arrived before the votor tile was initialized
  uint64 not_ready = 3;
  // Datagram was too small to hold a version and a tag
  uint64 too_small = 4;
  // Datagram tag was neither a vote nor a cert
  uint64 unknown_tag = 5;
  // Datagram arrived on a connection not yet admitted, or already closed
  uint64 not_admitted = 6;
}

