}

// Metrics of one snapmk tile instance, one row per sweep
message MetricsSnapmk {
  // Identifier shared by every row of one sweep
  uint64 sample_id = 1;
  // Why a metrics sweep was taken
  MetricsSampleReason sample_reason = 2;
  // Slot that triggered the sweep, 0 for periodic sweeps
  uint64 sample_slot = 3;
  // Snapshot load state
  MetricsSnapctLoadState sample_snapct_state = 4;
  // Whether replay had caught up to the cluster tip when the sweep was taken (replay IsCaughtUp); set once per run, never cleared
  bool sample_caught_up = 5;
  // Tile instances in the sweep, to detect partial sweeps
  uint64 sample_tile_cnt = 6;
  // Index of this tile instance among tiles of its kind
  uint64 kind_id = 7;
  // Process ID of the tile
  uint64 pid = 8;
  // Thread ID of the tile. Same as Pid in production, but might differ in development
  uint64 tid = 9;
  // CPU the tile last ran on
  uint64 last_cpu_index = 10;
  // counter: cumulative since tile start, query deltas. Involuntary context switches
  uint64 context_switch_involuntary = 11;
  // counter: cumulative since tile start, query deltas. Voluntary context switches
  uint64 context_switch_voluntary = 12;
  // counter: cumulative since tile start, query deltas. Major page faults
  uint64 page_fault_major = 13;
  // counter: cumulative since tile start, query deltas. Minor page faults
  uint64 page_fault_minor = 14;
  // Tile lifecycle state: 0=booting, 1=running, 2=shutdown
  MetricsSnapmkState state = 15;
  // Last wall-clock time the tile heartbeated
  uint64 heartbeat_time = 16;
  // Whether the tile is currently backpressured
  bool is_backpressured = 17;
  // counter: cumulative since tile start, query deltas. Times the tile waited for one or more consumers to catch up to resume publishing
  uint64 backpressure = 18;
  // Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
  MetricsSnapmkRegimeDurationNanos regime_duration_nanos = 19;
  // Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
  MetricsSnapmkThreadDurationNanos thread_duration_nanos = 20;
  // Times the tile tried to park while idle (efficient mode), by result
  MetricsSnapmkParkAttempted park_attempted = 21;
  // counter: cumulative since tile start, query deltas. Device IRQs on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 device_irq = 22;
  // counter: cumulative since tile start, query deltas. TLB shootdowns on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 tlb_shootdown = 23;
  // counter: cumulative since tile start, query deltas. Local timer interrupts (LOC) on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 timer_irq = 24;
  // Snapshot creation job state: 0=idle (Idle, waiting for a job), 1=start (Starting), 2=tar_headers (Writing tar headers), 3=manifest (Writing manifest), 4=accdb_cache (Writing cached accounts), 5=accdb_cache_flush (Flushing cached accounts), 6=accdb_cache_finish (Waiting for cached account flush), 7=accdb_disk (Writing on-disk accounts), 8=accdb_disk_flush (Flushing on-disk accounts), 9=accdb_disk_finish (Waiting for on-disk account flush), 10=accdb_delta (Writing incremental accounts), 11=accdb_delta_flush (Flushing incremental accounts), 12=accdb_delta_finish (Waiting for incremental account flush), 13=status_cache (Writing status cache), 14=eof_marker (Writing tar EOF marker), 15=done (Done, notifying replay), 16=fail (Failed, cleaning up), 17=sleep (Sleeping), 18=startup (Waiting for startup), 19=startup_burst (Publishing pre-existing snapshots)
  MetricsSnapmkJobState job_state = 25;
  // Snapshot creation jobs started, by snapshot type
  MetricsSnapmkSnapshotStarted snapshot_started = 26;
  // Snapshot creation jobs finished successfully, by snapshot type
  MetricsSnapmkSnapshotFinished snapshot_finished = 27;
  // Slot of the most recently started snapshot creation, by snapshot type, 0 if none since boot
  MetricsSnapmkLastStartedSlot last_started_slot = 28;
  // Slot of the most recently finished snapshot creation, by snapshot type, 0 if none since boot
  MetricsSnapmkLastFinishedSlot last_finished_slot = 29;
  // Uncompressed bytes fed to the compressor
  uint64 compress_consumed_bytes = 30;
  // Compressed bytes written to snapshot files
  uint64 disk_written_bytes = 31;
  // Bytes of the accounts database cache region scanned so far for the snapshot being created. Resets when a snapshot starts and holds at the total once the cached accounts phase finishes. Stays zero for an incremental snapshot, which does not scan the cache
  uint64 cache_progress_bytes = 32;
  // Size of the accounts database cache region a cached accounts phase scans
  uint64 cache_expected_bytes = 33;
  // Accounts changed since the base snapshot that have been written so far for the incremental snapshot being created. Resets when a snapshot starts, and stays zero for a full snapshot, which has no changed account walk
  uint64 incremental_account_progress = 34;
  // Accounts changed since the base snapshot, sampled when the incremental snapshot started; 0 for a full snapshot. Replay may record more changes while the job runs, so progress can exceed this
  uint64 incremental_account_expected = 35;
  // Cumulative time blocked on I/O
  uint64 io_blocked_duration_nanos = 36;
  // Cumulative time spent compressing data
  uint64 compress_duration_nanos = 37;
  // Distinct accounts changed in rooted slots since the last full snapshot job started; saturates at IncrementalAccountCapacity
  uint64 incremental_account_used = 38;
  // Maximum changed accounts that can be tracked; once reached, no incremental snapshot can be created until the next full snapshot
  uint64 incremental_account_capacity = 39;
  // Logical bytes allocated across managed snapshot files, including partial and retained files
  uint64 disk_allocated_bytes = 40;
}

