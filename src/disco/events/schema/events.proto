  // counter: cumulative since tile start, query deltas. Times the tile waited for one or more consumers to catch up to resume publishing
  uint64 backpressure = 18;
  // Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
  MetricsExecrpRegimeDurationNanos regime_duration_nanos = 19;
  // Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
  MetricsExecrpThreadDurationNanos thread_duration_nanos = 20;
  // Times the tile tried to park while idle (efficient mode), by result
  MetricsExecrpParkAttempted park_attempted = 21;
  // counter: cumulative since tile start, query deltas. Device IRQs on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 device_irq = 22;
  // counter: cumulative since tile start, query deltas. TLB shootdowns on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 tlb_shootdown = 23;
  // counter: cumulative since tile start, query deltas. Local timer interrupts (LOC) on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 timer_irq = 24;
  // Whether the tile is currently processing a task (executing, sigverifying, or PoH hashing)
  bool is_processing = 25;
  // Transactions loaded and executed, by result
  MetricsExecrpTxnProcessed txn_processed = 26;
  // Transactions processed, by transaction version
  MetricsExecrpTxnProcessedByVersion txn_processed_by_version = 27;
  // Ed25519 signatures checked, including failures
  uint64 signature_checked = 28;
  // PoH SHA-256 iterations computed
  uint64 poh_hash_computed = 29;
  // Top-level instructions executed
  uint64 instruction_executed = 30;
  // Cross-program invocations executed
  uint64 cpi_executed = 31;
  // Committed writable accounts left byte-identical by their transaction, so their lthash update was skipped; always zero, since replay hashes transaction writes out of band
  uint64 account_lthash_skipped = 32;
  // Time per transaction, by phase; a phase counts only once the next phase starts, so dropped, fees-only and no-op transactions lose their trailing phases
  MetricsExecrpTxnRegimeDurationNanos txn_regime_duration_nanos = 33;
  // Time in top-level BPF invocations, by phase, with CPI setup and commit split out; nested programs, including native CPIs, count as Interpreter; subset of TxnRegime Execute
  MetricsExecrpVmRegimeDurationNanos vm_regime_duration_nanos = 34;
  // Compute units consumed by executed transactions
  uint64 cu_consumed = 35;
  // Program cache lookups; equals Hit + Miss + lookups of invalid program accounts
  uint64 progcache_looked_up = 36;
  // Program cache misses, each followed by an insert or a spill
  uint64 progcache_miss = 37;
  // Program cache lookups that waited on another tile's in-flight load of the same program
  uint64 progcache_waited = 38;
  // Program cache inserts that found no free slot in their size class on the first try and retried after eviction
  uint64 progcache_insert_retried = 39;
  // Bytes inserted into the program cache
  uint64 progcache_inserted_bytes = 40;
  // Bytes loaded into program cache spill memory
  uint64 progcache_spilled_bytes = 41;
  // Bytes evicted from the program cache by insert eviction sweeps
  uint64 progcache_evicted_bytes = 42;
  // Time in program cache lookups, including waits on peer loads and insert, eviction and ELF load on a miss; superset of ProgcacheLoadDurationNanos
  uint64 progcache_duration_nanos = 43;
  // Program ELF loads and verifications for the program cache, including failed verifications and spill-backed loads
  uint64 progcache_loaded = 44;
  // Time spent loading programs
  uint64 progcache_load_duration_nanos = 45;
  // Program cache hits, by size class
  MetricsExecrpProgcacheHit progcache_hit = 46;
  // Programs inserted into the program cache, by size class
  MetricsExecrpProgcacheInserted progcache_inserted = 47;
  // Program cache slots reclaimed by an insert's eviction sweep, by size class (housekeeping preevicts are counted by the accdb tile)
  MetricsExecrpProgcacheEvicted progcache_evicted = 48;
  // Programs loaded into spill memory because no cache slot could be freed, by size class
  MetricsExecrpProgcacheSpilled progcache_spilled = 49;
  // Readonly accounts acquired from the account database, by cache size class of the account's current data size
  MetricsExecrpAccdbAccountReadonlyAcquired accdb_account_readonly_acquired = 50;
  // Writable accounts acquired from the account database, by cache size class of the account's current data size
  MetricsExecrpAccdbAccountWritableAcquired accdb_account_writable_acquired = 51;
  // Accounts evicted from the account database cache to make space, by cache size class
  MetricsExecrpAccdbAccountEvicted accdb_account_evicted = 52;
  // New account versions committed to the index, by destination cache size class
  MetricsExecrpAccdbAccountNewCommitted accdb_account_new_committed = 53;
  // Account versions committed over an existing version of the same fork and generation, by destination cache size class
  MetricsExecrpAccdbAccountOverwriteCommitted accdb_account_overwrite_committed = 54;
  // Accounts not found in the account database cache and read from disk, by cache size class
  MetricsExecrpAccdbAccountCacheMissed accdb_account_cache_missed = 55;
  // Accounts that had to wait for another reader to finish loading them into the cache
  uint64 accdb_account_waited = 56;
  // Batch acquire calls made by this tile
  uint64 accdb_batch_acquired = 57;
  // Spin retries while waiting to reserve cache lines for a transaction
  uint64 accdb_cache_reserve_retried = 58;
  // Bytes read from the account database file
  uint64 accdb_disk_read_bytes = 59;
  // Reads from the account database file
  uint64 accdb_disk_read = 60;
  // Bytes written to the account database file
  uint64 accdb_disk_written_bytes = 61;
  // Writes to the account database file
  uint64 accdb_disk_written = 62;
  // Account data bytes copied in memory between cache lines, staging buffers and callers; disk reads excluded
  uint64 accdb_copied_bytes = 63;
  // Cache invalidations due to transaction execution from a different block
  uint64 bank_switched = 64;
  // Transaction cache queries by this tile that found a page not in memory
  uint64 txncache_query_miss = 65;
  // Transaction cache inserts by this tile that found a page not in memory
  uint64 txncache_insert_miss = 66;
  // Transaction cache queries and inserts by this tile that fell back to the exclusive lock, stalling every tile; pages they load are read while holding it
  uint64 txncache_operation_stalled = 67;
  // Duration of one transaction cache query
  MetricsExecrpTxncacheQueryDurationNanos txncache_query_duration_nanos = 68;
  // Duration of one transaction cache insert
  MetricsExecrpTxncacheInsertDurationNanos txncache_insert_duration_nanos = 69;
}

