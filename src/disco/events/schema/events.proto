  // Highest slot the pool has finalized (slow-final also needs the slot notarized), 0 if none
  uint64 highest_pool_finalized_slot = 33;
  // Rank of this validator in the current epoch (0 is the highest rank), ULONG_MAX if unranked (unstaked)
  uint64 rank = 34;
  // Peers with an open outbound connection; replaced by ClientConnUsed
  uint64 peer_conn_open = 35 [deprecated = true];
  // Times the vote history file was written
  uint64 vote_history_file_written = 36;
  // Root of the last written vote history file, which votor waits to vote past, 0 if not written yet
