// The validator received a verified, deduplicated transaction
message Txn {
  // The source IP address of the transaction sender
  bytes source_ip = 1;
  // The source port of the transaction sender
  uint32 source_port = 2;
  // The protocol used to submit the transaction (e.g., QUIC, UDP, ...)
  TxnProtocol protocol = 3;
  // The ID of the bundle this transaction belongs to, if any.  Zero indicates not a bundle transaction
  uint64 bundle_id = 4;
  // The total number of transactions in the bundle this transaction belongs to, if any
  uint32 bundle_txn_count = 5;
  // The commission percentage for the bundle this transaction belongs to, if any
  uint32 bundle_commission = 6;
  // The public key of the commission recipient for the bundle this transaction belongs to, if any
  bytes bundle_commission_pubkey = 7;
  // The raw transaction payload bytes
  bytes payload = 8;
}

// The validator received a valid shred
message Shred {
  // The source IP address of the shred
  bytes source_ip = 1;
  // The source port of the shred
  uint32 source_port = 2;
  // The protocol used to send the shred
  ShredProtocol protocol = 3;
  // The raw shred payload bytes
  bytes payload = 4;
}

// The validator generated a vote transaction
message SignedVote {
  // Serialized signed vote transaction
  bytes signed_txn = 1;
  // The public key of the vote account
  bytes vote_account = 2;
  // The public key that authorized the vote
  bytes vote_authority = 3;
  // The public key that pays for transaction fees
  bytes fee_payer = 4;
  // Signature identifying the transaction
  bytes signature = 5;
  // Slot being voted on (top of tower)
  uint64 vote_slot = 6;
  // Bank hash of the slot being voted on
  bytes vote_bank_hash = 7;
  // Block ID of the slot being voted on
  bytes vote_block_id = 8;
  // Recent blockhash parameter of the vote transaction
  bytes txn_blockhash = 9;
  // Tower of slots being voted on (oldest to newest)
  repeated SignedVoteTower tower = 10;
}

// A block reached a commitment level. One row per block per level: a level crossed while the block is not tracked by local consensus (not yet replayed, or already discarded) reports once with forward true and bank_seq 0 and is not re-reported. Join to block_completed on bank_seq, or on slot and block_id (the only keys on forward rows).
message SlotConfirmed {
  // Bank sequence number, counting from 1 within a run; the join key to block_completed. Not meaningful across restarts: scope by the stream's instance id from the connection's authentication metadata (the boot id identifies the host kernel boot and survives validator restarts). 0 on forward rows. The boot bank (bank_seq 1) emits confirmations but no block_completed row. Forward confirmations for blocks never completely received join to no row on any key.
  uint64 bank_seq = 1;
  // Slot number of the block.
  uint64 slot = 2;
  // Block identifier; with slot, the alternate join key to block_completed.
  bytes block_id = 3;
  // Stake in lamports voted for this exact block when the row was emitted. Only the row that triggered a propagated/duplicate/optimistic/super confirmation crossed the level's threshold; ancestors confirmed transitively report their own smaller tally. processed rows carry 0: no replay votes exist yet at the block's own completion. rooted rows carry replay-observed vote stake for the block plus descendants, no threshold. 0 if unavailable.
  uint64 stake = 4;
  // Total cluster stake in lamports for the epoch the tally was made in (captured at replay completion for processed and rooted rows). 0 if unavailable.
  uint64 total_stake = 5;
  // Whether the block is eligible for fork choice. An equivocating block becomes eligible again once duplicate confirmed. Always true on forward and ignored rows; validity is not assessed for blocks consensus is not tracking.
  bool valid = 6;
  // Commitment level reached, weakest to strongest: processed, propagated, duplicate, optimistic, super, rooted. ignored is a terminal outcome, not a level. A block never named directly by any vote emits no propagated/duplicate/optimistic/super rows even when confirmed transitively through a descendant, and the transitive walk stops at it, so voted ancestors above it can miss those rows too; all still emit processed and rooted rows.
  SlotConfirmedLevel level = 7;
  // Whether the level was crossed by cluster votes (gossip, TPU, or replayed blocks) while the block was not tracked by local consensus: not yet replayed, or already discarded (pruned losing fork, or completed after the root passed it). Always false for processed, ignored, and rooted rows, which local replay or rooting triggers.
  bool forward = 8;
}

// A single accounts-database partition finished compacting. Compaction scans one partition, relocates its still-live account records forward into the next storage tier, and reclaims the partition. Emitted once per partition per compaction pass by the accdb tile. Partitions are large (e.g. 32 GiB) so this is a rare, coarse-grained event rather than a hot-path counter.
message AccdbCompactionCompleted {
  // Index of the partition that was compacted, identifying its slot in the accdb partition pool.
  uint64 partition_idx = 1;
  // Storage tier the partition was compacted from. Layer 0 is the hot tier that takes live execution writes; higher layers are progressively colder. Records are promoted one tier per compaction.
  uint32 src_layer = 2;
  // Storage tier the surviving live records were relocated into, normally src_layer+1, clamped at the coldest tier.
  uint32 dest_layer = 3;
  // Total bytes of account records walked in the partition this pass, live and dead combined. Equals the partition's written extent at the time compaction started.
  uint64 bytes_scanned = 4;
  // Dead bytes in the partition that triggered compaction: space held by account records that had been superseded by newer versions. This is the space compaction reclaims.
  uint64 bytes_freed = 5;
  // Number of still-live account records copied forward into dest_layer this pass.
  uint64 accounts_relocated = 6;
  // Total bytes of live account records copied forward into dest_layer this pass. Compare to bytes_scanned for the live fraction of the partition.
  uint64 bytes_relocated = 7;
  // Number of records skipped because no live index entry referenced them, i.e. records that were already superseded. Together with accounts_relocated this accounts for every record scanned.
  uint64 dead_records = 8;
  // Wall-clock time at which this compaction pass began, in nanoseconds since the Unix epoch.
  uint64 start_time = 9;
  // Wall-clock time at which this compaction pass completed, in nanoseconds since the Unix epoch. Subtract start_time for the pass duration.
  uint64 end_time = 10;
}

// The accounts database grew its backing file by one partition. The accounts DB is a single file divided into fixed-size partitions; when a write head runs off the end of the allocated file, a new partition is fallocated and the file grows. Emitted once per grow by the accdb tile. Partitions are large (e.g. 32 GiB) so grows are infrequent and each one is a meaningful step in the database's on-disk footprint.
message AccdbPartitionAdded {
  // Index of the newly allocated partition. Equals old_partition_max, i.e. it is appended at the end of the previously allocated range.
  uint64 partition_idx = 1;
  // Index of the partition the write head rotated off of to trigger this grow, i.e. the partition that just filled up. UINT64_MAX when there was no prior write head (the very first partition allocated on this layer).
  uint64 prior_partition_idx = 2;
  // Storage tier whose write head triggered the grow. Layer 0 is the hot tier fed by live execution writes; higher layers are colder compaction-destination tiers. A layer-0 grow means live ingest outran reclamation; a higher-layer grow means compaction is staging more cold data.
  uint32 layer = 3;
  // Number of allocated partitions before this grow.
  uint64 old_partition_max = 4;
  // Number of allocated partitions after this grow, always old_partition_max+1.
  uint64 new_partition_max = 5;
  // Size of a single partition in bytes; the increment by which the backing file grows.
  uint64 partition_sz = 6;
  // Total fallocated size of the accounts database file in bytes after this grow, equal to new_partition_max times partition_sz. Tracks the database's on-disk footprint over time.
  uint64 disk_allocated_bytes = 7;
  // Wall time the fallocate call that grew the file by this partition took, in nanoseconds. Slow filesystems can take seconds.
  uint64 duration_fallocate_nanos = 8;
  // True if the accdb tile grew the file ahead of any write head so a later rotation does not wait on fallocate. layer is then 0 and prior_partition_idx is UINT64_MAX, and neither names a triggering write head.
  bool preallocated = 9;
}

// Two different blocks (different block ids) were observed for the same slot. Emitted once when the validator first detects the equivocation, after both blocks are known.
message BlockEquivocated {
  // Sequence number of this validator's replayed block, joining to block_completed; zero if there is no local replayed bank (forward-confirmed or shred-proof detection).
  uint64 bank_seq = 1;
  // The slot that equivocates (has more than one block).
  uint64 slot = 2;
  // The slot number of the parent block.
  uint64 parent_slot = 3;
  // The epoch this slot belongs to.
  uint64 epoch = 4;
  // Identifier of the block this validator replayed for the slot.
  bytes block_id = 5;
  // Identifier of the conflicting block for the same slot; zero if not known (shred-proof detection).
  bytes sibling_block_id = 6;
  // This validator's bank hash for the block it replayed; zero if the block was not replayed locally.
  bytes bank_hash = 7;
  // Last microblock header hash of the block this validator replayed; zero if not replayed locally.
  bytes block_hash = 8;
  // Whether this validator produced the equivocating block it replayed.
  bool is_leader = 9;
  // Whether this validator had voted for its replayed block when the equivocation was detected.
  bool our_block_voted = 10;
  // Whether this validator's replayed block had been duplicate confirmed when the equivocation was detected.
  bool our_block_confirmed = 11;
  // Stake in lamports voted on the block this validator replayed at detection; zero if none/unknown. Typically small, as an equivocating block usually did not win confirmation.
  uint64 block_stake = 12;
  // Stake in lamports on the conflicting (typically confirmed) block at detection; zero if not known.
  uint64 sibling_stake = 13;
  // Total cluster stake in lamports at detection; the denominator for the stake fields. Zero if not known.
  uint64 total_stake = 14;
  // How the equivocation was detected.
  BlockEquivocatedDetection detection = 15;
}

// One row per dispatched transaction (committable or not), with the execution results
message RuntimeTxn {
  // Bank sequence number, counting from 1 within a run; the join key to block_completed. Not meaningful across restarts: scope by the stream's instance id from the connection's authentication metadata. 0 if unavailable.
  uint64 bank_seq = 1;
  // Bank slot in which this transaction was executed
  uint64 slot = 2;
  // 0-indexed position of this transaction within its block
  uint64 index_in_slot = 3;
  // 0-indexed commit-completion order within this slot
  uint64 commit_index_in_slot = 4;
  // FEC merkle root that was the current block_id of the bank when this txn was dispatched. All-zero on the leader path, which executes without FEC context.
  bytes fec_merkle_root = 5;
  // Epoch the transaction was executed in
  uint64 epoch = 6;
  // First signature of the transaction (64 bytes)
  bytes signature = 7;
  // Blockhash referenced by the transaction
  bytes blockhash = 8;
  // Fee-payer pubkey
  bytes fee_payer = 9;
  // True if the transaction was classified as a simple vote, false otherwise
  bool is_simple_vote = 10 [deprecated = true];
  // True if the transaction is part of a bundle, false otherwise
  bool is_bundle = 11;
  // True if the transaction was committable (landed on-chain)
  bool is_committable = 12;
  // True if the transaction landed but only fees were charged (e.g. account loading failure)
  bool is_fees_only = 13;
  // Transaction execution error
  RuntimeTxnTxnErr txn_err = 14;
  // Instruction execution error; success unless txn_err = instruction_error
  RuntimeTxnExecErr exec_err = 15;
  // Source kind of exec_err; none unless txn_err = instruction_error
  RuntimeTxnExecErrKind exec_err_kind = 16;
  // Instruction index that failed (UINT_MAX if not applicable)
  uint32 exec_err_idx = 17;
  // Custom error code returned by the program (UINT_MAX if not applicable)
  uint32 custom_err = 18;
  // Compute unit limit requested by the transaction
  uint64 compute_unit_limit = 19;
  // Compute unit price (micro-lamports per CU) requested by the transaction
  uint64 compute_unit_price = 20;
  // compute_unit_limit minus the remaining compute meter at commit
  uint64 compute_units_consumed = 21;
  // Requested heap size for the VM
  uint64 heap_size = 22;
  // Number of builtin program instructions in the transaction
  uint64 num_builtin_instrs = 23;
  // Number of BPF (non-builtin) program instructions
  uint64 num_non_builtin_instrs = 24;
  // Total bytes of account data loaded for this transaction
  uint64 loaded_accounts_data_size = 25;
  // Configured loaded-accounts-data-size limit for this transaction
  uint64 loaded_accounts_data_size_limit = 26;
  // Net delta in writable account data sizes during execution (negative when the writable account data net shrunk)
  sint64 accounts_resize_delta = 27;
  // Execution (base) fee charged to the fee payer, pre-burn (50% is burned at settlement)
  uint64 execution_fee = 28;
  // Priority fee charged to the fee payer, pre-burn (priority fees are not burned)
  uint64 priority_fee = 29;
  // Gross tips credited to tip accounts by this transaction, before the block-level tip commission
  uint64 tips = 30;
  // Number of signatures in the transaction
  uint64 signature_count = 31;
  // Cost-tracker signature cost
  uint32 cost_signature = 32;
  // Cost-tracker write-lock cost
  uint32 cost_write_lock = 33;
  // Cost-tracker data-bytes cost
  uint32 cost_data_bytes = 34;
  // Cost-tracker programs-execution cost
  uint32 cost_programs_execution = 35;
  // Cost-tracker loaded-accounts-data-size cost
  uint32 cost_loaded_accounts_data_size = 36;
  // Allocated accounts data size from the cost tracker
  uint64 cost_allocated_accounts_data_size = 37;
  // Per-account diffs for writable accounts that were modified
  repeated RuntimeTxnAccountDiffs account_diffs = 38;
  // Every account the transaction locked as writable
  repeated bytes writable_accounts = 39;
  // Every account the transaction locked as readonly, in account-order
  repeated bytes readonly_accounts = 40;
  // Distinct program pubkeys invoked at the top level of this transaction
  repeated bytes program_ids = 41;
}

// A block finished production, or replay on this validator, or was marked dead, or was abandoned before completing. A block gets a row if it was ever replayed or produced (had a bank), or if it finished reception on a fork that had already died or been discarded; a block dropped before reception finished gets no row.  Under alpenglow, fork knowledge is much more transient, so blocks that were never replayed due to a parent getting discarded gets no row, even if reception finished.  Delivery is best-effort: rows travel a lossy telemetry link, and a large burst of simultaneous rows (mass death of a fork) can drop some. On-chain data is deliberately not part of this event. Reception and repair tallies are best-effort: they restart if repair transiently stopped tracking the block (forest eviction), and on equivocated slots they are slot-scoped — shreds from all observed versions of the slot merge into the same counts on every version's row.
message BlockCompleted {
  // Bank sequence number, counting from 1 within a run; the join key to confirmation events. Not meaningful across restarts. 0 means no bank was ever allocated (a block completing reception under a dead or discarded lineage without ever getting a bank), leaving nothing to join on bank_seq; any forward confirmations for such a block join on slot and block_id. The boot bank (bank_seq 1) emits confirmation events but no block_completed row.
  uint64 bank_seq = 1;
  // Bank pool index the block was tracked under: the identifier log lines print. Instance-local and recycled across blocks within a run; correlate with logs only within one validator instance and time window. Reported whenever a bank existed (any row with nonzero bank_seq). The *_fork_id and cost_tracker_pool_idx columns are debug identifiers with the same scope, reported as held when the row was emitted, and 0 unless the block began replay or production (preparation_begin_time set).
  uint64 bank_idx = 2;
  // Transaction cache fork handle held by the bank. See bank_idx for scope.
  uint32 txncache_fork_id = 3;
  // Program cache fork handle held by the bank. See bank_idx for scope.
  uint64 progcache_fork_id = 4;
  // Account database fork handle held by the bank. See bank_idx for scope.
  uint32 accdb_fork_id = 5;
  // Vote stakes fork handle held by the bank. See bank_idx for scope.
  uint64 vote_stakes_fork_id = 6;
  // Deprecated collector overrides fork handle. Always 0.
  uint32 collector_overrides_fork_id = 7;
  // Stake rewards fork handle held by the bank. See bank_idx for scope.
  uint32 stake_rewards_fork_id = 8;
  // Epoch credits fork handle held by the bank. See bank_idx for scope.
  uint32 epoch_credits_fork_id = 9;
  // Stake delegations fork handle held by the bank. See bank_idx for scope.
  uint32 stake_delegations_fork_id = 10;
  // Cost tracker pool index the bank held: snapshotted just before the freeze releases it on completed rows, read live on dead and abandoned rows; 0 if the block never began replay or production. See bank_idx for scope.
  uint64 cost_tracker_pool_idx = 11;
  // Slot number of the block.
  uint64 slot = 12;
  // Epoch containing the slot.
  uint64 epoch = 13;
  // Slot number of the parent block. 0 if the parent was no longer locally known when the row was emitted; on genesis-booted clusters, 0 is also the genuine parent slot of blocks chaining directly off genesis.
  uint64 parent_slot = 14;
  // Finalized root slot when the row was emitted.
  uint64 root_slot = 15;
  // Lowest slot still held in memory when the row was emitted.
  uint64 storage_slot = 16;
  // Highest slot observed in completed FEC sets from the network (own leader blocks excluded) when the row was emitted: the validator's estimate of the cluster tip. Minus slot: how far behind this row was - 0 to 2 in steady state, large during boot catch-up and while racing back after any stall, re-detecting mid-run lag that caught_up cannot. 0 before any shred has been observed.
  uint64 turbine_slot = 17;
  // Whether the validator considered itself caught up to the cluster when the row was emitted. False from boot until replay closes on the network tip (set immediately for genesis bootstrap); never cleared within a run.
  bool caught_up = 18;
  // Number of forks executing concurrently when the row was emitted. 1 in calm operation; higher values mark fork storms, explaining replay contention, evictions, and prune bursts on the rows that suffered them.
  uint64 fork_width = 19;
  // Whether this validator was writing a snapshot when the row was emitted; snapshot creation periodically stalls replay, so timing outliers on these rows are expected. Always false when snapshot creation is unsupported or disabled.
  bool snapshot_in_progress = 20;
  // Banks allocated when the row was emitted: executing, awaiting replay, and completed or dead awaiting prune. Bank tracking pressure; blocks are evicted when this reaches the pool bound. fork_width isolates the concurrently-executing component.
  uint64 live_bank_count = 21;
  // Block identifier. For blocks that never completed reception (dead or abandoned early): the merkle root of the latest piece received.
  bytes block_id = 22;
  // Block id of the parent this block chained from, recovered from the reception chain; disambiguates the parent version when the parent slot equivocated. 0 if the reception chain could not be walked to the parent: reassembly no longer tracked the block, or an abandoned leader block that shredded nothing; parent_slot can still be known on such rows.
  bytes parent_block_id = 23;
  // Bank hash computed by replaying the block; the state commitment consensus votes on. Rows sharing slot and block_id but differing here indicate state divergence. 0 if the block never froze (dead or abandoned).
  bytes bank_hash = 24;
  // Whether the block was ruled invalid. Blocks merely given up on are not dead; see abandoned_reason. State accumulated before the ruling is still reported, so execution fields may be partially filled.
  bool dead = 25;
  // Why the block was ruled invalid; not_dead otherwise. Blocks this validator produced are never dead: they do not go through replay's block checks. A block invalid for several independent reasons records the first one detected locally, which can differ across validators for the same block.
  BlockCompletedDeadReason dead_reason = 26;
  // When the block was ruled invalid; 0 if not dead.
  uint64 dead_time = 27;
  // Whether this validator gave up on the block before it completed. Independent of dead: an abandoned block was not invalid. Equivalent to abandoned_reason != not_abandoned. State accumulated before abandonment is still reported, so execution fields may be partially filled.
  bool abandoned = 28;
  // Why this validator gave up on the block before it completed; not_abandoned otherwise. Independent of dead.
  BlockCompletedAbandonedReason abandoned_reason = 29;
  // When the block was abandoned; 0 if not abandoned.
  uint64 abandoned_time = 30;
  // Whether this validator produced the block as leader.
  bool is_leader = 31;
  // Network arrival at the shred tile of the block's first shred, stamped before signature verification. Leader blocks: when the first entry batch reached the shredding stage, before any network send. 0 if repair pruned the block before completion.
  uint64 first_shred_received_time = 32;
  // Network arrival of the shred that made the block contiguous; not necessarily the highest-numbered shred. Minus first_shred_received_time: reception duration, valid only when this is nonzero. Leader blocks: when the final entry batch reached the shredding stage. 0 if the block never became fully contiguous (dead or abandoned mid-reception) or repair pruned it before completion.
  uint64 last_shred_received_time = 33;
  // First repair request for a specific missing shred (window request); highest-shred and orphan requests do not stamp this, so it can be 0 while their request counts are not. 0 if no window request was sent or repair pruned the block; always 0 for leader blocks.
  uint64 first_repair_request_time = 34;
  // Arrival of the last repair response matched to an outstanding specific-shred request; shreds from highest-shred and orphan responses do not stamp this. 0 if none was matched or repair pruned the block; always 0 for leader blocks.
  uint64 last_repair_received_time = 35;
  // When the block's first complete FEC set reached replay, after verification and reassembly. Minus first_shred_received_time: internal pipeline latency from network to replay, valid only when both are nonzero. Leader blocks: when the block's own first FEC set returned to replay through reassembly; follows rather than precedes preparation_begin_time, since production shreds the block as it goes. 0 if no bank was ever allocated, and on abandoned leader blocks whose first FEC set had not returned through reassembly when production was abandoned.
  uint64 first_fec_set_received_time = 36;
  // When replay began setting up the block's execution state: cloning from the parent and applying start-of-block updates (epoch boundary processing, fee and rent state). Follows first_fec_set_received_time on replayed blocks; leader blocks reverse that order (see that field). Gap to first_transaction_scheduled_time: setup cost, which for leader blocks includes waiting for pack to schedule the first transaction; valid only when first_transaction_scheduled_time is nonzero. 0 if the block was dropped before setup.
  uint64 preparation_begin_time = 37;
  // When replay dispatched the block's first transaction to an execution tile. Leader blocks: when an execution tile began the first packed transaction. Execution and verification run from here to last_transaction_finished_time; equal to it if the block executed no transactions or, for leader blocks, if production timing was unavailable (see txn_timing). 0 on dead and abandoned rows if no transaction was ever dispatched.
  uint64 first_transaction_scheduled_time = 38;
  // When the block became fully executed and verified and end-of-block processing began: all execution and signature-verification results returned, the final FEC set received, PoH verified. At the live tip this trails the last execution result by trailing-tick reception and verification; per-transaction results are txn_timing.replayed_time. Leader blocks: when the block was fully produced (final PoH hash received, block id returned through reassembly), trailing the last execution result by the PoH tail and final-entry shredding, most visibly when a limit ended the block early. 0 if the block never finished executing (dead or abandoned).
  uint64 last_transaction_finished_time = 39;
  // When end-of-block processing finished and the block froze: state hashing complete, no further changes. Minus last_transaction_finished_time: finalization cost. 0 if the block never completed (dead or abandoned).
  uint64 block_completed_time = 40;
  // The parent's block_completed_time, denormalized to avoid a self-join; for blocks chaining directly off the snapshot or genesis boot bank, when the boot bank finished loading. 0 if the parent's completion was never observed: parent untracked, or parent never froze (dead or abandoned lineage). Slot-time queries (block_completed_time minus this) should filter on caught_up, parent_slot = slot - 1, and a nonzero value here.
  uint64 parent_block_completed_time = 41;
  // Number of FEC sets in the block; for blocks that never completed reception, the number delivered to replay when the row was emitted. 0 if reassembly no longer tracked the block when the row was emitted.
  uint64 fec_set_count = 42;
  // Data shreds received or recovered. Leader blocks: shreds produced. 0 if repair pruned the block before completion.
  uint32 data_shred_count = 43;
  // Parity (recovery) shreds received. Near 0 for leader blocks: only network echoes of the block's own parity shreds land here. 0 if repair pruned the block before completion.
  uint32 parity_shred_count = 44;
  // Shreds received over the network via turbine, plus repair deliveries whose provenance could not be verified (failed nonce) and coding shreds arriving in repair responses (nonconformant: repair serves only data shreds). Pieces cleared and re-fetched after a wrong-version detection or eviction count once per delivery, so source tallies can exceed the block's shred counts. Near 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 turbine_shred_count = 45;
  // Shreds obtained from peers via repair; nonce-verified deliveries only. Re-fetched pieces count once per delivery (see turbine_shred_count). Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_shred_count = 46;
  // Shreds reconstructed locally from parity data. Re-recovered pieces count once per recovery (see turbine_shred_count). Always 0 for leader blocks, which produce rather than recover their shreds. 0 if repair pruned the block before completion.
  uint32 recovered_shred_count = 47;
  // Whether every FEC set was verified to chain back to the confirmed block identity, i.e. the assembled data matches the block the cluster confirmed. Verification is confirmation-triggered and the value is snapshotted at the block's last received FEC set, so false means it had not run by then, not that it failed; at the live tip confirmation usually arrives later. Always false under alpenglow. True mainly when confirmation precedes reception completing, e.g. during catch-up. See lowest_verified_fec_index.
  bool chain_confirmed = 48;
  // Lowest FEC set index reached by chain verification as of the block's last received FEC set; the walk anchors at the confirmed block identity and works backwards. 0 means the whole block verified. 4294967295 means no verification information (verification never ran, or repair pruned the block); not a FEC index. Always 0 under alpenglow.
  uint32 lowest_verified_fec_index = 49;
  // FEC set index of the last piece of the block to complete reception, which with out-of-order repair need not be the block's final index. 4294967295 when the reception statistics are unpopulated; not a FEC index.
  uint32 last_completed_fec_set_index = 50;
  // Whether the shred marking the block complete was received. False if repair pruned the block before completion.
  bool slot_complete_flag = 51;
  // Whether any of the block's FEC sets was ever quarantined by an equivocation hold: set when a conflicting version of a FEC set was assembled at that position, and inherited by everything chaining onto or arriving during an unresolved conflict, including from ancestor slots; persists after resolution. A lone conflicting shred discarded before reassembly does not register. False if reassembly no longer tracked the block when the row was emitted.
  bool equivocation_detected_shred = 52;
  // Repair requests re-sent after a response timeout. Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_requests_retransmitted = 53;
  // Repair responses matched to an outstanding specific-shred request. Shreds delivered by verified highest-shred and orphan responses count in repair_shred_count but are not matched here, so this can be 0 while repair_shred_count is not. Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_responses_received = 54;
  // Repair requests for one specific missing shred, by index. Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_request_window_count = 55;
  // Repair requests for the highest-numbered shred a peer holds, used to learn the block's length. Highest-shred requests seeded at boot, before the block was tracked, bypass this counter. Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_request_highest_window_count = 56;
  // Repair requests for the block's ancestry when its parent is unknown; a response carries shreds from up to 11 ancestor blocks. Always 0 for leader blocks. 0 if repair pruned the block before completion.
  uint32 repair_request_orphan_count = 57;
  // Whether chain verification against the confirmed block identity found a mismatched (wrong-version) FEC held for this block; the piece was cleared and re-repaired, but may have arrived by any route, turbine included. Always false for leader blocks and under alpenglow. False if repair pruned the block before completion.
  bool repair_failed_chain_verify = 58;
  // Compute units used by all transactions, votes included; the vote/non-vote split is not part of this event. 0 if no cost tracker existed for the block (never prepared for replay, or no bank).
  uint64 cost_tracker_block_cost = 59;
  // New account data allocated, in bytes. 0 if no cost tracker existed for the block.
  uint64 cost_tracker_allocated_accounts_data_size = 60;
  // Block compute unit limit. 0 if no cost tracker existed for the block (never prepared for replay, or no bank).
  uint64 cost_tracker_block_cost_limit = 61;
  // Deprecated runtime vote compute unit limit. Always 0.
  uint64 cost_tracker_vote_cost_limit = 62;
  // Per-account compute unit limit. 0 if no cost tracker existed for the block.
  uint64 cost_tracker_account_cost_limit = 63;
  // When replay began block production for the slot, all prerequisites (e.g. parent block identity) in hand. Minus leader_slot_start_time: local production start delay. 0 for blocks this validator did not produce.
  uint64 became_leader_time = 64;
  // When the leader slot was scheduled to begin, estimated locally by projecting slot durations from the reset onto the parent fork; embeds upstream lateness rather than tracking a cluster-absolute timeline. 0 for blocks this validator did not produce.
  uint64 leader_slot_start_time = 65;
  // When block production began. 0 for blocks this validator did not produce.
  uint64 pack_start_time = 66;
  // When block production ended. 0 for blocks this validator did not produce.
  uint64 pack_end_time = 67;
  // Microblocks pack scheduled during production. A microblock whose transactions all failed execution is skipped at PoH mixin and absent from the block, so this can exceed block content. 0 for blocks this validator did not produce.
  uint64 microblock_count = 68;
  // Compute units pack reserved while building the block, votes included. Reservations are refunded as transactions finish, so this can exceed cost_tracker_block_cost (the charged amount) by refunds unsettled at slot end. 0 for blocks this validator did not produce.
  uint64 pack_block_cost = 69;
  // Deprecated (0) since Firedancer v26.11.
  uint64 pack_vote_cost = 70;
  // Bytes pack's cost model reserved for block content: transaction payloads plus a 48-byte header per microblock, net of rebates settled by slot end. Excludes tick entries; can exceed the block's actual content by rebates unsettled at slot end. A size, not a compute measure. 0 for blocks this validator did not produce.
  uint64 pack_data_bytes = 71;
  // Why block production stopped; not_leader for blocks this validator did not produce.
  BlockCompletedPackEndReason pack_end_reason = 72;
  // Bundled transactions pack scheduled during production, counted whether or not the bundle survived to the block (aborted bundles are skipped at PoH mixin). 0 for blocks this validator did not produce.
  uint64 bundle_txn_count = 73;
  // Per-transaction timestamps, one entry per transaction in block order. Replayed blocks: stamped by the replay scheduler. Leader blocks: stamped by the production pipeline. Columns exclusive to the other path are 0. Empty on dead and abandoned replay rows; an abandoned leader block reports the transactions mixed into the block before production was abandoned. Otherwise best-effort: empty when no capture slot was free (more than 16 blocks replaying at once) or the production timing table was unavailable. Empty does not mean the block had no transactions.
  repeated BlockCompletedTxnTiming txn_timing = 74;
  // Whether the block reached replay after a votor event named that block and we repaired that version, rather than through the version received over turbine. Always false before alpenglow, and false for blocks this validator produced as leader. A slot can report both, on separate rows.
  bool votor_repaired = 75;
  // Alpenglow ShredForBlockId requests, analogous to legacy window requests. Asks a peer for a specific missing shred, addressed by the block id it belongs to. Always 0 before alpenglow and for leader blocks.
  uint32 repair_request_shred_block_id_count = 76;
  // Alpenglow ParentAndFecCount requests, analogous to legacy orphan requests. Asks a peer for the block's parent and its FEC set count. Always 0 before alpenglow and for leader blocks.
  uint32 repair_request_parent_count = 77;
  // Alpenglow FecRoot requests: asks a peer for a FEC set's merkle root for a specified FEC set index. Always 0 before alpenglow and for leader blocks.
  uint32 repair_request_fec_root_count = 78;
}

// Reported once when the validator process starts. A wide fingerprint of the host, operating system, kernel, hardware, network, build, and validator configuration at launch.
message Boot {
  // Kernel release string, such as 6.1.0-1202605170043.el9.x86_64.
  bytes kernel_release = 1;
  // Full kernel build version string including build date and preemption model.
  bytes kernel_version = 2;
  // Processor vulnerabilities for which a kernel mitigation is active; mitigations in force split performance cohorts on otherwise identical hardware. Empty when every mitigation is disabled or the hardware is unaffected.
  repeated string mitigations = 3;
  // Short distribution identifier such as ubuntu, rhel, debian, or centos.
  bytes distro_id = 4;
  // Distribution version number, such as 22.04 or 9.4.
  bytes distro_version_id = 5;
  // Family of distributions this one derives from, such as debian or rhel.
  bytes distro_id_like = 6;
  // Which system C library the validator is running against.
  BootLibcKind libc_kind = 7;
  // Version of the system C runtime library, such as 2.34.
  bytes libc_version = 8;
  // The named hardware target the binary was compiled for, which fixes the minimum processor it can run on. Distinct from the live processor it is currently running on.
  BootBuildMachineTarget build_machine_target = 9;
  // The list of optional build features requested when the binary was compiled, such as sanitizers or coverage. Empty for a normal production build.
  bytes build_extras = 10;
  // Whether tracked files in the source tree had uncommitted changes when the binary was built, meaning the commit hash alone does not fully describe the code. Untracked files do not count.
  bool build_git_dirty = 11;
  // Which compiler family produced the binary.
  BootCompiler compiler = 12;
  // The exact version of the compiler that produced the binary.
  bytes compiler_version = 13;
  // When the binary was compiled; distinguishes rebuilds of the same commit, which build_git_dirty makes common on development builds.
  uint64 build_timestamp = 14;
  // Instruction set extensions the binary was compiled to use, such as avx512 or gfni; fixes the minimum processor the binary can run on and which accelerated code paths are compiled in.
  repeated string build_features = 15;
  // Processor architecture of the host.
  BootCpuArch cpu_arch = 16;
  // The maker of the processor.
  BootCpuVendor cpu_vendor = 17;
  // The full marketing name of the processor.
  bytes cpu_model_name = 18;
  // The processor family number identifying the broad generation of the chip.
  uint32 cpu_family = 19;
  // The numeric model identifier within the family, distinguishing specific chip designs.
  uint32 cpu_model_id = 20;
  // The silicon revision number of the processor, indicating minor hardware fixes within a model.
  uint32 cpu_stepping = 21;
  // The currently loaded microcode firmware revision of the processor, important because microcode updates change performance and security behavior.
  uint64 cpu_microcode_version = 22;
  // The total number of logical processors the operating system sees, counting each hardware thread separately.
  uint32 cpu_logical_count = 23;
  // The number of physical cores across all processor sockets, ignoring hardware threads.
  uint32 cpu_physical_core_count = 24;
  // The number of physical processor packages installed in the machine.
  uint32 cpu_socket_count = 25;
  // Whether simultaneous multithreading (hyperthreading) is currently enabled on the host.
  bool smt_active = 26;
  // The active frequency-scaling policy, which determines how aggressively the chip clocks up.
  BootCpufreqGovernor cpufreq_governor = 27;
  // The kernel driver controlling processor frequency scaling.
  BootCpufreqDriver cpufreq_driver = 28;
  // Energy-performance preference in force on the frequency driver; a balance profile under governor performance silently caps sustained clocks.
  BootCpuEnergyPerfPreference cpu_energy_perf_preference = 29;
  // The kernel driver managing processor idle low-power states.
  BootCpuIdleDriver cpu_idle_driver = 30;
  // Name of the deepest processor idle state currently enabled; deeper states add wake-up latency on pinned cores.
  bytes cpu_max_enabled_cstate = 31;
  // Total usable physical memory detected by the kernel at boot, in bytes.
  uint64 host_memory_bytes = 32;
  // Estimate of memory available for starting new applications without swapping at boot, in bytes.
  uint64 host_memory_available_bytes = 33;
  // For each logical processor, the memory locality domain it belongs to; joins tile placements against the locality of network and storage devices to find cross-domain pinning.
  repeated uint32 numa_cpu_to_node = 34;
  // Logical processors isolated from the kernel scheduler at boot by the isolcpus= kernel parameter. Isolation by the validator's cpuset partition is not listed here; see cpuset_partition.
  repeated uint32 isolated_cpus = 35;
  // Per-module memory inventory: mismatched speeds clock the whole bus down, and a module differing after a swap explains a machine that got slower after maintenance.
  repeated BootDmiDimms dmi_dimms = 36;
  // Inventory of physical network interfaces, each with its identity, driver, hardware location, link characteristics, queue configuration, and offload settings.
  repeated BootNicDevices nic_devices = 37;
  // Names of the physical member interfaces that make up the validator's bonded device.
  repeated bytes nic_bond_slaves = 38;
  // Bonding mode of the validator's bonded device, if bonded; kernel-bypass support and hashing behavior differ by mode.
  BootBondMode bond_mode = 39;
  // Index into nic_devices of the interface bound for the kernel-bypass path, the bond master entry when bonded; 255 when the bound interface is not in the inventory.
  uint32 bound_nic_idx = 40;
  // Whether the kernel just-in-time compiler for packet programs is enabled, which is needed for efficient kernel-bypass networking.
  uint32 net_bpf_jit_enable = 41;
  // System manufacturer of the physical machine, or the virtualization vendor when virtualized.
  bytes dmi_sys_vendor = 42;
  // Model or product name of the system, or a cloud instance product string.
  bytes dmi_product_name = 43;
  // Version string of the installed system firmware.
  bytes dmi_bios_version = 44;
  // Release date of the installed system firmware.
  bytes dmi_bios_date = 45;
  // Manufacturer of the motherboard.
  bytes dmi_board_vendor = 46;
  // Model or part name of the motherboard.
  bytes dmi_board_name = 47;
  // Physical chassis form factor of the host.
  BootDmiChassisType dmi_chassis_type = 48;
  // Input-output memory management unit state, which gates kernel-bypass zero-copy behavior and per-packet translation cost.
  BootIommuMode iommu_mode = 49;
  // Identity of the virtualization platform when virtualized, or none for bare metal.
  BootHypervisorVendor hypervisor_vendor = 50;
  // Whether the validator runs inside a container and which runtime, useful for distinguishing bare-metal from containerized deployments.
  BootContainerType container_type = 51;
  // Whether the validator is running inside a managed orchestration pod.
  bool kubernetes_pod = 52;
  // Hard memory limit imposed by the control group, 0 when unlimited; the ceiling the kernel kills at.
  uint64 cgroup_memory_limit_bytes = 53;
  // Memory throttle threshold imposed by the control group, 0 when unset; exceeding it forces reclaim stalls long before the hard limit kills.
  uint64 cgroup_memory_high_bytes = 54;
  // Swap limit imposed by the control group, 0 when swap is denied to the process even though the host has swap, UInt64 max when unlimited or no limit file exists.
  uint64 cgroup_swap_limit_bytes = 55;
  // Processor quota imposed by the control group in millicores, 0 when unlimited; a quota below the tile count strangles the validator.
  uint32 cgroup_cpu_quota_millicores = 56;
  // Inventory of storage devices, each with its identity, capacity, media type, transport, and configured input/output scheduler.
  repeated BootBlockDevices block_devices = 57;
  // Per non-volatile express device information.
  repeated BootNvmeDevices nvme_devices = 58;
  // Per-array software storage summary.
  repeated BootMdraidArrays mdraid_arrays = 59;
  // Filesystems the validator's directories live on, one entry per distinct mount; the directory index fields below point into this array.
  repeated BootFilesystems filesystems = 60;
  // Index into filesystems of the mount holding the accounts database; the database grows until write failures stall replay. 255 when unset or unresolved.
  uint32 accounts_fs_idx = 61;
  // Index into filesystems of the mount holding the snapshots directory; download plus unpack needs roughly twice the snapshot size, and running out mid-download is a leading boot failure. 255 when unset or unresolved.
  uint32 snapshots_fs_idx = 62;
  // Index into filesystems of the mount holding the log file, usually the root partition rather than the data disks. 255 when unset or unresolved.
  uint32 log_fs_idx = 63;
  // Index into filesystems of the mount holding the shred database. 255 when unset or unresolved.
  uint32 shredb_fs_idx = 64;
  // Index into filesystems of the mount holding the GUI database. 255 when unset or unresolved.
  uint32 guidb_fs_idx = 65;
  // The full resolved validator configuration serialized as text, capturing every effective setting after defaults, overrides, and system-derived values are merged. Filesystem paths, the user and host names, bind, listen, and advertised addresses, external service URLs, and gossip entrypoints are redacted.
  bytes resolved_config_json = 66;
  // The operator's own configuration file parsed and serialized as text: only the settings they explicitly override, before defaults are merged. Values whose keys suggest paths, addresses, hosts, users, servers, or secrets are redacted.
  bytes user_config_json = 67;
  // The full runtime topology serialized as text, capturing the complete wiring of the validator: a tiles list with each tile's kind, core assignment or floating flag, consumed and produced link lists, event link, and memory-object count; a links list, referenced from the tile link lists by position, with each link's kind, depth, message size and burst; and a workspaces list with each workspace's locality domain, page size, page count and footprint. This is the authoritative wiring fingerprint (memory-object assignments are summarized as a count); the scalar fields are derived summaries. Tile locality follows from the core assignment joined against numa_cpu_to_node. Newer builds add per tile core_shared (another concurrently running pinned tile is on the same physical core) and sibling_cpu (-1 when none).
  bytes topology_json = 68;
  // Total number of tiles in the running topology.
  uint32 tile_count = 69;
  // Total memory the validator locks at boot: workspaces, tile stacks, and private pages.
  uint64 memory_total = 70;
  // Gigantic pages the topology requires across all memory locality domains.
  uint64 memory_gigantic_pages = 71;
  // Huge pages the topology reserves in the hugetlbfs across all memory locality domains. Tile stack pages are reserved on every domain, since stack placement is only decided when a tile starts, so they are counted once per domain.
  uint64 memory_huge_pages = 72;
  // Normal pages the topology requires.
  uint64 memory_normal_pages = 73;
  // Wall-clock time at which the validator process itself was started.
  uint64 process_start_time = 74;
  // A numeric identifier summarizing the exact set of protocol features this build understands, used to detect when nodes disagree on consensus rules.
  uint32 feature_set_id = 75;
  // For each logical processor, the last-level cache domain it shares (one per AMD CCD or CCX, usually one per socket on Intel), numbered from 0 in first-seen order; tiles that exchange data cheaply sit in the same domain. 65535 for an offline processor. Empty when the kernel does not expose level-3 cache topology.
  repeated uint32 l3_cpu_to_domain = 76;
  // Instruction set extensions this processor supports, named as in build_features; one present here but missing from build_features means the binary was built for an older processor and runs slower code paths.
  repeated string cpu_features = 77;
  // For each logical processor, the physical core it runs on (keyed by package and core id), numbered from 0 in first-seen order; processors sharing a value are hyperthread siblings, so tiles on them compete for one core. 65535 for an offline processor or an unreadable core id.
  repeated uint32 cpu_to_core = 78;
  // Logical processors in the affinity the validator inherited from its launcher (taskset, systemd CPUAffinity, or a cgroup cpuset). Tiles without a core assignment run inside it; auto layout itself ignores it. Empty when it could not be read.
  repeated uint32 launch_cpus = 79;
  // Type of the validator's cpuset partition (the cgroup named after the instance that the cpuset configure stage creates), which isolates pinned tiles from other tasks at run time.
  BootCpusetPartition cpuset_partition = 80;
  // Logical processors effectively assigned to the validator's cpuset partition. Empty when there is none.
  repeated uint32 cpuset_partition_cpus = 81;
}

// The result of a snapshot production attempt.
message SnapshotCreated {
  // Snapshot production result.
  SnapshotCreatedResult result = 1;
  // The snapshot slot. The snapshot contains the chain state after replaying this slot.
  uint64 slot = 2;
  // For an incremental snapshot, the slot of the full snapshot it's based on. 0 for a full snapshot.
  uint64 base_slot = 3;
  // Final snapshot filename.
  bytes filename = 4;
  // Raw 32-byte snapshot hash (currently blake3_256(accounts_lthash)).
  bytes hash = 5;
  // Bank hash of the snapshot slot.
  bytes bank_hash = 6;
  // Block identifier (FEC set tree root) of the bank at the snapshot slot.
  bytes block_id = 7;
  // Raw 2048-byte accounts LtHash from the bank.
  bytes bank_accounts_lthash = 8;
  // Epoch number of snapshot slot.
  uint64 epoch = 9;
  // Block height at the snapshot slot (as seen in manifest).
  uint64 block_height = 10;
  // Total capitalization in lamports (as seen in manifest).
  uint64 capitalization = 11;
  // Cumulative number of historical transactions (as seen in manifest, unverified).
  uint64 transaction_count = 12;
  // Number of account records written to the snapshot. Full snapshots contain all live accounts; incremental snapshots contain accounts changed since base_slot.
  uint64 account_count = 13;
  // Number of zero-lamport account records written to the snapshot.
  uint64 tombstone_count = 14;
  // Number of non-tombstone account records read from the accounts database cache.
  uint64 cached_accounts_count = 15;
  // Number of non-tombstone account records read from accounts database disk storage.
  uint64 disk_accounts_count = 16;
  // Uncompressed serialized manifest payload size in bytes, excluding its TAR header and padding.
  uint64 manifest_size = 17;
  // Total uncompressed size in bytes of account records, including each record header and record alignment padding but excluding TAR headers and TAR padding.
  uint64 accounts_size = 18;
  // Uncompressed serialized status-cache payload size in bytes, excluding its TAR header and padding.
  uint64 status_cache_size = 19;
  // Final compressed snapshot file size in bytes, including archive data and skippable alignment frames.
  uint64 compressed_size = 20;
  // Total number of bytes produced by decompressing all Zstandard frames, including TAR headers and TAR padding but excluding skippable alignment frames.
  uint64 uncompressed_size = 21;
  // Number of Zstandard data frames in the snapshot file. Excludes skippable frames used for alignment padding.
  uint64 zstd_data_frame_count = 22;
  // Total compressed-file bytes occupied by Zstandard skippable frames used for alignment padding, including their 8-byte frame headers.
  uint64 zstd_padding_size = 23;
  // Zstandard compression window size in bytes.
  uint64 zstd_window_size = 24;
  // Zstandard compression strategy.
  SnapshotCreatedZstdStrategy zstd_strategy = 25;
  // Aggregate CPU time spent in Zstandard compression calls across snapshot producer threads, in nanoseconds.
  uint64 duration_compress_nanos = 26;
  // Aggregate time snapshot producer threads spent blocked on snapshot file writes, in nanoseconds.
  uint64 duration_io_blocked_nanos = 27;
  // Wall-clock time at which snapshot production began, in nanoseconds since the Unix epoch.
  uint64 start_time = 28;
  // Wall-clock time at which writing snapshot account records began, in nanoseconds since the Unix epoch.
  uint64 accounts_start_time = 29;
  // Wall-clock time at which snapshot production ended, in nanoseconds since the Unix epoch.
  uint64 end_time = 30;
}

// An admin command completed. Emitted once for every command processed by the running validator, whether it succeeded or failed.
message AdminCommand {
  // The admin command that was processed.
  AdminCommandType type = 1;
  // The result of processing the admin command.
  AdminCommandResult result = 2;
  // The command-specific result when result is custom.
  bytes custom_result = 3;
  // Wall-clock nanosecond unix timestamp at which the command started getting processed.
  uint64 start_time = 4;
  // Wall-clock nanosecond unix timestamp at which the command completed.
  uint64 end_time = 5;
  // Payload version requested by the command. Valid only when has_payload_version is true.
  uint64 payload_version = 6;
  // Whether the command payload was large enough to contain payload_version.
  bool has_payload_version = 7;
  // Size of the received command payload in bytes.
  uint64 payload_size = 8;
  // Command-specific public values serialized as JSON. Unavailable values are omitted. Private key material is never included.
  bytes args_json = 9;
}

// One row per block emitted with all the block-level diffs and results
message RuntimeBlock {
  // Monotonic sequence number identifying this block within the current run; the join key from runtime_txn / slot_confirmed / block_equivocated. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Block slot number
  uint64 slot = 2;
  // Block id of the slot. Under Tower this is the merkle root of the last FEC set (the last fec_merkle_roots entry). Under Alpenglow it is the block's double merkle root (DMR), which is not any FEC set's merkle root
  bytes block_id = 3;
  // Slot of the parent block
  uint64 parent_slot = 4;
  // Parent slot's block id
  bytes parent_block_id = 5;
  // Epoch this block belongs to
  uint64 epoch = 6;
  // Block height (count of ancestor blocks) of this block in the chain
  uint64 block_height = 7;
  // Scheduled leader identity pubkey for this block
  bytes leader = 8;
  // Bank hash of this slot
  bytes bank_hash = 9;
  // Bank hash of the parent slot
  bytes prev_bank_hash = 10;
  // Accounts lattice hash after this slot
  bytes accounts_lt_hash_checksum = 11;
  // Proof-of-history hash at the end of the slot (same as blockhash)
  bytes poh_hash = 12;
  // Decoded Clock sysvar for this slot
  RuntimeBlockClockSysvar clock_sysvar = 13;
  // Newest 151 entries of the blockhash queue at the end of this slot, newest first: exactly the blockhashes a transaction in a child block may reference (age <= 150 inclusive, matching the agave off-by-one in the transaction age check). The first entry is this block's blockhash.
  repeated bytes recent_blockhashes = 14;
  // Decoded RecentBlockhashes sysvar account content at the end of this slot, newest first (the newest 150 blockhash queue entries with their fee calculators)
  repeated RuntimeBlockRecentBlockhashesSysvar recent_blockhashes_sysvar = 15;
  // Highest hard fork slot less than or equal to bank slot
  uint64 last_restart_slot_sysvar = 16;
  // Total number of transactions committed in this block
  uint64 num_transactions = 17;
  // Number of transactions that committed with an error
  uint64 num_failed_txns = 18;
  // Number of non-vote transactions committed in this block
  uint64 num_nonvote_txns = 19;
  // Number of non-vote transactions that committed with an error
  uint64 num_nonvote_failed_txns = 20;
  // Total number of signatures processed in the block
  uint64 num_signatures = 21;
  // Number of data shreds making up this block
  uint64 num_shreds = 22;
  // Cumulative tick height at the end of this block
  uint64 tick_height = 23;
  // Total execution (base) fees collected in this block, pre-burn
  uint64 execution_fees = 24;
  // Total priority fees collected in this block (priority fees are not burned)
  uint64 priority_fees = 25;
  // Total gross tips credited to tip accounts in this block, before block-level tip commission
  uint64 tips = 26;
  // Lamports burned at fee settlement per the fee schedule (50% of execution fees). If the resolved fee collector fails validation the reward portion is also burned; that case shows up as leader_fee_reward with no matching other_diffs credit.
  uint64 fees_burned = 27;
  // Lamports owed for block production at fee settlement per the fee schedule (priority fees plus unburned execution fees). The actual credit is an other_diffs entry for the resolved fee collector: the leader identity, or the leader vote account's block-revenue collector when custom_commission_collector is active. If the collector fails validation this amount is burned instead and the collector's other_diffs entry shows no balance change.
  uint64 leader_fee_reward = 28;
  // Total lamport supply
  uint64 capitalization = 29;
  // Effective stake from stake delegations
  uint64 total_effective_stake = 30;
  // Stake activating during this slot's epoch
  uint64 total_activating_stake = 31;
  // Stake deactivating during this slot's epoch
  uint64 total_deactivating_stake = 32;
  // Total stake delegated to active vote accounts this epoch
  uint64 total_epoch_stake = 33;
  // Final per-account diff of every sysvar account written this block; repeated writes to the same sysvar (e.g. the stake history update then its rent-exemption top-up at an epoch boundary) are coalesced into one entry keeping the first pre-state and last post-state. Ordinary slots carry ~4 entries (Clock, SlotHashes, RecentBlockhashes, SlotHistory; LastRestartSlot only when it changes), boundary/PER slots 5-6. Overflow past the 16-account bound drops the entry with a validator log warning
  repeated RuntimeBlockSysvarDiffs sysvar_diffs = 34;
  // Final per-account diff of non-txn account updates that are not sysvar writes or epoch reward credits (both vote and stake epoch-reward credits are excluded here; see the runtime_reward table). Includes: the block fee credit at settlement (pubkey is the resolved fee collector: the leader identity unless custom_commission_collector routes it to the leader vote account's block-revenue collector; a zero-delta entry means collector validation failed and the reward burned), feature accounts at activation, core-BPF migration writes, and builtin program provisioning. Repeated writes to one account coalesce as in sysvar_diffs. Deliberately excluded as unbounded per-account floods: the per-account VAT-burn debits (see runtime_epoch.vat_burn_per_vote_account) and the per-block alpenglow cert-signer vote state rewrites. Steady state is one entry per block; 32 is an operational bound, not protocol-derived; overflow drops the entry with a validator log warning
  repeated RuntimeBlockOtherDiffs other_diffs = 35;
  // Total number of FEC sets observed while assembling this block (not capped by fec_merkle_roots)
  uint64 fec_count = 36;
  // Merkle roots of the FEC sets observed while assembling this block, in order. Truncated to the first 512 roots — exact for fixed-size FECs (a block has at most 512), a prefix for legacy variable-size FECs when fec_count exceeds 512. Under Tower the last entry equals block_id; under Alpenglow block_id is the separate DMR and is not present in this list
  repeated bytes fec_merkle_roots = 37;
}

// One row per epoch-reward credit to an account
message RuntimeReward {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot in which the credit was applied
  uint64 slot = 2;
  // Epoch the slot belongs to
  uint64 epoch = 3;
  // Type of reward credit
  RuntimeRewardKind kind = 4;
  // Credited account pubkey: the stake account, the vote account, or the vote account's inflation collector (see kind)
  bytes pubkey = 5;
  // Owner program of the credited account
  bytes owner = 6;
  // Lamports before the credit
  uint64 prev_lamports = 7;
  // Lamports after the credit
  uint64 lamports = 8;
  // Partitioned-rewards partition index this credit belongs to (0 for vote rewards)
  uint64 partition_idx = 9;
  // New credits_observed stored on the stake account (0 for vote rewards)
  uint64 credits_observed = 10;
  // Post-payout delegated stake written to the stake-delegations cache (0 for vote rewards)
  uint64 stake = 11;
}

// The complete history of the stake-delegations cache, one row per mutation: the baseline entries emitted once at boot (kind = bootup, one row per delegation in the finalized root cache after snapshot verification/refresh or genesis load, not the raw snapshot account stream), the entry rewrites applied by epoch-reward payouts (kind = reward), and the transaction-driven mutations emitted as the cache is updated at txn commit (kind = upsert / remove).
message RuntimeStakeDelegation {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot in which the mutating transaction was committed (the snapshot slot for bootup baseline entries; 0 for genesis-boot baselines)
  uint64 slot = 2;
  // Epoch the slot belongs to
  uint64 epoch = 3;
  // 0-indexed position of the mutating transaction within its block. UInt64 max for the non-transaction rows (bootup or reward kind)
  uint64 index_in_slot = 4;
  // First signature of the mutating transaction (64 bytes; zero for the non-transaction rows, bootup or reward kind)
  bytes signature = 5;
  // Type of the cache entry mutation
  RuntimeStakeDelegationKind kind = 6;
  // Stake account pubkey
  bytes stake_account = 7;
  // Vote account pubkey
  bytes vote_account = 8;
  // Delegated lamports written to the cache
  uint64 stake = 9;
  // Delegation activation epoch written to the cache
  uint64 activation_epoch = 10;
  // Delegation deactivation epoch written to the cache
  uint64 deactivation_epoch = 11;
  // Vote credits_observed written to the cache
  uint64 credits_observed = 12;
}

// One row per root advance with the post-apply cache invariants
message RuntimeRooted {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // Slot of the newly rooted block
  uint64 slot = 2;
  // Epoch the rooted slot belongs to
  uint64 epoch = 3;
  // Slot of the previous root
  uint64 prev_root_slot = 4;
  // Number of stake-delegations delta entries (non-tombstone) applied into the root map by this root advance. The advance covers every bank on (prev_root_slot, slot]. Each bank keeps at most one delta entry per stake account (last update wins), so this can be lower than the count of runtime_stake_delegation rows with kind upsert or reward whose slot is in that range when one account is mutated multiple times in a block.
  uint64 stake_delegations_upserts = 5;
  // Number of root stake-delegations removed by this root advance: tombstone delta entries (counted per account per bank, tombstones for accounts absent from the root map still count) plus any epoch-boundary inactive-stake prunes. Matches the count of runtime_stake_delegation rows with kind remove whose slot is in (prev_root_slot, slot] except when one account is removed more than once in a block.
  uint64 stake_delegations_removes = 6;
  // Total entries in the root stake-delegations cache after this advance
  uint64 stake_delegations_cnt = 7;
  // Root stake-delegations effective-stake total after this advance
  uint64 effective_stake = 8;
  // Root stake-delegations activating-stake total after this advance
  uint64 activating_stake = 9;
  // Root stake-delegations deactivating-stake total after this advance
  uint64 deactivating_stake = 10;
  // Block id (final FEC merkle root) of the newly rooted block
  bytes block_id = 11;
}

// One row per epoch boundary with all the epoch-level diffs and results
message RuntimeEpoch {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // First replayed slot of the epoch-boundary bank (the bank that crosses into this epoch); with skipped slots this is not necessarily the epoch's nominal first slot
  uint64 slot = 2;
  // Parent slot on this fork (the last replayed slot of the previous epoch)
  uint64 parent_slot = 3;
  // The new epoch being entered; the boundary snapshot captures stakes as of the end of epoch - 1
  uint64 epoch = 4;
  // Effective stake across all delegations, recomputed with warmup/cooldown math at this boundary
  uint64 total_effective_stake = 5;
  // Stake activating during the new epoch, recomputed at this boundary
  uint64 total_activating_stake = 6;
  // Stake deactivating during the new epoch, recomputed at this boundary
  uint64 total_deactivating_stake = 7;
  // Total stake delegated to the valid vote accounts snapshotted at this boundary
  uint64 total_epoch_stake = 8;
  // Vote accounts seen while accumulating delegations at this boundary
  uint64 num_staked_vote_accounts = 9;
  // Vote accounts in the final boundary snapshot
  uint64 num_vote_accounts = 10;
  // Vote accounts that passed the validator-admission-ticket filters and were offered to the top-votes set
  uint64 num_top_votes_eligible = 11;
  // Smallest stake in the final boundary snapshot - the effective admission threshold
  uint64 top_votes_min_stake = 12;
  // Decoded StakeHistory sysvar entry appended at this boundary
  RuntimeEpochStakeHistorySysvar stake_history_sysvar = 13;
  // Decoded EpochSchedule sysvar
  RuntimeEpochEpochScheduleSysvar epoch_schedule_sysvar = 14;
  // Feature ids newly activated at this boundary. The 16-entry bound is operational, not protocol-derived (no boundary on a real cluster has come close); overflow drops the entry with a validator log warning
  repeated bytes feature_activations = 15;
  // Decoded EpochRewards sysvar as initialized at this boundary
  RuntimeEpochEpochRewardsSysvar epoch_rewards_sysvar = 16;
  // Lamports burned from every admitted vote account at this boundary (SIMD-0357 VAT; alpenglow only, 0 otherwise). The burned set is exactly this boundary's runtime_vote_account rows, so the aggregate burned is this value times that row count. The debits are not emitted as account diffs, and the incinerator credit is not observable in runtime_block.other_diffs either: the incinerator is drained to zero later in the same block by fd_runtime_freeze, so its coalesced diff is 0 -> 0
  uint64 vat_burn_per_vote_account = 17;
}

// One row per vote account per epoch boundary: the per-account vote-cache snapshot taken as the boundary is crossed
message RuntimeVoteAccount {
  // Monotonic sequence number identifying this block within the current run; the join key to runtime_block. Restarts at 1 each time a snapshot is loaded, so pair it with the stream's boot id. 0 means unavailable.
  uint64 bank_seq = 1;
  // First replayed slot of the new epoch
  uint64 slot = 2;
  // The new epoch being entered; the snapshot captures this account's stake as of the end of epoch - 1
  uint64 epoch = 3;
  // Vote account
  bytes pubkey = 4;
  // Validator identity pubkey
  bytes node_account = 5;
  // Effective stake delegated to this vote account at this boundary
  uint64 stake = 6;
  // Commission read from the vote account at this boundary (basis points)
  uint32 commission_bps = 7;
  // True if the account existed in the snapshot taken one boundary earlier
  bool has_commission_t_2 = 8;
  // Commission recorded one boundary earlier (0 unless has_commission_t_2)
  uint32 commission_t_2_bps = 9;
  // True if the account existed in the snapshot taken two boundaries earlier
  bool has_commission_t_3 = 10;
  // Commission recorded two boundaries earlier (0 unless has_commission_t_3)
  uint32 commission_t_3_bps = 11;
  // Commission the reward calculation will actually use for this epoch's vote rewards: the oldest available of t-3 / t-2 / current when delay_commission_updates is active, current otherwise
  uint32 reward_commission_bps = 12;
  // Cumulative vote credits at this boundary
  uint64 credits = 13;
  // Cumulative vote credits at the start of the latest epoch-credits ladder entry
  uint64 prev_credits = 14;
  // Entries in the vote account's epoch-credits ladder at this boundary
  uint64 epoch_credits_cnt = 15;
}

// An Alpenglow consensus vote we received from a peer or cast ourselves (see our_vote). Unparseable votes are not included. The row timestamp is when we finished processing the vote; the *_time columns are the phases before it, each running until the next. References: Table 6, Definition 12, Algorithm 1, Lemma 48
message AlpenglowVote {
  // Which slot the vote is for.
  uint64 slot = 1;
  // Which block the vote is for (only for notar and notar_fallback, all zeros otherwise).
  bytes block_id = 2;
  // Where the voter ranks in the slot's epoch (only if ranked, 65535 otherwise). Also marks their position in the Cert array
  uint32 voter_rank = 3;
  // Validator identity of the voter, looked up from voter_rank in the slot's epoch (all zeros if voter_rank is 65535).
  bytes voter_identity = 4 [deprecated = true];
  // What kind of vote is this.
  AlpenglowVoteKind kind = 5;
  // IPv4 address of the peer we received the vote from; ourselves if our_vote, stored as an IPv4-mapped IPv6 address (all zeros if unknown).
  bytes received_from_ip = 6;
  // Validator identity of the peer we received the vote from (determined from the QUIC client-side TLS certificate); ourselves if our_vote (all zeros if unknown_peer). This is the voter whenever voter_rank is set, since votes are only accepted from their voter.
  bytes received_from_identity = 7;
  // Whether this is our own vote, which we store like any other; received_from_identity is then our identity.
  bool our_vote = 8;
  // Why we cast the vote, based on the Alpenglow voting algorithm (not_our_vote if it is not ours). References: Algorithms 1 and 2, Definitions 15, 16 and 17.
  AlpenglowVoteReason reason = 9;
  // Who we sent the vote to, by rank like voters: identity and address at each rank, all zeros where we did not send (only if our_vote, empty otherwise).
  repeated AlpenglowVoteBroadcastTo broadcast_to = 10;
  // What we did with the vote. unknown_peer and banned_peer are decided on the connection before the vote is decoded, shred_version_mismatch and unranked_peer after decoding, in that order; the rest are Alpenglow-specific validation.
  AlpenglowVoteProcessingResult processing_result = 11;
  // Final votes for the slot reached 60% of stake (Table 6). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_final_cert = 12;
  // Notar votes for block_id reached 80% of stake (Table 6). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_fast_final_cert = 13;
  // Notar votes for block_id reached 60% of stake (Table 6). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_notar_cert = 14;
  // Notar and notar-fallback votes for block_id reached 60% of stake (Table 6). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_notar_fallback_cert = 15;
  // Skip and skip-fallback votes for the slot reached 60% of stake (Table 6). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_skip_cert = 16;
  // Notar votes for block_id reached 40% of stake, or 20% with skip votes bringing the total to 60% (Definition 16). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_safe_to_notar = 17;
  // Skip votes plus notar votes for every block but the most-voted one reached 40% of stake (Definition 16). Crossing a quorum triggers BLS verification of the votes (see verify_start_time).
  bool quorum_reached_safe_to_skip = 18;
  // When we started aggregating the vote into the running BLS aggregate for its slot, kind and block (only if processing_result is accepted, 0 otherwise).
  uint64 aggregation_start_time = 19;
  // When we started BLS verifying the aggregate this vote completed (only if this vote brought a tally to a quorum of Table 6 or Definition 16, which is when we verify signatures, 0 otherwise).
  uint64 verify_start_time = 20;
  // When we started broadcasting the vote to our peers (only if our_vote, 0 otherwise).
  uint64 broadcast_start_time = 21;
  // When we finished processing the vote, may be any of the above stages including short-circuiting at earlier stages.
  uint64 done_time = 22 [deprecated = true];
}

// An Alpenglow consensus cert we received from a peer or constructed ourselves (see our_cert). Unparseable certs are not included. The row timestamp is when we finished processing the cert; the *_time columns are the phases before it, each running until the next. References: Table 6, Definition 12, Algorithm 1, Lemma 48
message AlpenglowCert {
  // Which slot the cert is for.
  uint64 slot = 1;
  // Which block the cert is for (only for fast_final, notar and notar_fallback, all zeros otherwise).
  bytes block_id = 2;
  // What kind of cert is this.
  AlpenglowCertKind kind = 3;
  // Which validators' primary votes the cert aggregates (NotarVote for notar, fast_final and notar_fallback; FinalVote for final; SkipVote for skip), as a bitmap over the voter's rank in the slot's epoch: rank r is bit r%8 of byte r/8, bytes through the highest signer.
  bytes voters = 4;
  // Fallback signer set (NotarFallbackVote for notar_fallback, SkipFallbackVote for skip), a bitmap by rank like voters. Empty for other kinds.
  bytes fallback_voters = 5;
  // IPv4 address of the peer that relayed the cert to us; ourselves if our_cert, stored as an IPv4-mapped IPv6 address (all zeros if unknown).
  bytes relayer_ip = 6;
  // Validator identity of the peer that relayed the cert to us (determined from the QUIC client-side TLS certificate); ourselves if our_cert (all zeros if unknown_peer). Not necessarily the creator of the cert: a node re-broadcasts the first valid cert it obtains (whether from self or others).
  bytes relayer_identity = 7;
  // Whether we constructed the cert ourselves from the votes we had received, rather than a peer delivering it first. Not every cert is self-made; when it is, we reached the threshold before any peer's copy arrived, i.e. we are running fast.
  bool our_cert = 8;
  // Who we sent the cert to, indexed by rank like voters: identity and address at each rank, all zeros where we did not send (only if our_cert, empty otherwise).
  repeated AlpenglowCertBroadcastTo broadcast_to = 9;
  // What we did with the cert. unknown_peer and banned_peer are decided on the connection before the cert is decoded, shred_version_mismatch and unranked_peer after decoding, in that order; the rest are Alpenglow-specific.
  AlpenglowCertProcessingResult processing_result = 10;
  // When we started BLS verifying the cert (unset if our_cert).
  uint64 verify_start_time = 11;
  // When we started broadcasting the cert to our peers, BLS verification having finished (only if our_cert, 0 otherwise).
  uint64 broadcast_start_time = 12;
  // When we finished processing the cert, may be any of the above stages including short-circuiting at earlier stages.
  uint64 done_time = 13 [deprecated = true];
}

// A block that completed reception on this validator or was abandoned and pruned.  A block gets a row if it received a shred marked as final in the slot, and received all shreds up to the final shred, or if it was incomplete but collected later during pruning. Tallies are best-effort: on equivocated slots, shreds shared between versions of the slot may merge or double count. Delivery is best-effort: rows travel a lossy telemetry link, so a block_completed row can arrive without its block_received row or vice versa.
message BlockReceived {
  // Slot number of the block.
  uint64 slot = 1;
  // Block identifier; with slot, the alternate join key to block_completed. For blocks that never completed reception (or were abandoned early), this can be the null hash.
  bytes block_id = 2;
  // Slot number of the block's parent. If unknown, this will be UINT64_MAX, and likely means that a block header could not be parsed for this slot.
  uint64 parent_slot = 3;
  // Block identifier of the block's parent. If unknown, this will be the null hash, and likely means that a block header could not be parsed for this slot.
  bytes parent_block_id = 4;
  // Whether the block was cancelled due to a notar version becoming known. These blocks will only get reported if they are eventually pruned, so if the root does not advance, they will not be reported.
  bool cancelled = 5;
  // The reason the block was no longer attempted to be repaired.
  BlockReceivedCancelledReason cancelled_reason = 6;
  // When the block was cancelled. Only turbine versions are cancelled. Occurs when a votor-driven version of the slot arrives while this version's block id is still unknown, or for invalid turbine blocks. 0 if not cancelled.
  uint64 cancelled_time = 7;
  // Either reached SafeToNotar locally or attached to a NotarFallback or stronger cert, rather than being the version received over turbine. Always false for blocks this validator produced as leader. A slot can report both a notarized and a non-notarized version, on separate rows.
  bool notarized = 8;
  // Whether the block was produced as leader.
  bool is_leader = 9;
  // Whether the validator considered itself caught up to the cluster when the row was emitted. False from boot until rotor/repair closes on the network tip (set immediately for genesis bootstrap); otherwise during regular operation is set to True if the highest slot the validator has received completely is no more than one leader window behind its view of the current cluster slot.
  bool caught_up = 10;
  // Number of FEC sets in the block; for blocks that never completed reception, this could be 0 if the shred with the slot_complete flag never arrived.
  uint64 fec_set_count = 11;
  // Network arrival at the shred tile of the block's first shred, stamped before signature verification. Leader blocks: when the first entry batch reached the shredding stage, before any network send.
  uint64 first_shred_received_time = 12;
  // Network arrival of the shred that made the block contiguous; not necessarily the highest-numbered shred. Minus first_shred_received_time: reception duration, valid only when this is nonzero. Leader blocks: when the final entry batch reached the shredding stage. 0 if the block never became fully contiguous (pruned or abandoned mid-reception).
  uint64 last_shred_received_time = 13;
  // First repair request for a specific missing shred (window or ShredForBlockId request); highest-shred, orphan, ParentAndFecCount and FecRoot requests do not stamp this, so it can be 0 while their request counts are not. 0 if no window or ShredForBlockId request was sent; always 0 for leader blocks.
  uint64 first_repair_request_time = 14;
  // Network arrival at the shred tile of the last repair response matched to an outstanding specific-shred request; other responses do not stamp this. 0 if none was matched; always 0 for leader blocks.
  uint64 last_repair_received_time = 15;
  // Network arrival at the rotor tile of the block's first verified getParentAndFecCount or FecRoot response, including a FecRoot answer for a FEC set already held. 0 if no verified metadata response was received.
  uint64 first_meta_received_time = 16;
  // Shreds received over the network via turbine, plus repair deliveries whose provenance could not be verified (failed nonce) and coding shreds. Near 0 for leader blocks.
  uint32 turbine_shred_received = 17;
  // Parity (recovery) shreds received. Near 0 for leader blocks: only network echoes of the block's own parity shreds land here.
  uint32 parity_shred_received = 18;
  // Shreds obtained from peers via repair; nonce-verified deliveries only. Re-fetched pieces count once per delivery. Always 0 for leader blocks.
  uint32 repair_shred_received = 19;
  // Shreds reconstructed locally from parity data. Always 0 for leader blocks, which produce rather than recover their shreds.
  uint32 recovered_shred_count = 20;
  // FEC set index of the last piece of the block to complete Reed-Solomon reconstruction, which with out-of-order repair need not be the block's final index. UINT32_MAX if no FEC set was completed.
  uint32 last_completed_fec_set_index = 21;
  // Whether the shred marking the block complete was received, or it became known through a getParentAndFecCount request.
  bool slot_complete = 22;
  // Whether equivocating shreds were detected on this slot before any notarized version arrived.
  bool equivocation_detected_shred = 23;
  // Repair responses matched to an outstanding specific-shred request. Shreds delivered by verified highest-shred and orphan responses count in repair_shred_received but are not matched here, so this can be 0 while repair_shred_received is not. Always 0 for leader blocks.
  uint32 repair_shred_responses_received = 24;
  // Metadata responses matched to an outstanding getParentAndFecCount request that pass proof-check.
  uint32 parent_fec_count_responses_received = 25;
  // Metadata responses matched to an outstanding FecRoot request that pass proof-check.
  uint32 fec_root_responses_received = 26;
  // Repair requests for one specific missing shred, by index. Always 0 for leader blocks.
  uint32 repair_request_window_count = 27;
  // Repair requests for the highest-numbered shred a peer holds, used to learn the block's length. Highest-shred requests seeded at boot, before the block was tracked, bypass this counter. Always 0 for leader blocks.
  uint32 repair_request_highest_window_count = 28;
  // Repair requests for the block's ancestry when its parent is unknown; a response carries shreds from up to 11 ancestor blocks. Always 0 for leader blocks.
  uint32 repair_request_orphan_count = 29;
  // Alpenglow ShredForBlockId requests, analogous to legacy window requests. Asks a peer for a specific missing shred, addressed by the block id it belongs to. Always 0 before Alpenglow and for leader blocks.
  uint32 repair_request_shred_for_block_id_count = 30;
  // Alpenglow ParentAndFecCount requests, analogous to legacy orphan requests. Asks a peer for the block's parent and its FEC set count. Always 0 before Alpenglow and for leader blocks.
  uint32 repair_request_parent_fec_count = 31;
  // Alpenglow FecRoot requests. Asks a peer for the merkle root of the FEC set at a given index. Always 0 before Alpenglow and for leader blocks.
  uint32 repair_request_fec_root_count = 32;
  // Per-FEC-set reception detail, one entry per FEC set in block order: which pieces made up the block, how each arrived, and when. Summed, the counts may reconcile with the block-level shred counts on this row, except in the case of equivocation where FEC sets may be shared between versions of the slot. Best-effort for pruned incomplete blocks: empty does not mean the block had no FEC sets, but that the FEC may have been pruned before it was able to be reported.
  repeated BlockReceivedFecSets fec_sets = 33;
}

// Metrics of one net tile instance, one row per sweep
message MetricsNet {
  // Identifier shared by every row of one sweep
  uint64 sample_id = 1;
  // Why a metrics sweep was taken
  MetricsSampleReason sample_reason = 2;
  // Slot that triggered the sweep, 0 for periodic sweeps
  uint64 sample_slot = 3;
  // Snapshot load state
  MetricsSnapctLoadState sample_snapct_state = 4;
  // Whether replay had caught up to the cluster tip when the sweep was taken (replay IsCaughtUp); set once per run, never cleared
  bool sample_caught_up = 5;
  // Tile instances in the sweep, to detect partial sweeps
  uint64 sample_tile_cnt = 6;
  // Index of this tile instance among tiles of its kind
  uint64 kind_id = 7;
  // Process ID of the tile
  uint64 pid = 8;
  // Thread ID of the tile. Same as Pid in production, but might differ in development
  uint64 tid = 9;
  // CPU the tile last ran on
  uint64 last_cpu_index = 10;
  // counter: cumulative since tile start, query deltas. Involuntary context switches
  uint64 context_switch_involuntary = 11;
  // counter: cumulative since tile start, query deltas. Voluntary context switches
  uint64 context_switch_voluntary = 12;
  // counter: cumulative since tile start, query deltas. Major page faults
  uint64 page_fault_major = 13;
  // counter: cumulative since tile start, query deltas. Minor page faults
  uint64 page_fault_minor = 14;
  // Tile lifecycle state: 0=booting, 1=running, 2=shutdown
  MetricsNetState state = 15;
  // Last wall-clock time the tile heartbeated
  uint64 heartbeat_time = 16;
  // Whether the tile is currently backpressured
  bool is_backpressured = 17;
  // counter: cumulative since tile start, query deltas. Times the tile waited for one or more consumers to catch up to resume publishing
  uint64 backpressure = 18;
  // Tile wall time, by regime; regimes are exhaustive and groups Busy, Idle, Backpressure and Housekeeping partition it
  MetricsNetRegimeDurationNanos regime_duration_nanos = 19;
  // Thread wall time since start, by scheduler state; Idle is the remainder, so parts sum to about the lifetime.  User, System and Interrupt have 10 ms resolution; Interrupt is 0 unless it is the only live tile pinned to its CPU
  MetricsNetThreadDurationNanos thread_duration_nanos = 20;
  // Times the tile tried to park while idle (efficient mode), by result
  MetricsNetParkAttempted park_attempted = 21;
  // counter: cumulative since tile start, query deltas. Device IRQs on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 device_irq = 22;
  // counter: cumulative since tile start, query deltas. TLB shootdowns on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 tlb_shootdown = 23;
  // counter: cumulative since tile start, query deltas. Local timer interrupts (LOC) on the tile's dedicated CPU, 0 unless it is the only live tile pinned there
  uint64 timer_irq = 24;
  // Packets successfully published to output links
  uint64 pkt_rx = 25;
  // Bytes of packets successfully published to output links
  uint64 pkt_rx_bytes = 26;
  // Received packets dropped, by reason
  MetricsNetPktRxDropped pkt_rx_dropped = 27;
  // Times RX stalled because the fill ring had no room; the packet stays in the RX ring and is retried (kernel drops are XdpRxRingFullDropped)
  uint64 rx_fill_ring_stalled = 28;
  // Receive buffers currently in use
  uint64 rx_buffer_used = 29;
  // Receive buffers currently free
  uint64 rx_buffer_free = 30;
  // Packet transmit jobs submitted
  uint64 pkt_tx_submitted = 31;
  // Packet transmit jobs marked as completed by the kernel
  uint64 pkt_tx_completed = 32;
  // Bytes of packets submitted for transmission
  uint64 pkt_tx_submitted_bytes = 33;
  // Transmit jobs dropped, by reason
  MetricsNetPktTxDropped pkt_tx_dropped = 34;
  // Transmit buffers currently in use
  uint64 tx_buffer_used = 35;
  // Transmit buffers currently free
  uint64 tx_buffer_free = 36;
  // XSK sendto syscalls dispatched; in busy-poll mode each also counts in XskSyscallRx
  uint64 xsk_syscall_tx = 37;
  // XSK recvmsg syscalls dispatched
  uint64 xsk_syscall_rx = 38;
  // Dropped for other reasons (xdp_statistics_v0.rx_dropped)
  uint64 xdp_rx_other_dropped = 39;
  // Dropped due to invalid descriptor (xdp_statistics_v0.rx_invalid_descs)
  uint64 xdp_rx_invalid_descriptor_dropped = 40;
  // Dropped due to invalid descriptor (xdp_statistics_v0.tx_invalid_descs)
  uint64 xdp_tx_invalid_descriptor_dropped = 41;
  // Dropped due to rx ring being full (xdp_statistics_v1.rx_ring_full)
  uint64 xdp_rx_ring_full_dropped = 42;
  // counter: cumulative since tile start, query deltas. Times the kernel found the fill ring empty (xdp_statistics_v1.rx_fill_ring_empty_descs)
  uint64 xdp_rx_fill_ring_empty = 43;
  // counter: cumulative since tile start, query deltas. Times the kernel found the TX ring empty (xdp_statistics_v1.tx_ring_empty_descs)
  uint64 xdp_tx_ring_empty = 44;
  // GRE packets decapsulated and published; subset of PktRx
  uint64 gre_pkt_rx = 45;
  // GRE packet transmit jobs submitted; subset of PktTxSubmitted
  uint64 gre_pkt_tx_submitted = 46;
  // IPv4 routes installed in the forwarding table
  MetricsNetRouteCount route_count = 47;
}

