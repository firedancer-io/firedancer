  BOOT_CPU_ENERGY_PERF_PREFERENCE_BALANCE_POWER = 3;  // Bias favoring power saving.
  BOOT_CPU_ENERGY_PERF_PREFERENCE_POWER = 4;  // Maximum power saving.
