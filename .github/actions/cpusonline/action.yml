name: cpusonline
description: 'Dissolve isolated cpuset partitions left behind by a previous job'
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -x
        # A validator or test that died mid-run leaves its isolated cpuset
        # partition, which removes its CPUs from every other cgroup and
        # breaks CPU pinning for subsequent jobs on this runner.
        for cg in /sys/fs/cgroup/*/cpuset.cpus.partition; do
          [ -e "$cg" ] || continue
          grep -q isolated "$cg" || continue
          dir="$(dirname "$cg")"
          while read -r pid; do
            echo "$pid" | sudo tee /sys/fs/cgroup/cgroup.procs > /dev/null || true
          done < "$dir/cgroup.procs"
          sudo rmdir "$dir" || true
        done
