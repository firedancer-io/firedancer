name: deps
description: 'Build and cache dependencies'
inputs:
  deps-script-path:
    description: 'Path of deps.sh script'
    required: true
    default: './deps.sh'
  deps-bundle-path:
    description: 'Path of deps-bundle.sh script'
    required: true
    default: './contrib/deps-bundle.sh'
  extras:
    description: Extra flags
    required: true
    default: ''
  compiler:
    description: 'The compiler to use'
    required: true
    default: 'gcc'
    type: choice
    options:
      - gcc
      - clang
  compiler-version:
    description: 'The compiler version to use'
    required: true
    default: 'system'
outputs: {}
runs:
  using: composite
  steps:
    - name: Has apt-get?
      shell: bash
      run: |
        if command -v apt-get > /dev/null 2>&1; then
          echo "HAS_APT_GET=1" >> $GITHUB_ENV
        else
          echo "HAS_APT_GET=0" >> $GITHUB_ENV
        fi

    - name: Set extras key value
      shell: bash
      id: extras_trimmed
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        key=$(echo "$EXTRAS" | sed 's/[[:space:]]//g')
        echo "extras_key=$key" >> $GITHUB_OUTPUT

    - name: apt-get update
      shell: bash
      run: sudo apt-get update
      if: env.HAS_APT_GET == '1'

    - id: deps-sh-hash
      shell: bash
      env:
        DEPS_SCRIPT_PATH: ${{ inputs.deps-script-path }}
      run: cat /etc/os-release "$DEPS_SCRIPT_PATH" | sha256sum | awk '{print "HASH=" $1}' >> "$GITHUB_OUTPUT"

    - id: deps-sh-cache
      uses: corca-ai/local-cache@v2
      with:
        base: "${{ runner.tool_cache }}/cache"
        path: deps-bundle.tar.zst
        key: deps-sh-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ inputs.compiler-version }}-${{ steps.extras_trimmed.outputs.extras_key }}-${{ steps.deps-sh-hash.outputs.HASH }}
        clean-key: deps-sh

    - name: Install system level dependencies
      shell: bash
      env:
        DEPS_SCRIPT_PATH: ${{ inputs.deps-script-path }}
      run: FD_AUTO_INSTALL_PACKAGES=1 "$DEPS_SCRIPT_PATH" check

    - name: Install dependencies from cache
      shell: bash
      run: tar -Izstd -xvf deps-bundle.tar.zst
      if: steps.deps-sh-cache.outputs.cache-hit == 'true'

    - name: Install dependencies from scratch
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
        COMPILER_VERSION: ${{ inputs.compiler-version }}
        CXX: ${{ inputs.compiler == 'gcc' && 'g++' || 'clang++' }}
        DEPS_SCRIPT_PATH: ${{ inputs.deps-script-path }}
        DEPS_BUNDLE_PATH: ${{ inputs.deps-bundle-path }}
        EXTRAS: ${{ inputs.extras }}
      run: |
        if [[ "$COMPILER_VERSION" != "system" ]]; then
          source /opt/${COMPILER}/${COMPILER}-${COMPILER_VERSION}/activate
        fi
        CC="$COMPILER" \
        CXX="$CXX" \
        FD_AUTO_INSTALL_PACKAGES=1 \
        "$DEPS_SCRIPT_PATH" $EXTRAS fetch install
        "$DEPS_BUNDLE_PATH"
      if: steps.deps-sh-cache.outputs.cache-hit != 'true'
