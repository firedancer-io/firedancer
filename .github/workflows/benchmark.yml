name: Benchmark
on:
  workflow_call:
    inputs:
      machine:
        type: string
        default: native
      github-token:
        type: string
        required: true
        description: 'GitHub token for posting comments'
      snapshot-ledger:
        type: string
        default: testnet-438272759-snapload
        description: 'load-only testnet ledger (genesis.bin + full snapshot) for the snapshot row'
  workflow_dispatch:
    inputs:
      snapshot-ledger:
        type: string
        default: testnet-438272759-snapload

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bench-replay:
    runs-on:
      labels: [self-hosted, 512G]
      group: fd-public-repo
    timeout-minutes: 6
    env:
      CC: gcc
      MACHINE: ${{ inputs.machine }}
      BENCH_DIR: ${{ github.workspace }}/../bench
      DUMP_DIR: ${{ github.workspace }}/../dump

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/hugepages
      with:
        # DO NOT CHANGE: higher reservations OOM-kill other jobs on the CI runners
        count_gigantic: 398
        count_huge: 1024
    - uses: ./.github/actions/cpusonline
    - uses: actions/setup-node@v7

    # BENCH_DIR is a sibling of the checkout so it survives the main/PR
    # checkouts (realpath: upload-artifact rejects `..`).  The PR's bench
    # scripts are copied out so both sides are built by the same build.sh.
    - name: Prepare
      run: |
        sudo rm -f $DUMP_DIR/accounts.db            # left by a job that died mid-backtest
        rm -rf $BENCH_DIR && mkdir -p $BENCH_DIR
        echo BENCH_DIR=$(realpath $BENCH_DIR) >> $GITHUB_ENV
        cp -r contrib/ci/bench $BENCH_DIR/tools
        BASE_SHA=${{ github.event.pull_request.base.sha }}  # fixed per event, so all three jobs compare against the same main
        [ -n "$BASE_SHA" ] || { git fetch --depth=1 origin main; BASE_SHA=$(git rev-parse FETCH_HEAD); }  # workflow_dispatch
        echo BASE_SHA=$BASE_SHA >> $GITHUB_ENV
        echo HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }} >> $GITHUB_ENV
        { hostname; lscpu | grep -E "Model name|^CPU\(s\)|NUMA node"; cat /sys/devices/system/cpu/cpu1/cpufreq/scaling_governor /sys/devices/system/cpu/cpufreq/boost; uname -r; grep MemAvailable /proc/meminfo; lsblk -o NAME,MODEL,SCHED,ROTA; sudo dmsetup table | sed 's/ [0-9a-f]\{32,\} / <key> /'; grep -m1 -A8 'name *: xts(aes)' /proc/crypto | grep driver; grep -H . /sys/block/nvme*/queue/max_sectors_kb; } > $BENCH_DIR/runner.txt 2>&1 || true

    - name: Update PR comment (running)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        JOB: replay
        STATUS: running
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const { execSync } = require('child_process');
          execSync(`python3 contrib/ci/bench/benchmark_comment.py rows --job ${process.env.JOB} --bench-dir ${process.env.BENCH_DIR} --head ${process.env.HEAD_SHA} --base ${process.env.BASE_SHA} --run-id ${context.runId} --status ${process.env.STATUS} > ${process.env.BENCH_DIR}/rows.${process.env.JOB}.json`, { stdio: 'inherit' });
          const upsert = require(`${process.env.GITHUB_WORKSPACE}/contrib/ci/bench/upsert.js`);
          await upsert({ github, context, core, exec }, { rowsFile: `${process.env.BENCH_DIR}/rows.${process.env.JOB}.json` });

    - run: $BENCH_DIR/tools/bench.sh build new

    - name: Checkout main
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BASE_SHA }}
        clean: false
    - run: $BENCH_DIR/tools/bench.sh build base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        clean: false

    # Publishes compile/binsize/mem rows before the replays run.
    - name: Update PR comment (partial)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        JOB: replay
        STATUS: partial
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const { execSync } = require('child_process');
          execSync(`python3 contrib/ci/bench/benchmark_comment.py rows --job ${process.env.JOB} --bench-dir ${process.env.BENCH_DIR} --head ${process.env.HEAD_SHA} --base ${process.env.BASE_SHA} --run-id ${context.runId} --status ${process.env.STATUS} > ${process.env.BENCH_DIR}/rows.${process.env.JOB}.json`, { stdio: 'inherit' });
          const upsert = require(`${process.env.GITHUB_WORKSPACE}/contrib/ci/bench/upsert.js`);
          await upsert({ github, context, core, exec }, { rowsFile: `${process.env.BENCH_DIR}/rows.${process.env.JOB}.json` });

    - run: contrib/ci/bench/bench.sh replay base
      continue-on-error: true  # a baseline that cannot run is not the PR's fault; its rows stay pending
    - run: contrib/ci/bench/bench.sh replay new

    - name: Update PR comment (done)
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        JOB: replay
        STATUS: ${{ job.status == 'success' && 'done' || 'failed' }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const { execSync } = require('child_process');
          execSync(`python3 contrib/ci/bench/benchmark_comment.py rows --job ${process.env.JOB} --bench-dir ${process.env.BENCH_DIR} --head ${process.env.HEAD_SHA} --base ${process.env.BASE_SHA} --run-id ${context.runId} --status ${process.env.STATUS} > ${process.env.BENCH_DIR}/rows.${process.env.JOB}.json`, { stdio: 'inherit' });
          const upsert = require(`${process.env.GITHUB_WORKSPACE}/contrib/ci/bench/upsert.js`);
          await upsert({ github, context, core, exec }, { rowsFile: `${process.env.BENCH_DIR}/rows.${process.env.JOB}.json` });

    # always(): a timeout counts as cancelled and its logs matter most.
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bench-replay-${{ github.run_id }}
        path: |
          ${{ env.BENCH_DIR }}
          !${{ env.BENCH_DIR }}/*/bin/**
        retention-days: 90
        overwrite: true


  bench-snapshot:
