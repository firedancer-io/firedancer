name: Benchmark
# NOISE EXPERIMENT (draft PR, not for merge): each job runs the bench row with
# origin/main vs window-aligned bencho timer in A/B pairs; see contrib/ci/bench/experiment.sh.
on:
  workflow_call:
    inputs:
      machine:
        type: string
        default: native
      github-token:
        type: string
        required: true
      snapshot-ledger:
        type: string
        default: testnet-438272759-snapload

permissions:
  contents: read

jobs:
  x-replay-1:
    runs-on:
      labels: [self-hosted, 512G]
      group: fd-public-repo
    timeout-minutes: 40
    env:
      CC: gcc
      MACHINE: native
      BENCH_DIR: ${{ github.workspace }}/../bench
      DUMP_DIR: ${{ github.workspace }}/../dump
      BENCH_SNAP_LEDGER: testnet-438272759-snapload
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: ./.github/actions/hugepages
      with:
        # DO NOT CHANGE: higher reservations OOM-kill other jobs on the CI runners
        count_gigantic: 398
        count_huge: 1024
    - uses: ./.github/actions/cpusonline
    - name: Prepare
      run: |
        sudo rm -f $DUMP_DIR/accounts.db
        rm -rf $BENCH_DIR && mkdir -p $BENCH_DIR
        echo BENCH_DIR=$(realpath $BENCH_DIR) >> $GITHUB_ENV
        { hostname; lscpu | grep -E "Model name|^CPU\(s\)"; uname -r; } > $BENCH_DIR/runner.txt 2>&1 || true
    - run: contrib/ci/bench/bench.sh build new
    - run: contrib/ci/bench/experiment.sh 12
    - if: always()
      run: |
        echo 1 | sudo tee /sys/devices/system/cpu/cpufreq/boost
        sudo killall firedancer-dev 2>/dev/null || true
        sudo rm -f $DUMP_DIR/accounts.db /dev/shm/fd-bench-shreds.db
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: x-replay-1-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ env.BENCH_DIR }}
          !${{ env.BENCH_DIR }}/*/bin/**
        retention-days: 30

