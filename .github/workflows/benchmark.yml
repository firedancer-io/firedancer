    - run: $BENCH_DIR/tools/bench.sh build new

    - name: Checkout main
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BASE_SHA }}
        clean: false
    - run: $BENCH_DIR/tools/bench.sh build base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        clean: false

    - run: contrib/ci/bench/bench.sh snapshot base
      continue-on-error: true  # a baseline that cannot run is not the PR's fault; its rows stay pending
    - run: contrib/ci/bench/bench.sh snapshot new

    - name: Update PR comment (done)
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        JOB: snapshot
        STATUS: ${{ job.status == 'success' && 'done' || 'failed' }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const { execSync } = require('child_process');
          execSync(`python3 contrib/ci/bench/benchmark_comment.py rows --job ${process.env.JOB} --bench-dir ${process.env.BENCH_DIR} --head ${process.env.HEAD_SHA} --base ${process.env.BASE_SHA} --run-id ${context.runId} --status ${process.env.STATUS} > ${process.env.BENCH_DIR}/rows.${process.env.JOB}.json`, { stdio: 'inherit' });
          const upsert = require(`${process.env.GITHUB_WORKSPACE}/contrib/ci/bench/upsert.js`);
          await upsert({ github, context, core, exec }, { rowsFile: `${process.env.BENCH_DIR}/rows.${process.env.JOB}.json` });

    # always(): a timeout counts as cancelled and its logs matter most.
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bench-snapshot-${{ github.run_id }}
