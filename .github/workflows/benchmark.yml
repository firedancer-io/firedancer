        { hostname; lscpu | grep -E "Model name|^CPU\(s\)|NUMA node"; cat /sys/devices/system/cpu/cpu1/cpufreq/scaling_governor /sys/devices/system/cpu/cpufreq/boost; uname -r; grep MemAvailable /proc/meminfo; lsblk -o NAME,MODEL,SCHED,ROTA; sudo dmsetup table | sed 's/ [0-9a-f]\{32,\} / <key> /'; grep -m1 -A8 'name *: xts(aes)' /proc/crypto | grep driver; grep -H . /sys/block/nvme*/queue/max_sectors_kb; } > $BENCH_DIR/runner.txt 2>&1 || true

    - name: Update PR comment (running)
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
